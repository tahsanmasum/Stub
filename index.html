    const payStep = '<div class="promo-row"><label class="sr" for="promo-' + ev.id + '">Promo code</label><input class="input" id="promo-' + ev.id + '" name="promoInput" placeholder="' + T('Promo code (optional)', 'প্রোমো কোড (ঐচ্ছিক)') + '" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase"><button type="button" class="btn btn-line" data-promo>' + T('Apply', 'প্রয়োগ') + '</button></div><div class="small" data-promo-msg style="margin:-8px 0 14px"></div>' +

    const extra = Math.max(0, ev.teamMin - 1);

    const members = team ? '<div class="field" data-field="members"><span class="label">Other members</span><div class="hint">' +
      (ev.teamMin === ev.teamMax ? 'Add ' + (ev.teamMax - 1) + ' more, besides you.' : 'You count as one. Add up to ' + (ev.teamMax - 1) + ' more' + (ev.teamMin > 1 ? ', at least ' + (ev.teamMin - 1) : '') + '.') + '</div>' +

      '<label class="check" style="margin-top:12px"><input type="checkbox" name="inviteLater"><span>' + T('I will invite teammates with a link after registering', 'নিবন্ধনের পর লিংক দিয়ে সদস্যদের আমন্ত্রণ জানাব') + '</span></label></div>' : '';

    const questions = qs.map((q) => {
      const n = 'q_' + q.id;

      if (q.type === 'textarea') return field({ name: n, label: q.label, type: 'textarea', req: q.required });
      return field({ name: n, label: q.label, type: q.type === 'url' ? 'url' : q.type === 'number' ? 'number' : 'text', req: q.required, placeholder: q.type === 'url' ? 'https://' : '' });
    }).join('');

    const cd = '<div class="countdown" data-countdown role="timer" aria-label="Time left to register"><div><b>00</b><span>days</span></div><div><b>00</b><span>hours</span></div><div><b>00</b><span>min</span></div><div><b>00</b><span>sec</span></div></div>';

    return cd + '<form id="reg-form" novalidate data-steps="' + steps.join(',') + '">' +
      '<div class="steps" aria-hidden="true">' + steps.map((s, i) => '<span class="' + (i === 0 ? 'on' : '') + '"></span>').join('') + '</div>' +
      steps.map((s, i) => '<div class="form-step' + (i === 0 ? ' on' : '') + '" data-step="' + s + '"><div class="step-title">' + stepName[s] + '<span>Step ' + (i + 1) + ' of ' + steps.length + '</span></div>' +
        (s === 'you' ?
          field({ name: 'name', label: team ? 'Your name (team lead)' : 'Full name', req: true, attrs: 'autocomplete="name"' }) +
          field({ name: 'email', label: 'Email', type: 'email', req: true, hint: 'Your ticket is tied to this address.', attrs: 'autocomplete="email"' }) +
          field({ name: 'phone', label: 'Phone', type: 'tel', req: true, placeholder: '01XXXXXXXXX', attrs: 'autocomplete="tel" inputmode="tel"' }) +
          field({ name: 'institution', label: 'School, college or university', req: true, list: 'inst-list', attrs: 'autocomplete="organization"' }) +
          '<datalist id="inst-list">' + [...new Set(Store.regs.map((r) => r.institution).filter(Boolean))].slice(0, 40).map((i) => '<option value="' + esc(i) + '">').join('') + '</datalist>' +
          field({ name: 'level', label: 'Class or level', type: 'select', options: LEVELS, req: true, placeholder: 'Choose one' })
        : s === 'details' ?
          (team ? field({ name: 'teamName', label: 'Team name', req: true }) + members : '') + questions
        : s === 'payment' ? payStep
        : '<div data-review></div><div data-clash></div>' +
          '<label class="check" style="margin:6px 0 4px"><input type="checkbox" name="agree"><span>I have read the rules, and I will bring my student ID on the day.</span></label><div class="field" data-field="agree" style="margin:6px 0 10px"><div class="msg"></div></div>' +
          '<div class="msg" data-submit-err style="color:var(--bad);font-size:14px;margin-bottom:10px"></div>') +
        '<div class="form-actions">' + (i > 0 ? '<button type="button" class="btn btn-line" data-back>Back</button>' : '') +
        (s === 'review' ? '<button type="submit" class="btn btn-ink">' + (st.key === 'waitlist' ? 'Join the waitlist' : 'Get my ticket') + '</button>' : '<button type="button" class="btn btn-ink" data-next>Continue</button>') +
        '</div></div>').join('') +
      '<p class="fine">' + T((ev.fee ? 'Entry fee ' + Fmt.money(ev.fee) + (ev.teamMax > 1 ? ' per team' : '') + ', paid by ' + [...methods.map((m) => m.type), ...(ev.allowCash ? ['cash at the desk'] : [])].join(', ').replace(/, ([^,]*)$/, ' or $1') + '. ' : 'No fee for this one. ') + 'You can edit or cancel your registration from your ticket until ' + Fmt.when(ev.deadline) + '.' + ((Store.settings.policy || {}).saveDrafts !== false ? ' Your progress is saved on this device, and organizers can see unfinished forms so they can help you finish.' : ''),
        (ev.fee ? 'এন্ট্রি ফি ' + Fmt.money(ev.fee) + (ev.teamMax > 1 ? ' (প্রতি দল)' : '') + ', ' + [...methods.map((m) => m.type), ...(ev.allowCash ? ['ডেস্কে নগদ'] : [])].join(', ') + ' দিয়ে পরিশোধযোগ্য। ' : 'এই ইভেন্টে কোনো ফি নেই। ') + Fmt.when(ev.deadline) + ' পর্যন্ত টিকিট থেকে নিবন্ধন সম্পাদনা বা বাতিল করা যাবে।' + ((Store.settings.policy || {}).saveDrafts !== false ? ' আপনার অগ্রগতি এই ডিভাইসে সংরক্ষিত থাকে, এবং অসম্পূর্ণ ফর্ম আয়োজকরা দেখতে পান যাতে আপনাকে সাহায্য করতে পারেন।' : '')) + '</p>' +
      '</form>';
  }

  const memberRow = (i, val, locked) => '<div class="member-row"><label class="sr" for="m' + i + '">Member ' + (i + 2) + '</label><input class="input" id="m' + i + '" name="member" placeholder="Member ' + (i + 2) + ' full name" value="' + esc(val) + '">' +
    (locked ? '' : '<button type="button" class="btn btn-line" data-remove-member aria-label="Remove member">' + UI.icon.x + '</button>') + '</div>';

  function readForm(form, ev) {
    const g = (n) => { const el = form.elements[n]; return el ? String(el.value || '').trim() : ''; };
    const answers = {};
    (ev.questions || []).forEach((q) => { answers[q.id] = g('q_' + q.id); });
    return {
      name: g('name'), email: g('email').toLowerCase(), phone: g('phone').replace(/[\s-]/g, ''), institution: g('institution'), level: g('level'),
      teamName: g('teamName'), members: $$('input[name="member"]', form).map((i) => i.value.trim()).filter(Boolean), answers,
      payment: ev.fee > 0 ? { method: g('payMethod'), sender: g('paySender').replace(/[\s-]/g, ''), trxId: g('trxId').toUpperCase().replace(/\s+/g, '') } : null,
      agree: form.elements.agree ? form.elements.agree.checked : false,
      inviteLater: form.elements.inviteLater ? form.elements.inviteLater.checked : false,
      promo: form.dataset.promo || ''
    };
  }

  function validate(form, ev, step) {
    const d = readForm(form, ev); let ok = true;
    const err = (n, m) => { UI.setErr(form, n, m); if (m) ok = false; };
    if (step === 'you') {
      err('name', d.name.length < 3 ? 'Write your full name, at least 3 letters.' : '');
      err('email', !EMAIL.test(d.email) ? 'That email does not look right. Check for typos.' : '');
      err('phone', !PHONE.test(d.phone) ? 'Use an 11-digit Bangladeshi number, like 01712345678.' : '');
      err('institution', d.institution.length < 3 ? 'Tell us where you study.' : '');
      err('level', !d.level ? 'Choose your class or level.' : '');
    }
    if (step === 'details') {
      if (ev.teamMax > 1) {
        err('teamName', d.teamName.length < 2 ? 'Give your team a name.' : '');
        const total = d.inviteLater ? ev.teamMin : d.members.length + 1;
        err('members', total < ev.teamMin ? 'Add ' + (ev.teamMin - total) + ' more ' + (ev.teamMin - total === 1 ? 'member' : 'members') + '. This event needs at least ' + ev.teamMin + '.' : total > ev.teamMax ? 'Teams can have at most ' + ev.teamMax + ' people.' : '');
      }
      (ev.questions || []).forEach((q) => {
        const v = d.answers[q.id];
        let m = '';
        if (q.required && !v) m = 'This one is required.';
        else if (v && q.type === 'url' && !/^https?:\/\/\S+\.\S+/.test(v)) m = 'Paste a full link starting with https://';
        else if (v && q.type === 'number' && isNaN(Number(v))) m = 'Numbers only.';
        err('q_' + q.id, m);
      });
    }
    if (step === 'payment' && form.dataset.promoFree === '1') return true;
    if (step === 'payment') {
      const pm = d.payment || {};
      err('payMethod', !pm.method ? 'Choose a payment method.' : '');
      if (pm.method && pm.method !== 'Cash') {
        err('paySender', !PHONE.test(pm.sender) ? 'Enter the 11-digit number you sent money from.' : '');
        let m = '';
        if (!/^[A-Z0-9]{8,12}$/.test(pm.trxId)) m = 'TrxIDs are 8 to 12 letters and numbers. Copy it from the SMS.';
        else if (Store.regs.some((r) => r.payment && r.payment.trxId === pm.trxId && r.status !== 'cancelled')) m = 'This TrxID was already used. Check the SMS again.';
        err('trxId', m);
      }
    }
    if (step === 'review') err('agree', !d.agree ? 'Tick this box to continue.' : '');
    if (!ok) { const f = form.querySelector('.form-step.on .field.err input, .form-step.on .field.err select, .form-step.on .field.err textarea'); if (f) f.focus(); }
    return ok;
  }

  function payCard(ev, type, amt) {
    const fee = amt == null ? ev.fee : amt;
    if (type === 'Cash') return '<div class="pay-card" style="--pc:' + PAY_COLORS.Cash + '"><div class="small muted">Pay at the registration desk</div><div class="amt">' + Fmt.taka(fee) + '</div><p class="small" style="margin:10px 0 0">Your seat is held now. Pay in cash when you arrive; the desk checks you in after payment.</p></div>';
    const m = Store.payMethods().find((x) => x.type === type); if (!m) return '';
    const verb = m.accountType === 'Merchant' ? 'Make Payment' : 'Send Money';
    return '<div class="pay-card" style="--pc:' + (PAY_COLORS[m.type] || 'var(--accent)') + '"><div class="small muted">Send exactly</div><div class="amt">' + Fmt.taka(fee) + (fee !== ev.fee ? ' <s class="small faint">' + Fmt.taka(ev.fee) + '</s>' : '') + '</div>' +
      '<div class="num"><span>' + esc(m.number) + '</span><button type="button" class="btn btn-line btn-xs" data-copy="' + esc(m.number.replace(/\D/g, '')) + '">Copy</button></div>' +
      '<div class="small">' + esc(m.type) + ' ' + esc(m.accountType || 'Personal') + (m.name ? ', ' + esc(m.name) : '') + '</div>' +
      '<ol><li>Open ' + esc(m.type) + ' and choose ' + verb + '.</li><li>Send ' + Fmt.taka(fee) + ' to the number above.</li><li>Copy the TrxID from the SMS and paste it below with the number you paid from.</li></ol>' +
      (m.instructions ? '<p class="small muted" style="margin:10px 0 0">' + esc(m.instructions) + '</p>' : '') + '</div>';
  }

  function wireForm(form, ev, onDirty) {
    const steps = form.dataset.steps.split(',');
    let cur = 0, started = false, saveT = 0, promoAmt = null;
    const stepTitles = $$('.form-step .step-title', form).map((t) => t.firstChild.textContent);
    const saved = Store.formDraft.get(ev.id), u = Store.user;
    const fill = (n, v) => { const el = form.elements[n]; if (el && v != null && el.type !== 'hidden' && !(el instanceof RadioNodeList)) el.value = v; };
    if (saved) {
      Object.entries(saved).forEach(([k, v]) => { if (k === 'members' || k === 'answers' || k === 'payment') return; fill(k, v); });
      Object.entries(saved.answers || {}).forEach(([k, v]) => fill('q_' + k, v));
      const box = $('[data-members]', form);
      if (box && saved.members) { saved.members.forEach((m, i) => { let inp = box.querySelectorAll('input')[i]; if (!inp && i < ev.teamMax - 1) { box.insertAdjacentHTML('beforeend', memberRow(i, '', false)); inp = box.querySelectorAll('input')[i]; } if (inp) inp.value = m; }); }
      if (saved.payment && saved.payment.sender) fill('paySender', saved.payment.sender);
      form.insertAdjacentHTML('afterbegin', '<p class="small muted" style="margin:-8px 0 14px">We restored what you typed last time. <button type="button" class="link" data-restart>Start over</button></p>');
    } else if (u) {
      ['name', 'email', 'phone', 'institution', 'level'].forEach((k) => fill(k, u[k]));
    }
    if (u && form.elements.email) { form.elements.email.value = u.email; form.elements.email.readOnly = true; }
    const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => { const d = readForm(form, ev); delete d.agree; if (d.payment) delete d.payment.trxId; Store.formDraft.set(ev.id, d); }, 300); };
    const pushDraft = (i) => { const d = readForm(form, ev); if (EMAIL.test(d.email)) Store.saveDraft(ev.id, { ...d, step: i + 1, stepName: stepTitles[i] }); };
    const pickPay = (type) => {
      $$('[data-pm]', form).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pm === type)));
      form.elements.payMethod.value = type;
      $('[data-pay-card]', form).innerHTML = payCard(ev, type, promoAmt);
      $('[data-pay-fields]', form).hidden = type === 'Cash';
      UI.setErr(form, 'payMethod', '');
    };
    if (form.elements.payMethod) { const all = $$('[data-pm]', form); if (saved && saved.payment && saved.payment.method && $('[data-pm="' + saved.payment.method + '"]', form)) pickPay(saved.payment.method); else if (all.length === 1) pickPay(all[0].dataset.pm); }
    const go = (i) => {
      cur = i;
      $$('.form-step', form).forEach((s, k) => s.classList.toggle('on', k === i));
      $$('.steps span', form).forEach((s, k) => s.classList.toggle('on', k <= i));
      if (steps[i] === 'review') review();
      if (i > 0) pushDraft(i);
      const first = $('.form-step.on input, .form-step.on select', form); if (first) first.focus({ preventScroll: true });
      const booth = $('#booth'); if (booth && booth.getBoundingClientRect().top < 0) booth.scrollIntoView({ block: 'start' });
    };
    const review = () => {
      const d = readForm(form, ev), qs = ev.questions || [];
      const rows = [['Name', d.name], ['Email', d.email], ['Phone', d.phone], ['Studies at', d.institution + ', ' + d.level]];
      if (ev.teamMax > 1) rows.push(['Team', d.teamName + ' (' + (d.members.length + 1) + ' people)'], ['Members', [d.name, ...d.members].join(', ')]);
      qs.forEach((q) => { if (d.answers[q.id]) rows.push([q.label, d.answers[q.id]]); });
      const amt = promoAmt == null ? ev.fee : promoAmt;
      if (d.payment) rows.push(['Payment', form.dataset.promoFree === '1' ? T('Free with code ', 'কোডে ফ্রি: ') + d.promo : d.payment.method === 'Cash' ? Fmt.taka(amt) + ' at the desk' : Fmt.taka(amt) + ' by ' + d.payment.method + ', TrxID ' + d.payment.trxId]);
      if (d.inviteLater) rows.push([T('Team', 'দল'), T('You will get an invite link for your teammates', 'সদস্যদের জন্য আমন্ত্রণ লিংক পাবেন')]);
      $('[data-review]', form).innerHTML = '<dl class="kv" style="grid-template-columns:96px 1fr;margin-bottom:18px">' + rows.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>').join('') + '</dl>';
      const clashes = Store.clashes(ev);
      $('[data-clash]', form).innerHTML = clashes.length ? '<div class="clash"><b>Heads up:</b> this overlaps with ' + clashes.map((r) => { const o = Store.event(r.eventId); return esc(o.title) + ' (' + esc(Fmt.range(o.startsAt, o.endsAt)) + ')'; }).join(' and ') + ', which you are already registered for. You can still continue.</div>' : '';
    };
    form.addEventListener('input', (e) => {
      onDirty(); persist();
      if (!started) { started = true; Store.track('form_start', { ev: ev.id }); }
      const fld = e.target.closest('.field.err'); if (fld) { fld.classList.remove('err'); }
    });
    form.addEventListener('click', (e) => {
      if (e.target.closest('[data-next]')) { if (validate(form, ev, steps[cur])) go(cur + 1); }
      if (e.target.closest('[data-back]')) go(cur - 1);
      const pm = e.target.closest('[data-pm]'); if (pm) { pickPay(pm.dataset.pm); persist(); onDirty(); if (!started) { started = true; Store.track('form_start', { ev: ev.id }); } }
      const cp = e.target.closest('[data-copy]'); if (cp && navigator.clipboard) navigator.clipboard.writeText(cp.dataset.copy).then(() => UI.toast('Number copied'), () => {});
      if (e.target.closest('[data-promo]')) {
        const msg = $('[data-promo-msg]', form), raw = form.elements.promoInput.value;
        Store.checkPromo(ev, raw).then((r) => {
          if (!r) { msg.textContent = ''; return; }
          msg.style.color = r.ok ? 'var(--t-ok)' : 'var(--t-bad)'; msg.textContent = r.msg;
          if (!r.ok) { delete form.dataset.promo; form.dataset.promoFree = ''; promoAmt = null; $('[data-paywrap]', form).hidden = false; return; }
          form.dataset.promo = r.code; promoAmt = r.amount;
          const free = r.amount === 0; form.dataset.promoFree = free ? '1' : '';
          $('[data-paywrap]', form).hidden = free;
          if (free) { form.elements.payMethod.value = 'Promo'; msg.textContent = r.msg + ' ' + T('No payment needed.', 'কোনো পেমেন্ট লাগবে না।'); }
          else if (form.elements.payMethod.value && form.elements.payMethod.value !== 'Promo') pickPay(form.elements.payMethod.value);
          persist();
        });
      }
      if (e.target.closest('[data-restart]')) { Store.formDraft.clear(ev.id); Router.current.dirty = false; Router.render(); }
      if (e.target.closest('[data-add-member]')) {
        const box = $('[data-members]', form), n = box.children.length;
        if (n < ev.teamMax - 1) { box.insertAdjacentHTML('beforeend', memberRow(n, '', false)); box.lastElementChild.querySelector('input').focus(); }
        $('[data-add-member]', form).hidden = box.children.length >= ev.teamMax - 1;
      }
      const rm = e.target.closest('[data-remove-member]');
      if (rm) { rm.parentElement.remove(); $('[data-add-member]', form).hidden = false; $$('[data-members] input', form).forEach((inp, i) => { inp.placeholder = 'Member ' + (i + 2) + ' full name'; }); }
    });
    form.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT' && steps[cur] !== 'review') { e.preventDefault(); if (validate(form, ev, steps[cur])) go(cur + 1); }
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      for (let i = 0; i < steps.length; i++) { if (!validate(form, ev, steps[i])) { go(i); return; } }
      const btn = $('button[type="submit"]', form), errBox = $('[data-submit-err]', form);
      btn.disabled = true; btn.textContent = 'Saving your ticket…'; errBox.textContent = '';
      try {
        const r = await Store.register(ev.id, readForm(form, ev));
        location.hash = '#/tickets/' + r.id + '?new=1';
      } catch (err) {
        btn.disabled = false; btn.textContent = Store.state(ev).key === 'waitlist' ? 'Join the waitlist' : 'Get my ticket';
        if (err.code === 'trx') { go(steps.indexOf('payment')); UI.setErr(form, 'trxId', err.message); return; }
        errBox.innerHTML = esc(err.message) + (err.code === 'dup' && Store.wallet.ids().includes(err.ticket) ? ' <a href="#/tickets/' + err.ticket + '">Open that ticket</a>.' : err.code === 'dup' ? ' Use <a href="#/tickets">Find my ticket</a> with your ticket code.' : '');
      }
    });
  }

  /* ======================= TICKET ======================= */
  const tried = new Set();
  function ticket(id, q) {
    id = decodeURIComponent(id).toUpperCase();
    const r = Store.reg(id);
    if (!r || !r.email) {
      if (!tried.has(id)) {
        tried.add(id);
        return { title: 'Ticket', html: '<div class="wrap ticket-page"><p class="muted">Looking up ticket ' + esc(id) + '…</p></div>', async mount() { try { await Store.adapter.fetchTicket(id); } catch (e) { console.error(e); } Router.render(); } };
      }
      return notFound('No ticket matches ' + id + '. If you typed the code, check it against your confirmation.');
    }
    const ev = Store.event(r.eventId), f = Store.fest(r.festId);
    if (!ev || !f) return notFound('The event for this ticket was removed by the organizers.');
    const isNew = q.get('new') === '1';
    const st = Store.state(ev);
    const editable = !['cancelled', 'rejected', 'checked_in'].includes(r.status) && Date.now() < ev.deadline;
    const cancellable = !['cancelled', 'rejected', 'checked_in'].includes(r.status) && Date.now() < ev.startsAt;
    const url = location.origin + location.pathname + '#/tickets/' + r.id;
    const pos = r.status === 'waitlisted' ? Store.waitPos(r) : 0;
    const notes = Store.notesFor(ev.id);

    const intro = isNew ? ({
      confirmed: ['You are registered.', 'Your seat is confirmed. This ticket is saved in this browser under My tickets. Keep the QR code handy; you will show it at the gate.'],
      pending: r.payment && r.payment.status === 'submitted' ? ['Registration received.', 'Your seat is held while the organizers match your ' + r.payment.method + ' payment. This page updates when they do, so bookmark it or note your ticket code.'] : ['Registration received.', 'The organizers review every entry for this event. This page updates when they confirm you, so bookmark it or note your ticket code.'],
      waitlisted: ['You are on the waitlist.', 'You are number ' + pos + ' in line. If a seat frees up, this ticket switches to confirmed on its own.']
    }[r.status] || ['Your ticket', '']) : ['Your ticket', 'Ticket ' + r.id + ' for ' + ev.title + '.'];

    const noteText = {
      confirmed: ['Confirmed', 'Show the QR code at the registration desk with your student ID.' + (ev.fee ? ' Keep ' + Fmt.money(ev.fee) + ' ready for the entry fee.' : '')],
      pending: r.payment && r.payment.status !== 'verified' && r.payment.method !== 'Cash' ? ['Waiting for payment check', 'Your seat is held. It is confirmed as soon as the organizers match your ' + r.payment.method + ' payment.'] : ['Waiting for review', 'The organizers have not confirmed this entry yet. Most teams hear back within two days.'],
      waitlisted: ['Number ' + pos + ' on the waitlist', 'If someone cancels, the first person in line is confirmed automatically. Nothing to do on your side.'],
      checked_in: ['Checked in', 'You came in at ' + Fmt.timeFull(r.checkedInAt) + (new Date(r.checkedInAt).toDateString() === new Date().toDateString() ? ' today.' : ' on ' + Fmt.date(r.checkedInAt) + '.') + ' Good luck.'],
      cancelled: ['Cancelled', 'This ticket no longer holds a seat. ' + (st.canRegister ? 'You can register again from the event page.' : '')],
      rejected: ['Not accepted', r.note || 'The organizers could not accept this entry. Reply to the club email if you think this is a mistake.']
    }[r.status];

    const grid = [
      ['Name', r.name], ev.teamMax > 1 ? ['Team', r.teamName] : ['Studies at', r.institution],
      ['Date', Fmt.long(ev.startsAt)], ['Time', Fmt.time(ev.startsAt) + ' to ' + Fmt.time(ev.endsAt)],
      ['Venue', ev.venue], ev.teamMax > 1 ? ['Members', T(Store.teamOf(r).size + ' people', Store.teamOf(r).size + ' জন')] : ['Entry fee', Fmt.money(r.payment ? r.payment.amount : ev.fee)]
    ];

    const pay = r.payment;
    const payBlock = pay ? '<div class="status-note" style="margin-top:20px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><h2 class="h3">Payment</h2>' + UI.pill(pay.status, PAY[pay.status]) + '</div>' +
      (pay.method === 'Cash' ? '<p>' + Fmt.taka(pay.amount) + ' to be paid at the registration desk' + (pay.status === 'verified' ? '. Paid, thank you.' : '. Bring the exact amount if you can.') + '</p>' :
        '<p>' + Fmt.taka(pay.amount) + ' by ' + esc(pay.method) + ' from ' + esc(pay.sender) + ', TrxID <b class="code">' + esc(pay.trxId) + '</b>.</p>' +
        '<p style="margin-top:6px">' + ({ submitted: 'We check every TrxID against our statement, usually within a few hours.', verified: 'Matched with our statement' + (pay.verifiedAt ? ' on ' + Fmt.when(pay.verifiedAt) : '') + '.', rejected: esc(pay.note || 'We could not match this payment.') }[pay.status] || '') + '</p>' +
        (pay.status === 'rejected' && !['cancelled', 'rejected'].includes(r.status) ? '<form id="repay" style="margin-top:14px" novalidate>' + field({ name: 'trxId', label: 'Correct TrxID', req: true, attrs: 'style="text-transform:uppercase"' }) + field({ name: 'sender', label: 'Number you paid from', type: 'tel', req: true, value: pay.sender }) + '<button class="btn btn-ink btn-sm" type="submit">Submit payment again</button></form>' : '')) + '</div>' : '';
    const html = '<section class="wrap ticket-page">' +
      '<div class="ticket-intro"><h1 class="h2">' + esc(intro[0]) + '</h1>' + (intro[1] ? '<p class="muted">' + esc(intro[1]) + '</p>' : '') + '</div>' +
      '<article class="admit' + (isNew ? ' enter' : '') + (ev.art && ev.art.src ? ' has-art' + (ev.art.stub ? ' art-stub' : '') : '') + '" style="--ink:var(--' + f.ink + ')' + artVars(ev) + '" aria-label="Ticket ' + esc(r.id) + '">' +
        '<div class="admit-main">' + artLayer(ev) + '<div class="admit-band"><span>' + esc(f.title) + '</span><span>' + (ev.teamMax > 1 ? T('Admit team of ' + Store.teamOf(r).size, Store.teamOf(r).size + ' জনের দল') : T('Admit one', 'একজনের প্রবেশ')) + '</span></div>' +
          '<h2 class="admit-title">' + esc(ev.title) + '</h2>' +
          '<dl class="admit-grid">' + grid.map(([k, v]) => '<div><dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd></div>').join('') + '</dl>' +
          '<span class="stamp s-' + r.status + '">' + esc(STATUS[r.status]) + '</span></div>' +
        '<div class="admit-stub">' + (ev.art && ev.art.src && ev.art.stub ? artLayer(ev) : '') + (r.status === 'checked_in' ? '<span class="punch' + (q.get('punched') ? ' anim' : '') + '" aria-hidden="true"></span>' : '') +
          '<div class="admit-qr">' + qrSvg(url) + '</div><div><div class="admit-code">' + esc(r.id) + '</div><div class="admit-hint">Show this at the desk.<br>Code works without the QR too.</div></div></div>' +
      '</article>' +
      '<div class="ticket-actions">' +
        '<button class="btn btn-line btn-sm" data-act="ics">' + icon.cal + 'Add to calendar</button>' +
        '<button class="btn btn-line btn-sm" data-act="print">' + icon.print + 'Save as PDF</button>' +
        '<button class="btn btn-line btn-sm" data-act="copy">' + icon.link + 'Copy ticket link</button>' +
        (editable ? '<button class="btn btn-line btn-sm" data-act="edit">' + icon.edit + 'Edit details</button>' : '') +
        (cancellable ? '<button class="btn btn-danger btn-sm" data-act="cancel">Cancel registration</button>' : '') +
      '</div>' +
      '<div class="ticket-side"><div><div class="status-note"><h2 class="h3">' + esc(noteText[0]) + '</h2><p>' + esc(noteText[1]) + '</p>' +
        '<p style="margin-top:12px"><a href="#/events/' + ev.id + '">Event details</a> or <a href="#/tickets">all my tickets</a></p>' +
        (r.status === 'checked_in' ? '<a class="btn btn-ink btn-sm" style="margin-top:14px" href="#/certificate/' + r.id + '">Get my certificate</a>' : '') + '</div>' + payBlock + '</div>' +
        '<div>' + inviteBox(r, ev) + (notes.length ? '<h2 class="h3" style="margin-bottom:12px">From the organizers</h2>' + notes.map((n) => '<div class="notice" style="--ink:var(--' + f.ink + ')"><p>' + esc(n.text) + '</p><time>' + T('Posted ', 'প্রকাশ: ') + Fmt.ago(n.createdAt) + '</time></div>').join('') : '<p class="muted">Announcements from the organizers for this event will show up here.</p>') + '</div>' +
      '</div></section>';

    return {
      title: 'Ticket ' + r.id,
      html,
      mount(root) {
        if (isNew) history.replaceState(null, '', '#/tickets/' + r.id);
        else if (Router.lastPath !== '/tickets/' + r.id) Store.track('ticket_view', { ev: ev.id, ref: r.id });
        const rp = $('#repay', root);
        if (rp) rp.addEventListener('submit', async (e) => {
          e.preventDefault();
          try { await Store.resubmitPayment(r.id, { method: pay.method, trxId: rp.elements.trxId.value, sender: rp.elements.sender.value }); UI.toast('Payment submitted again'); Router.render(); }
          catch (err) { setErr(rp, 'trxId', err.message); }
        });
        root.addEventListener('click', async (e) => {
          const ci = e.target.closest('[data-copy-invite]'); if (ci) { try { await navigator.clipboard.writeText(ci.dataset.copyInvite); UI.toast(T('Invite link copied', 'লিংক কপি হয়েছে')); } catch (_) { prompt('Copy', ci.dataset.copyInvite); } return; }
          const b = e.target.closest('[data-act]'); if (!b) return;
          const act = b.dataset.act;
          if (act === 'ics') UI.ics(ev, r);
          if (act === 'print') window.print();
          if (act === 'copy') { try { await navigator.clipboard.writeText(url); UI.toast('Ticket link copied'); } catch (_) { prompt('Copy this link', url); } }
          if (act === 'edit') editTicket(r, ev);
          if (act === 'cancel') {
            const ok = await UI.confirm({ title: 'Cancel this registration?', text: 'Your ' + (ev.teamMax > 1 ? 'team\'s seat' : 'seat') + ' for ' + ev.title + ' goes to the next person on the waitlist. This cannot be undone, but you can register again while registration is open.', ok: 'Cancel registration', cancel: 'Keep my ticket', danger: true });
            if (ok) { await Store.cancelTicket(r.id); UI.toast('Registration cancelled'); Router.render(); }
          }
        });
      }
    };
  }

  function inviteBox(r, ev) {
    const team = Store.teamOf(r), inv = team.inv;
    if (!inv || ['cancelled', 'rejected'].includes(r.status)) return '';
    const link = location.origin + location.pathname + '#/join/' + inv.id;
    const left = inv.slots - team.joined.length;
    return '<div class="status-note invite-box" style="margin-bottom:22px"><h2 class="h3">' + T('Invite your teammates', 'সদস্যদের আমন্ত্রণ জানান') + '</h2><p>' + (left > 0 ? T('Share this link. Each teammate adds their own details. ' + left + ' of ' + inv.slots + ' spots open.', 'এই লিংক শেয়ার করুন। প্রত্যেক সদস্য নিজের তথ্য দেবে। ' + inv.slots + 'টির মধ্যে ' + left + 'টি জায়গা খালি।') : T('Your team is complete.', 'আপনার দল পূর্ণ।')) + '</p>' +
      (left > 0 ? '<div class="num invite-link">' + esc(link) + '</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ink btn-sm" data-copy-invite="' + esc(link) + '">' + icon.link + T('Copy invite link', 'লিংক কপি করুন') + '</button><a class="btn btn-line btn-sm" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent('Join my team ' + (r.teamName || '') + ' for ' + ev.title + ': ' + link) + '">WhatsApp</a></div>' : '') +
      (team.joined.length ? '<div class="feed" style="margin-top:12px">' + team.joined.map((m) => '<div><b>' + esc(m.name) + '</b><span>' + Fmt.ago(m.joinedAt) + '</span><span>' + esc(m.institution || '') + '</span></div>').join('') + '</div>' : '') + '</div>';
  }

  /* ======================= JOIN A TEAM ======================= */
  const triedInv = new Set();
  function join(key) {
    const inv = Store.invites.find((i) => i.id === key);
    if (!inv) {
      if (!triedInv.has(key)) { triedInv.add(key); return { title: 'Join team', html: '<div class="wrap ticket-page"><p class="muted">…</p></div>', async mount() { await Store.fetchInvite(key).catch(() => null); Router.render(); } }; }
      return notFound(T('This invite link is not valid, or the team was removed.', 'এই আমন্ত্রণ লিংকটি সঠিক নয়, অথবা দলটি মুছে ফেলা হয়েছে।'));
    }
    const ev = Store.event(inv.eventId) || {}, f = Store.fest(inv.festId) || {}, members = inv.members || [], left = inv.slots - members.length;
    const done = sessionStorage.getItem('stub.joined.' + key);
    const html = '<section class="wrap"><div class="acct-wrap" style="max-width:560px;--ink:var(--' + (f.ink || 'orange') + ')">' +
      '<span class="ink-bar"></span><h1 class="h2" style="margin-bottom:8px">' + T('Join ' + esc(inv.teamName || 'the team'), esc(inv.teamName || 'দলে') + ' যোগ দিন') + '</h1>' +
      '<p class="muted" style="margin-bottom:22px">' + T(esc(inv.leadName.split(' ')[0]) + ' registered this team for <b>' + esc(ev.title || '') + '</b> at ' + esc(f.title || '') + ', ' + (ev.startsAt ? esc(Fmt.long(ev.startsAt)) : '') + '.', esc(inv.leadName.split(' ')[0]) + ' এই দলটি <b>' + esc(ev.title || '') + '</b> (' + esc(f.title || '') + ') এর জন্য নিবন্ধন করেছে, ' + (ev.startsAt ? esc(Fmt.long(ev.startsAt)) : '') + '।') + '</p>' +
      (members.length ? '<div class="panel" style="margin-bottom:20px"><div class="panel-head"><h3>' + T('Already on the team', 'দলে আছেন') + '</h3><span>' + (members.length + 1) + '</span></div><div class="feed"><div><b>' + esc(inv.leadName) + '</b><span>' + T('Team lead', 'দলনেতা') + '</span></div>' + members.map((m) => '<div><b>' + esc(m.name) + '</b><span>' + Fmt.ago(m.joinedAt) + '</span></div>').join('') + '</div></div>' : '') +
      (done ? '<div class="status-note"><h2 class="h3">' + T('You are on the team.', 'আপনি দলে যুক্ত হয়েছেন।') + '</h2><p>' + T('Your team lead\'s ticket covers the whole team. Bring your student ID on the day.', 'দলনেতার টিকিটেই পুরো দলের প্রবেশ। ইভেন্টের দিন স্টুডেন্ট আইডি সাথে আনুন।') + '</p><a class="btn btn-ink btn-sm" style="margin-top:14px" href="#/events/' + ev.id + '">' + T('See the event', 'ইভেন্ট দেখুন') + '</a></div>' :
        left <= 0 ? '<div class="status-note"><h2 class="h3">' + T('This team is full.', 'দলটি পূর্ণ।') + '</h2><p>' + T('Ask the team lead to check the member list.', 'সদস্য তালিকা দেখতে দলনেতার সাথে যোগাযোগ করুন।') + '</p></div>' :
        '<div class="panel"><div class="panel-head"><h3>' + T('Your details', 'আপনার তথ্য') + '</h3><span>' + T(left + ' spots open', left + 'টি জায়গা খালি') + '</span></div><form id="join-form" novalidate>' +
        field({ name: 'name', label: 'Full name', req: true, value: Store.user ? Store.user.name : '' }) + field({ name: 'email', label: 'Email', type: 'email', req: true, value: Store.user ? Store.user.email : '' }) +
        field({ name: 'phone', label: 'Phone', type: 'tel', req: true, placeholder: '01XXXXXXXXX', value: Store.user ? Store.user.phone : '' }) + field({ name: 'institution', label: 'School, college or university', req: true, value: Store.user ? Store.user.institution : '' }) +
        field({ name: 'level', label: 'Class or level', type: 'select', options: LEVELS, req: true, placeholder: 'Choose one', value: Store.user ? Store.user.level : '' }) +
        '<div class="msg" data-err style="color:var(--bad);font-size:14px;margin:-4px 0 14px"></div><button class="btn btn-ink btn-block" type="submit">' + T('Join the team', 'দলে যোগ দিন') + '</button></form></div>') +
      '</div></section>';
    return {
      title: 'Join team', html,
      mount(root) {
        const fm = $('#join-form', root); if (!fm) return;
        fm.addEventListener('submit', async (e) => {
          e.preventDefault(); const g = (n) => fm.elements[n].value.trim(); let ok = true; const err = (n, m) => { setErr(fm, n, m); if (m) ok = false; };
          err('name', g('name').length < 3 ? 'Write your full name, at least 3 letters.' : ''); err('email', !EMAIL.test(g('email')) ? 'That email does not look right. Check for typos.' : '');
          err('phone', !PHONE.test(g('phone').replace(/[\s-]/g, '')) ? 'Use an 11-digit Bangladeshi number, like 01712345678.' : ''); err('institution', g('institution').length < 3 ? 'Tell us where you study.' : ''); err('level', !g('level') ? 'Choose your class or level.' : '');
          if (!ok) return;
          try { await Store.joinTeam(key, { name: g('name'), email: g('email'), phone: g('phone').replace(/[\s-]/g, ''), institution: g('institution'), level: g('level') }); sessionStorage.setItem('stub.joined.' + key, '1'); UI.toast(T('You joined the team', 'আপনি দলে যোগ দিয়েছেন')); Router.render(); }
          catch (er) { $('[data-err]', fm).textContent = er.message; }
        });
      }
    };
  }

  function editTicket(r, ev) {
    const team = ev.teamMax > 1;
    const body = '<form id="edit-form" novalidate>' +
      field({ name: 'name', label: 'Full name', value: r.name, req: true }) +
      '<div class="field"><span class="label">Email</span><div class="hint">' + esc(r.email) + '. Email cannot be changed because the ticket is tied to it.</div></div>' +
      field({ name: 'phone', label: 'Phone', type: 'tel', value: r.phone, req: true }) +
      field({ name: 'institution', label: 'School, college or university', value: r.institution, req: true }) +
      field({ name: 'level', label: 'Class or level', type: 'select', options: LEVELS, value: r.level, req: true }) +
      (team ? field({ name: 'teamName', label: 'Team name', value: r.teamName, req: true }) +

/* ---------- assistant.js ---------- */
/* Help desk assistant.
   Asks Groq through /api/assistant (the Groq API key lives only on the server, never in this file).
   Every question carries the live event data, FAQ and the organizers' extra knowledge, so answers stay current.
   If the endpoint is missing or fails, it answers common questions instantly from the same data. */
(function () {
  const { $, esc } = UI;
  const CFG = window.STUB_CONFIG || {};
  const T = (e, b) => Fmt.T(e, b);
  const st = { open: false, busy: false, msgs: [] };

  /* ---------- data the assistant may use ---------- */
  function liveEvents() {
    return Store.events.filter((e) => e.endsAt > Date.now() && (Store.fest(e.festId) || {}).published !== false).sort((a, b) => a.startsAt - b.startsAt);
  }
  function context() {
    const S = Store.settings || {};
    const path = location.hash.replace('#', '');
    const m = path.match(/^\/events\/([^/?]+)/);
    return {
      club: S.clubName, site: S.siteName, contactEmail: S.contactEmail, contactPhone: S.contactPhone, address: S.address,
      payments: Store.payMethods().map((p) => p.type + ' ' + p.number + ' (' + (p.accountType || 'Personal') + ')' + (p.instructions ? ': ' + p.instructions : '')),
      events: liveEvents().map((e) => {
        const s = Store.state(e), f = Store.fest(e.festId) || {};
        return {
          title: e.title, fest: f.title, category: e.category, starts: Fmt.when(e.startsAt), ends: Fmt.when(e.endsAt), venue: e.venue,
          fee: e.fee ? Fmt.taka(e.fee) + (e.teamMax > 1 ? ' per team' : '') + (e.allowCash ? ', cash at desk allowed' : '') : 'Free',
          team: Fmt.team(e), registerBy: Fmt.when(e.deadline), status: s.label, seatsLeft: s.left, waitlist: s.wl,
          summary: e.summary, rules: (e.rules || []).slice(0, 5), prizes: (e.prizes || []).map((p) => (p.amount || p[0]) + ' ' + (p.label || p[1])),
          link: location.origin + location.pathname + '#/events/' + e.id
        };
      }),
      faq: (S.faq || []).map((f) => ({ q: f.q || f[0], a: f.a || f[1] })),
      news: Store.news().slice(0, 5).map((n) => n.title + ': ' + n.text),
      extra: (S.assistant || {}).knowledge || '',
      currentPage: m && Store.event(m[1]) ? 'The visitor is looking at ' + Store.event(m[1]).title : 'Homepage',
      myTickets: Store.myTickets().map((r) => ({ code: r.id, event: (Store.event(r.eventId) || {}).title, status: STATUS[r.status], payment: r.payment ? PAY[r.payment.status] : 'none' }))
    };
  }

  /* ---------- instant answers (no API) ---------- */
  const has = (q, re) => re.test(q);
  function findEvent(q) {
    const words = (s) => s.toLowerCase().replace(/[^a-z0-9ঀ-৿ ]/g, ' ').split(/\s+/).filter((w) => w.length > 3);
    const qw = new Set(words(q));
    const bnMap = { 'রোবট': 'robotics', 'রোবোটিক্স': 'robotics', 'প্রোগ্রামিং': 'programming', 'গেমিং': 'gaming', 'কুইজ': 'quiz', 'হ্যাকাথন': 'hackathon', 'ওয়ার্কশপ': 'workshop', 'ওয়েব': 'web', 'প্রজেক্ট': 'project' };
    Object.entries(bnMap).forEach(([b, e]) => { if (q.includes(b)) qw.add(e); });
    let best = null, score = 0;
    liveEvents().forEach((e) => {
      const n = words(e.title + ' ' + e.category).filter((w) => qw.has(w) || [...qw].some((x) => x.length > 4 && w.startsWith(x.slice(0, 5)))).length;
      if (n > score) { score = n; best = e; }
    });
    const m = location.hash.match(/^#\/events\/([^/?]+)/);
    return best || (m ? Store.event(m[1]) : null);
  }
  function localAnswer(raw) {
    const q = raw.toLowerCase(), S = Store.settings || {}, ev = findEvent(raw);
    const evs = liveEvents(), open = evs.filter((e) => Store.state(e).canRegister);
    const methods = Store.payMethods().map((p) => p.type).join(', ');
    const contact = [S.contactEmail, S.contactPhone].filter(Boolean).join(T(' or ', ' অথবা '));
    const evLine = (e) => '**' + e.title + '**, ' + Fmt.when(e.startsAt) + ', ' + e.venue;
    if (has(q, /lost|find my ticket|forgot|missing ticket|হারিয়ে|খুঁজে পাচ্ছি না|টিকিট পাচ্ছি না/)) return T('Open **My tickets** and use "Find a ticket from another device" with your ticket code and the email you registered with. If you registered with an account, just sign in.', '**আমার টিকিট** পেজে গিয়ে টিকিট কোড আর নিবন্ধনের ইমেইল দিয়ে "অন্য ডিভাইস থেকে টিকিট খুঁজুন" ব্যবহার করুন। অ্যাকাউন্ট দিয়ে নিবন্ধন করলে শুধু সাইন ইন করুন।');
    if (has(q, /cancel|refund|বাতিল|ফেরত/)) return T('You can cancel from your ticket page until the event starts; your seat goes to the waitlist. For refunds, contact the organizers' + (contact ? ' at ' + contact : '') + '.', 'ইভেন্ট শুরুর আগ পর্যন্ত টিকিট পেজ থেকে বাতিল করা যায়; আপনার আসনটি অপেক্ষমাণ তালিকার কেউ পাবে। টাকা ফেরতের জন্য আয়োজকদের সাথে যোগাযোগ করুন' + (contact ? ': ' + contact : '') + '।');
    if (has(q, /certificate|সনদ|সার্টিফিকেট/)) return T('Certificates are issued after you check in at the event. Open your ticket after the event and choose **Get my certificate**.', 'ইভেন্টে চেক-ইন করার পর সনদ পাওয়া যায়। ইভেন্ট শেষে টিকিট খুলে **আমার সনদ** চাপুন।');
    if (has(q, /promo|discount|coupon|code|ছাড়|কুপন|প্রোমো/)) {
      const pub = evs.flatMap((e) => Store.publicPromos(e).map((p) => [p, e])).filter((x, i, a) => a.findIndex((y) => y[0].id === x[0].id) === i);
      return pub.length ? T('Current offers: ', 'চলতি অফার: ') + pub.map(([p]) => '**' + p.code + '** (' + (p.type === 'percent' ? p.value + '%' : Fmt.taka(p.value)) + T(' off', ' ছাড়') + ')').join(', ') + T('. Enter the code on the payment step.', '। পেমেন্ট ধাপে কোডটি লিখুন।') : T('There are no public promo codes right now. If the organizers gave you a code, enter it on the payment step.', 'এখন কোনো উন্মুক্ত প্রোমো কোড নেই। আয়োজকরা কোড দিয়ে থাকলে পেমেন্ট ধাপে লিখুন।');
    }

  /* ---------- Groq, through the serverless function ---------- */
  async function askGroq(q) {
    const endpoint = CFG.assistantEndpoint === undefined ? 'api/assistant' : CFG.assistantEndpoint;
    if (!endpoint || location.protocol === 'file:') throw new Error('no endpoint');
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), 20000);
    try {
      const r = await fetch(endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
        body: JSON.stringify({ question: q, lang: Fmt.bn ? 'bn' : 'en', history: st.msgs.slice(-8).map((m) => ({ role: m.who === 'me' ? 'user' : 'assistant', content: m.text })), context: context() })
      });
      if (!r.ok) throw new Error('status ' + r.status);
      const j = await r.json();
      if (!j.answer) throw new Error('empty');
      return j.answer;
    } finally { clearTimeout(to); }
  }

  const fmt = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>');

    box.innerHTML = '<button class="assist-fab" data-assist-toggle aria-expanded="' + st.open + '" aria-label="' + T('Ask a question', 'প্রশ্ন করুন') + '">' + (st.open ? UI.icon.x : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5" stroke-linecap="round"/></svg><span>' + T('Ask', 'জিজ্ঞাসা') + '</span>') + '</button>' +
      (st.open ? '<section class="assist-panel" role="dialog" aria-label="' + esc(A.name || 'Help desk') + '"><header><b>' + esc(A.name || T('Help desk', 'হেল্প ডেস্ক')) + '</b><span>' + T('Answers from the latest event info', 'সর্বশেষ ইভেন্ট তথ্য থেকে উত্তর') + '</span></header>' +
        '<div class="assist-log" data-log>' + (st.msgs.length ? '' : '<div class="msg bot">' + T('Hi! Ask me about events, fees, deadlines, teams or your ticket.', 'হ্যালো! ইভেন্ট, ফি, শেষ সময়, দল বা টিকিট নিয়ে প্রশ্ন করুন।') + '</div><div class="assist-sugg">' + sugg.map((s) => '<button data-sugg>' + esc(s) + '</button>').join('') + '</div>') +
        st.msgs.map((m) => '<div class="msg ' + m.who + '">' + fmt(m.text) + (m.src === 'local' ? '<small>' + T('Instant answer', 'তাৎক্ষণিক উত্তর') + '</small>' : '') + '</div>').join('') + (st.busy ? '<div class="msg bot typing"><i></i><i></i><i></i></div>' : '') + '</div>' +
        '<form data-ask><label class="sr" for="ask-in">' + T('Your question', 'আপনার প্রশ্ন') + '</label><input id="ask-in" class="input" maxlength="400" autocomplete="off" placeholder="' + T('Type your question', 'প্রশ্ন লিখুন') + '"><button class="btn btn-ink" type="submit" aria-label="Send"' + (st.busy ? ' disabled' : '') + '><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></form></section>' : '');
    const log = $('[data-log]', box); if (log) log.scrollTop = log.scrollHeight;
  }
  async function ask(q) {
    q = q.trim(); if (!q || st.busy) return;
    st.msgs.push({ who: 'me', text: q }); st.busy = true; draw();
    Store.track('ask', { q: q.slice(0, 160) });
    let text, src = 'groq';
    try { text = await askGroq(q); } catch (e) { text = localAnswer(q); src = 'local'; }
    st.msgs.push({ who: 'bot', text, src }); st.busy = false; draw();
    const inp = $('#ask-in'); if (inp) inp.focus();
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-assist-toggle]')) { st.open = !st.open; draw(); if (st.open) setTimeout(() => { const i = $('#ask-in'); i && i.focus(); }, 50); }

  window.Assistant = { draw, localAnswer, context };
})();

  window.exportCsv = exportCsv;
  function exportCsv(regs, name) {
    const qLabels = new Map();
    Store.events.forEach((e) => (e.questions || []).forEach((q) => qLabels.set(e.id + ':' + q.id, q.label)));
    const rows = [['Ticket', 'Status', 'Name', 'Email', 'Phone', 'Institution', 'Level', 'Team', 'Members', 'Event', 'Fest', 'Registered', 'Checked in', 'Payment method', 'Paid from', 'TrxID', 'Amount', 'Payment status', 'Answers', 'Organizer note']];
    regs.forEach((r) => {
      const e = Store.event(r.eventId) || {}, f = Store.fest(r.festId) || {};
      const ans = Object.entries(r.answers || {}).filter(([, v]) => v).map(([k, v]) => (qLabels.get(r.eventId + ':' + k) || k) + ': ' + v).join(' | ');
      const p = r.payment || {};
      rows.push([r.id, STATUS[r.status], r.name, r.email, r.phone, r.institution, r.level, r.teamName, (r.members || []).join('; '), e.title, f.title, new Date(r.createdAt).toISOString(), r.checkedInAt ? new Date(r.checkedInAt).toISOString() : '', p.method || '', p.sender || '', p.trxId || '', p.amount || '', p.status ? PAY[p.status] : '', ans, r.note || '']);
    });
    UI.download(name + '-' + new Date().toISOString().slice(0, 10) + '.csv', UI.csv(rows), 'text/csv;charset=utf-8');
    UI.toast('Exported ' + Fmt.plural(regs.length, 'registration'));
  }

  const ART_POS_OPTS = [['center', 'Centre'], ['top', 'Top'], ['bottom', 'Bottom'], ['left', 'Left'], ['right', 'Right']];

  function artHtml(ev) {

  const artEmpty = () => '<div class="art-empty">' + icon.up +

  function artBody(ev, a, vars) {
    return '<div class="art-prev" ' + vars + ' data-art-prev><img src="' + esc(a.src) + '" alt="Ticket background preview">' +
        '<span class="art-face"><span>' + esc((Store.fest(ev.festId) || {}).title || 'Fest') + ' · ADMIT ONE</span><b>' + esc(ev.title || 'Event name') + '</b></span></div>' +

      '</div>' +
      '<label class="check" style="margin-top:12px"><input type="checkbox" name="artStub"' + (a.stub ? ' checked' : '') + '><span>Carry it across the QR stub too</span></label>' +
      '<div class="art-acts"><button type="button" class="btn btn-line btn-sm" data-art-pick>Replace picture</button>' +

  /* Wires one .art-drop. Returns read() -> the art object, or null when there is none. */
  function artMount(root, ev) {
    const box = $('[data-art]', root); if (!box) return () => null;
    let src = (ev.art && ev.art.src) || '';
    const body = $('[data-art-body]', box), file = $('[data-art-file]', box);
    const redraw = () => {
      const prev = $('[data-art-prev]', box); if (!prev) return;
      const pos = box.querySelector('[name=artPos]'), dim = box.querySelector('[name=artDim]');
      prev.style.setProperty('--art-pos', UI.ART_POS[pos.value] || UI.ART_POS.center);
      prev.style.setProperty('--art-dim', String(Number(dim.value) / 100));
      $('[data-art-dimv]', box).textContent = dim.value + '%';
    };
    box.addEventListener('click', (e) => {
      if (e.target.closest('[data-art-pick]')) { file.value = ''; file.click(); }
      if (e.target.closest('[data-art-rm]')) { src = ''; body.innerHTML = artEmpty(); }
    });
    box.addEventListener('input', (e) => { if (e.target.name === 'artDim' || e.target.name === 'artPos') redraw(); });
    box.addEventListener('change', (e) => { if (e.target.name === 'artPos') redraw(); });
    file.addEventListener('change', async (e) => {
      const f = e.target.files[0]; if (!f) return;
      if (f.size > 12e6) return UI.toast('That picture is over 12 MB. Try a smaller one.', 'bad');
      try {
        src = await UI.readImage(f, 1200, 'image/jpeg', 0.78);
        body.innerHTML = artBody(ev, { src, pos: 'center', dim: 55, stub: false }, 'style="--art-pos:center center;--art-dim:.55"');
      } catch (err) { UI.toast(err.message, 'bad'); }
    });
    return () => {
      if (!src) return null;
      const pos = box.querySelector('[name=artPos]'), dim = box.querySelector('[name=artDim]'), stub = box.querySelector('[name=artStub]');
      return { src, pos: pos ? pos.value : 'center', dim: dim ? Number(dim.value) : 55, stub: !!(stub && stub.checked) };
    };
  }

      field({ name: 'category', label: 'Category', value: ev.category, req: true, list: 'cat-list' }) + '<datalist id="cat-list">' + CATS.map((c) => '<option value="' + c + '">').join('') + '</datalist>' +
      field({ name: 'summary', label: 'Summary', value: ev.summary, req: true, hint: 'One or two sentences. Shown at the top of the event page.' }) +
      field({ name: 'description', label: 'Full description', type: 'textarea', value: ev.description }) +
      field({ name: 'rules', label: 'Rules', type: 'textarea', value: (ev.rules || []).join('\n'), hint: 'One rule per line.' }) +
      field({ name: 'prizes', label: 'Prizes', type: 'textarea', value: (ev.prizes || []).map((p) => (p.amount || p[0]) + ' | ' + (p.label || p[1])).join('\n'), hint: 'One per line, as amount | label. For example: ৳10,000 | Champion' }) +
      '<div class="drawer-sec">When and where</div>' +
      '<div class="row2">' + field({ name: 'startsAt', label: 'Starts', type: 'datetime-local', value: toLocalInput(ev.startsAt), req: true }) + field({ name: 'endsAt', label: 'Ends', type: 'datetime-local', value: toLocalInput(ev.endsAt), req: true }) + '</div>' +
      field({ name: 'venue', label: 'Venue', value: ev.venue, req: true }) +
      '<div class="drawer-sec">Registration</div>' +
      '<div class="row2">' + field({ name: 'opensAt', label: 'Opens', type: 'datetime-local', value: toLocalInput(ev.opensAt) }) + field({ name: 'deadline', label: 'Deadline', type: 'datetime-local', value: toLocalInput(ev.deadline), req: true }) + '</div>' +
      '<div class="row2">' + field({ name: 'capacity', label: (ev.teamMax > 1 ? 'Team' : 'Seat') + ' capacity', type: 'number', value: ev.capacity, req: true, attrs: 'min="1"' }) + field({ name: 'waitlist', label: 'Waitlist spots', type: 'number', value: ev.waitlist, attrs: 'min="0"', hint: '0 turns the waitlist off.' }) + '</div>' +
      '<div class="row2">' + field({ name: 'teamMin', label: 'Smallest team', type: 'number', value: ev.teamMin, req: true, attrs: 'min="1"' }) + field({ name: 'teamMax', label: 'Largest team', type: 'number', value: ev.teamMax, req: true, attrs: 'min="1"', hint: '1 means individual.' }) + '</div>' +
      field({ name: 'fee', label: 'Entry fee in taka', type: 'number', value: ev.fee, attrs: 'min="0"', hint: '0 shows as Free.' }) +
      '<label class="check" style="margin-bottom:12px"><input type="checkbox" name="autoConfirm"' + (ev.autoConfirm ? ' checked' : '') + '><span>Confirm registrations automatically. Untick to review each one first. Paid events still wait for payment to be verified.</span></label>' +
      '<label class="check" style="margin-bottom:12px"><input type="checkbox" name="allowCash"' + (ev.allowCash ? ' checked' : '') + '><span>Allow paying the fee in cash at the desk, in addition to ' + (Store.payMethods().map((m) => m.type).join(', ') || 'mobile payments') + '</span></label>' +
      '<label class="check"><input type="checkbox" name="regOpen"' + (ev.regOpen !== false ? ' checked' : '') + '><span>Registration is open (untick to pause it)</span></label>' +
      '<div class="drawer-sec">Ticket picture</div><p class="small muted" style="margin-top:-6px">Sits behind the ticket for this event, on screen, in the saved PDF and on the printed badge.</p>' +
      artHtml(ev) +
      '<div class="drawer-sec">Extra questions</div><p class="small muted" style="margin-top:-6px">Asked on the registration form after the basics.</p>' +
      '<div data-qs>' + (ev.questions || []).map(qRow).join('') + '</div><button type="button" class="btn btn-line btn-sm" data-add-q>' + icon.plus + 'Add a question</button>' +
      '</form>';
    UI.drawer({
      title: isNew ? 'New event' : 'Edit event', body,
      foot: '<button class="btn btn-line" data-close>Cancel</button><button class="btn btn-ink" data-save>' + (isNew ? 'Create event' : 'Save changes') + '</button>',
      onMount(d, close) {
        const form = $('#ev-form', d);
        const readArt = artMount(d, ev);
        d.addEventListener('click', (e) => {
          if (e.target.closest('[data-add-q]')) { $('[data-qs]', d).insertAdjacentHTML('beforeend', qRow(null, $('[data-qs]', d).children.length)); $('[data-qs]', d).lastElementChild.querySelector('input').focus(); }
          const rm = e.target.closest('[data-rm-q]'); if (rm) rm.closest('.q-row').remove();
        });
        d.addEventListener('change', (e) => { if (e.target.name === 'qtype') e.target.closest('.q-row').querySelector('[name="qopts"]').style.display = e.target.value === 'select' ? '' : 'none'; });
        $('[data-save]', d).addEventListener('click', async () => {
          const g = (n) => String(form.elements[n].value || '').trim(), num = (n) => Number(g(n) || 0);
          const t = { s: fromLocalInput(g('startsAt')), e: fromLocalInput(g('endsAt')), o: fromLocalInput(g('opensAt')), dl: fromLocalInput(g('deadline')) };
          let ok = true; const err = (n, m) => { setErr(form, n, m); if (m) ok = false; };
          err('title', g('title').length < 3 ? 'Give the event a name.' : '');
          err('category', !g('category') ? 'Pick or type a category.' : '');
          err('summary', !g('summary') ? 'Add a short summary.' : '');
          err('startsAt', !t.s ? 'Pick a start time.' : '');
          err('endsAt', !t.e ? 'Pick an end time.' : t.e <= t.s ? 'The event has to end after it starts.' : '');
          err('venue', !g('venue') ? 'Where is it?' : '');
          err('deadline', !t.dl ? 'Set a deadline.' : t.dl > t.e ? 'The deadline should be before the event ends.' : t.o && t.dl <= t.o ? 'The deadline has to come after registration opens.' : '');
          err('capacity', num('capacity') < 1 ? 'At least 1.' : num('capacity') < Store.taken(ev.id || '') ? 'Already ' + Store.taken(ev.id) + ' registered. Cancel some first, or keep capacity at or above that.' : '');
          err('teamMin', num('teamMin') < 1 ? 'At least 1.' : '');
          err('teamMax', num('teamMax') < num('teamMin') ? 'Must be at least the smallest team size.' : '');
          const questions = $$('.q-row', d).map((row) => ({
            id: row.dataset.q, label: row.querySelector('[name="qlabel"]').value.trim(), type: row.querySelector('[name="qtype"]').value,
            required: row.querySelector('[name="qreq"]').checked,
            options: row.querySelector('[name="qtype"]').value === 'select' ? row.querySelector('[name="qopts"]').value.split(',').map((s) => s.trim()).filter(Boolean) : undefined
          })).filter((q) => q.label);
          if (questions.some((q) => q.type === 'select' && (!q.options || q.options.length < 2))) { UI.toast('Choice questions need at least two choices', 'bad'); ok = false; }
          if (!ok) { const f = $('.field.err input, .field.err select, .field.err textarea', form); f && f.focus(); return; }
          const out = {
            ...ev, festId: g('festId'), title: g('title'), category: g('category'), summary: g('summary'), description: g('description'),
            rules: g('rules').split('\n').map((s) => s.trim()).filter(Boolean),
            prizes: g('prizes').split('\n').map((l) => l.split('|').map((s) => s.trim())).filter((p) => p[0]).map((p) => ({amount: p[0], label: p[1] || ''})),
            startsAt: t.s, endsAt: t.e, opensAt: t.o || null, deadline: t.dl, venue: g('venue'),
            capacity: num('capacity'), waitlist: num('waitlist'), fee: num('fee'), teamMin: num('teamMin'), teamMax: num('teamMax'),
            autoConfirm: form.elements.autoConfirm.checked, allowCash: form.elements.allowCash.checked, regOpen: form.elements.regOpen.checked, questions
          };
          const art = readArt();
          out.art = art ? { src: art.src, pos: art.pos, dim: art.dim, stub: art.stub } : null;
          await Store.saveEvent(out);
          close(); UI.toast(isNew ? 'Event created' : 'Event saved'); Router.render();
        });
      }
    });
  }

  /* ---------------- participants ---------------- */
  function filteredRegs() {
    const q = state.pq.trim().toLowerCase();
    return Store.regs.filter((r) => r.email &&
      (!state.pFest || r.festId === state.pFest) &&
      (!state.pEvent || r.eventId === state.pEvent) &&
      (!state.pStatus || r.status === state.pStatus) &&
      (!state.pPay || (state.pPay === 'none' ? !r.payment : r.payment && r.payment.status === state.pPay)) &&
      (!q || [r.id, r.name, r.email, r.phone, r.institution, r.teamName, ...(r.members || [])].join(' ').toLowerCase().includes(q))
    ).sort((a, b) => b.createdAt - a.createdAt);
  }

  function rowHtml(r) {
    const e = Store.event(r.eventId) || {};
    return '<tr data-id="' + r.id + '" class="' + (state.sel.has(r.id) ? 'sel' : '') + '">' +
      '<td class="chk">' + (Store.can('manage') ? '<label class="check"><input type="checkbox" data-sel="' + r.id + '"' + (state.sel.has(r.id) ? ' checked' : '') + ' aria-label="Select ' + esc(r.name) + '"></label>' : '') + '</td>' +
      '<td class="who c-who row-link" data-open="' + r.id + '"><b>' + esc(r.name) + '</b><span>' + esc(r.email) + '</span></td>' +
      '<td class="c-ev" style="max-width:220px">' + esc(e.title) + '<span class="tiny faint" style="display:block">' + esc(r.id) + '</span></td>' +
      '<td class="c-team">' + (r.teamName ? esc(r.teamName) + ' <span class="faint">(' + ((r.members || []).length + 1) + ')</span>' : '<span class="faint">Solo</span>') + '</td>' +
      '<td class="c-inst" style="max-width:200px">' + esc(r.institution) + '</td>' +
      '<td class="c-date small muted" style="white-space:nowrap">' + Fmt.ago(r.createdAt) + '</td>' +
      '<td class="c-date">' + (r.payment ? UI.pill(r.payment.status, r.payment.method === 'Cash' && r.payment.status === 'due' ? 'Cash due' : PAY[r.payment.status]) : '<span class="faint small">Free</span>') + '</td>' +
      '<td class="c-status">' + (Store.can('manage') ? statusSel(r) : pill(r.status)) + '</td></tr>';
  }
  const statusSel = (r) => '<select class="status-sel p-' + r.status + '" data-status="' + r.id + '" aria-label="Status for ' + esc(r.name) + '">' + Object.keys(STATUS).map((s) => '<option value="' + s + '"' + (s === r.status ? ' selected' : '') + '>' + STATUS[s] + '</option>').join('') + '</select>';

  function participants() {
    const fests = Store.festsSorted();
    const evOpts = Store.events.filter((e) => !state.pFest || e.festId === state.pFest).sort((a, b) => a.startsAt - b.startsAt);
    const html = '<div class="org-head"><div><h1 class="h2">Participants</h1><p data-count></p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (Store.can('manage') ? '<button class="btn btn-ink btn-sm" data-add-reg>' + icon.plus + 'Add participant</button>' : '') + '<button class="btn btn-line btn-sm" data-export>' + icon.down + 'Export CSV</button><button class="btn btn-line btn-sm" data-print-list>' + icon.print + 'Print list</button>' + (Store.can('manage') ? '<button class="btn btn-line btn-sm" data-badges>' + icon.print + 'Print ID badges</button>' : '') + '</div></div>' +
      '<div class="filters">' +
        '<label class="searchbar" style="height:44px;max-width:340px;flex:1 1 240px">' + icon.search + '<span class="sr">Search participants</span><input id="p-q" type="search" placeholder="Name, email, team or code" value="' + esc(state.pq) + '"></label>' +
        '<select class="select" id="p-fest" aria-label="Fest"><option value="">All fests</option>' + fests.map((f) => '<option value="' + f.id + '"' + (state.pFest === f.id ? ' selected' : '') + '>' + esc(f.title) + '</option>').join('') + '</select>' +
        '<select class="select" id="p-event" aria-label="Event"><option value="">All events</option>' + evOpts.map((e) => '<option value="' + e.id + '"' + (state.pEvent === e.id ? ' selected' : '') + '>' + esc(e.title) + '</option>').join('') + '</select>' +
        '<select class="select" id="p-pay" aria-label="Payment"><option value="">Any payment</option>' + [['submitted', 'Awaiting check'], ['verified', 'Paid'], ['rejected', 'Rejected'], ['due', 'Cash due'], ['none', 'No fee']].map(([v, l]) => '<option value="' + v + '"' + (state.pPay === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
        '<select class="select" id="p-status" aria-label="Status"><option value="">Any status</option>' + Object.entries(STATUS).map(([k, v]) => '<option value="' + k + '"' + (state.pStatus === k ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>' +
      '</div>' +
      '<div class="tbl-wrap"><table class="tbl stack"><thead><tr><th class="chk"><label class="check"><input type="checkbox" data-all aria-label="Select all shown"></label></th><th>Participant</th><th>Event</th><th>Team</th><th>Institution</th><th>Registered</th><th>Payment</th><th>Status</th></tr></thead><tbody data-rows></tbody></table><div data-more></div></div>' +
      '<div data-bulk></div>';

    return {
      title: 'Participants', html,
      mount(root) {
        const rows = $('[data-rows]', root), more = $('[data-more]', root), bulk = $('[data-bulk]', root), countEl = $('[data-count]', root);
        let list = [];
        const draw = () => {
          list = filteredRegs();
          const shown = list.slice(0, state.limit);
          rows.innerHTML = shown.length ? shown.map(rowHtml).join('') : '<tr><td colspan="8"><div class="empty" style="margin:10px 0"><p>No one matches these filters.</p><button class="btn btn-line btn-sm" data-reset-f>Clear filters</button></div></td></tr>';
          more.innerHTML = list.length > state.limit ? '<div class="more-row"><button class="btn btn-line btn-sm" data-more-btn>Show ' + Math.min(40, list.length - state.limit) + ' more of ' + (list.length - state.limit) + '</button></div>' : '';
          const teams = list.filter((r) => r.teamName).length;
          countEl.textContent = Fmt.plural(list.length, 'registration') + (teams ? ', ' + teams + ' of them teams' : '') + '. Change a status from its dropdown, or select several rows.';
          $('[data-all]', root).checked = shown.length > 0 && shown.every((r) => state.sel.has(r.id));
          drawBulk();
        };
        const drawBulk = () => {
          [...state.sel].forEach((id) => { if (!Store.reg(id)) state.sel.delete(id); });
          bulk.innerHTML = state.sel.size ? '<div class="bulk" role="region" aria-label="Bulk actions"><b>' + state.sel.size + ' selected</b>' +
            [['confirmed', 'Confirm'], ['waitlisted', 'Waitlist'], ['rejected', 'Reject'], ['checked_in', 'Check in']].map(([s, l]) => '<button class="btn btn-xs" data-bulk-set="' + s + '">' + l + '</button>').join('') +
            '<button class="btn btn-xs" data-bulk-export>Export</button><button class="btn btn-xs" data-bulk-clear>Clear</button></div>' : '';
        };
        draw();

        const q = $('#p-q', root);
        q.addEventListener('input', () => { state.pq = q.value; state.limit = 40; draw(); });
        $('#p-fest', root).addEventListener('change', (e) => { state.pFest = e.target.value; state.pEvent = ''; state.limit = 40; Router.render(); });
        $('#p-event', root).addEventListener('change', (e) => { state.pEvent = e.target.value; state.limit = 40; draw(); });
        $('#p-status', root).addEventListener('change', (e) => { state.pStatus = e.target.value; state.limit = 40; draw(); });
        $('#p-pay', root).addEventListener('change', (e) => { state.pPay = e.target.value; state.limit = 40; draw(); });
        root.addEventListener('change', async (e) => {
          const s = e.target.closest('[data-status]');
          if (s) { const r = Store.reg(s.dataset.status), before = r.status; await Store.setStatus([r.id], s.value); UI.toast(r.name + ': ' + STATUS[before].toLowerCase() + ' to ' + STATUS[s.value].toLowerCase()); draw(); }
          const c = e.target.closest('[data-sel]');
          if (c) { c.checked ? state.sel.add(c.dataset.sel) : state.sel.delete(c.dataset.sel); c.closest('tr').classList.toggle('sel', c.checked); drawBulk(); }
          if (e.target.matches('[data-all]')) { list.slice(0, state.limit).forEach((r) => (e.target.checked ? state.sel.add(r.id) : state.sel.delete(r.id))); draw(); }
        });
        root.addEventListener('click', async (e) => {
          const open = e.target.closest('[data-open]'); if (open) detail(Store.reg(open.dataset.open), draw);
          if (e.target.closest('[data-more-btn]')) { state.limit += 40; draw(); }
          if (e.target.closest('[data-reset-f]')) { Object.assign(state, { pq: '', pFest: '', pEvent: '', pStatus: '', pPay: '' }); Router.render(); }
          if (e.target.closest('[data-export]')) exportCsv(list, 'participants');
          if (e.target.closest('[data-add-reg]')) window.AdminX.addParticipant(state.pEvent, draw);
          if (e.target.closest('[data-print-list]')) window.AdminX.printList(list);
          if (e.target.closest('[data-badges]')) window.AdminX.badges(list, 'participants');
          if (e.target.closest('[data-bulk-export]')) exportCsv([...state.sel].map((id) => Store.reg(id)).filter(Boolean), 'selected-participants');
          if (e.target.closest('[data-bulk-clear]')) { state.sel.clear(); draw(); }
          const b = e.target.closest('[data-bulk-set]');
          if (b) { const n = state.sel.size; await Store.setStatus([...state.sel], b.dataset.bulkSet); state.sel.clear(); UI.toast(Fmt.plural(n, 'registration') + ' marked ' + STATUS[b.dataset.bulkSet].toLowerCase()); draw(); }
        });
      },
      live: false
    };
  }

  function detail(r, redraw) {
    if (!r) return;
    const e = Store.event(r.eventId) || {}, f = Store.fest(r.festId) || {};
    const ans = (e.questions || []).filter((q) => (r.answers || {})[q.id]);
    const body = '<div class="drawer-sec">Ticket</div><dl class="kv"><dt>Code</dt><dd class="code">' + esc(r.id) + '</dd><dt>Status</dt><dd>' + pill(r.status) + (r.status === 'waitlisted' ? ' <span class="small muted">number ' + Store.waitPos(r) + ' in line</span>' : '') + '</dd><dt>Event</dt><dd>' + esc(e.title) + '<br><span class="muted small">' + esc(f.title) + '</span></dd></dl>' +
      '<div class="drawer-sec">Person</div><dl class="kv"><dt>Name</dt><dd>' + esc(r.name) + '</dd><dt>Email</dt><dd><a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></dd><dt>Phone</dt><dd><a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a></dd><dt>Studies at</dt><dd>' + esc(r.institution) + ', ' + esc(r.level) + '</dd></dl>' +
      (r.teamName || Store.teamOf(r).inv ? '<div class="drawer-sec">Team</div><dl class="kv"><dt>Team</dt><dd>' + esc(r.teamName || '') + ' <span class="faint">(' + Store.teamOf(r).size + ' people' + ((Store.event(r.eventId) || {}).teamMin > Store.teamOf(r).size ? ', below the minimum of ' + Store.event(r.eventId).teamMin : '') + ')</span></dd><dt>Members</dt><dd>' + [esc(r.name) + ' (lead)', ...(r.members || []).map(esc), ...Store.teamOf(r).joined.map((m) => esc(m.name) + ' <span class="faint small">joined by link, ' + esc(m.email) + ', ' + esc(m.phone) + '</span>')].join('<br>') + '</dd>' + (Store.teamOf(r).inv ? '<dt>Invite link</dt><dd class="small">' + (Store.teamOf(r).inv.slots - Store.teamOf(r).joined.length) + ' spots still open</dd>' : '') + '</dl>' : '') +
      (r.promo ? '<div class="drawer-sec">Promo code</div><dl class="kv"><dt>Code</dt><dd class="code">' + esc(r.promo.code) + '</dd><dt>Discount</dt><dd>' + Fmt.taka(r.promo.discount) + ' off ' + Fmt.taka(r.promo.original) + '</dd></dl>' : '') +
      (ans.length ? '<div class="drawer-sec">Answers</div><dl class="kv">' + ans.map((q) => '<dt>' + esc(q.label) + '</dt><dd>' + (q.type === 'url' ? '<a href="' + esc(r.answers[q.id]) + '" target="_blank" rel="noopener">' + esc(r.answers[q.id]) + '</a>' : esc(r.answers[q.id])) + '</dd>').join('') + '</dl>' : '') +
      (r.payment ? '<div class="drawer-sec">Payment</div><dl class="kv"><dt>Status</dt><dd>' + UI.pill(r.payment.status, PAY[r.payment.status]) + '</dd><dt>Amount</dt><dd>' + Fmt.taka(r.payment.amount) + ' by ' + esc(r.payment.method) + '</dd>' + (r.payment.trxId ? '<dt>TrxID</dt><dd class="code">' + esc(r.payment.trxId) + '</dd><dt>Paid from</dt><dd>' + esc(r.payment.sender) + '</dd><dt>Paid to</dt><dd>' + esc(r.payment.to || '') + '</dd>' : '') + (r.payment.verifiedAt ? '<dt>Checked</dt><dd>' + esc(Fmt.when(r.payment.verifiedAt)) + ' by ' + esc(r.payment.by || '') + '</dd>' : '') + '</dl>' +
        (Store.can('manage') && r.payment.status !== 'verified' ? '<div style="display:flex;gap:8px;margin-bottom:6px"><button class="btn btn-ink btn-sm" data-pay="1">Mark paid</button>' + (r.payment.method !== 'Cash' ? '<button class="btn btn-danger btn-sm" data-pay="0">Reject payment</button>' : '') + '</div>' : '') : '') +
      (r.accountId ? '<div class="drawer-sec">Account</div><p class="small muted">Registered while signed in' + (Store.account(r.accountId) ? ' as ' + esc(Store.account(r.accountId).email) : '') + '.</p>' : '') +
      '<div class="drawer-sec">History</div><dl class="kv"><dt>Registered</dt><dd>' + esc(Fmt.when(r.createdAt)) + '</dd>' + (r.updatedAt && r.updatedAt !== r.createdAt ? '<dt>Last change</dt><dd>' + esc(Fmt.when(r.updatedAt)) + '</dd>' : '') + (r.promotedAt ? '<dt>From waitlist</dt><dd>' + esc(Fmt.when(r.promotedAt)) + '</dd>' : '') + (r.checkedInAt ? '<dt>Checked in</dt><dd>' + esc(Fmt.when(r.checkedInAt)) + '</dd>' : '') + '</dl>' +
      (Store.can('manage') ? '<div class="drawer-sec">Private note</div>' + field({ name: 'note', label: 'Only organizers see this. Shown to the participant if you reject them.', type: 'textarea', value: r.note || '' }) +
      '<div style="display:flex;gap:8px;justify-content:space-between"><button class="btn btn-line btn-sm" data-save-note>Save note</button><button class="btn btn-danger btn-sm" data-del-reg>Delete registration</button></div>' : '');
    UI.drawer({
      title: esc(r.teamName || r.name), body,
      foot: '<a class="btn btn-ghost btn-sm" href="#/tickets/' + r.id + '" target="_blank" rel="noopener">Open ticket</a>' +
        (Store.can('manage') ? ['confirmed', 'waitlisted', 'rejected', 'checked_in'] : []).filter((s) => s !== r.status).map((s) => '<button class="btn btn-sm ' + (s === 'confirmed' ? 'btn-ink' : s === 'rejected' ? 'btn-danger' : 'btn-line') + '" data-set="' + s + '">' + { confirmed: 'Confirm', waitlisted: 'Waitlist', rejected: 'Reject', checked_in: 'Check in' }[s] + '</button>').join(''),
      onMount(d, close) {
        d.addEventListener('click', async (ev) => {
          const b = ev.target.closest('[data-set]');
          if (b) { await Store.setStatus([r.id], b.dataset.set); UI.toast((r.teamName || r.name) + ' marked ' + STATUS[b.dataset.set].toLowerCase()); close(); redraw && redraw(); }
          if (ev.target.closest('[data-save-note]')) { await Store.saveNote(r.id, $('[name="note"]', d).value.trim()); UI.toast('Note saved'); }
          const pb = ev.target.closest('[data-pay]');

  /* ---------------- check-in ---------------- */

      '<div class="ci-grid"><div><div class="scanner" id="scanner"><div class="idle"><p>The camera stays off until you start it.</p><button class="btn btn-ink" data-cam>' + icon.cam + 'Start camera</button></div></div>' +
        '<form id="ci-form" style="display:flex;gap:8px;margin-top:14px" novalidate><label class="sr" for="ci-code">Ticket code</label><input class="input" id="ci-code" placeholder="Type a ticket code, e.g. TC26-K7Q4MX" autocapitalize="characters" spellcheck="false" style="text-transform:uppercase"><button class="btn btn-ink" type="submit">Check in</button></form></div>' +

    let stream = null, raf = null, lastCode = '', lastAt = 0, detector = null, canvas = null;

      title: 'Check-in', html, live: false,

        const handle = async (raw) => {
          const m = String(raw || '').toUpperCase().match(/[A-Z0-9]{2,6}-[A-Z0-9]{6}/);

          loop();
        }
      },
      unmount: stop
    };
  }

  window.Admin = { login, page };
})();

        '<div class="panel"><div class="panel-head"><h3>Where visitors come from</h3></div>' + seg(count(vis, 'src').slice(0, 6)) + '</div>' +
        '<div class="panel"><div class="panel-head"><h3>Newest accounts</h3><a class="small" href="#/organizer/accounts">All</a></div><div class="feed">' + [...Store.accounts].sort((a, b) => b.createdAt - a.createdAt).slice(0, 6).map((a) => '<div><b>' + esc(a.name) + '</b><span>' + Fmt.ago(a.createdAt) + '</span><span>' + esc(a.institution || a.email) + '</span></div>').join('') + '</div></div></div>' +
