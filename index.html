  /* ======================= PAYMENTS ======================= */
  function payments() {
    const all = Store.regs.filter((r) => r.payment && r.status !== 'cancelled');
    const sum = (l) => l.reduce((s, r) => s + (r.payment.amount || 0), 0);
    const st = (s) => all.filter((r) => r.payment.status === s);
    const trxCount = {}; all.forEach((r) => { if (r.payment.trxId) trxCount[r.payment.trxId] = (trxCount[r.payment.trxId] || 0) + 1; });
    const byMethod = {}; st('verified').forEach((r) => { byMethod[r.payment.method] = (byMethod[r.payment.method] || 0) + r.payment.amount; });
    const methodsTot = Object.values(byMethod).reduce((a, b) => a + b, 0) || 1;
    const q = ui.payQ.trim().toUpperCase();
    const list = all.filter((r) => (ui.payTab === 'all' || r.payment.status === ui.payTab) && (!ui.payMethod || r.payment.method === ui.payMethod) &&
      (!q || [r.payment.trxId, r.payment.sender, r.name, r.email, r.id, r.teamName].join(' ').toUpperCase().includes(q))).sort((a, b) => b.payment.at - a.payment.at);
    const tabs = [['submitted', 'Awaiting check', st('submitted').length], ['verified', 'Paid', st('verified').length], ['rejected', 'Rejected', st('rejected').length], ['due', 'Cash due', st('due').length], ['all', 'All', all.length]];
    const methods = [...new Set(all.map((r) => r.payment.method))];
    const canEdit = Store.can('manage');

    const html = head('Payments', 'Match each TrxID with your ' + (Store.payMethods().map((m) => m.type).join(', ') || 'mobile banking') + ' statement, then mark it paid. Paid entries are confirmed automatically on events that auto-confirm.',
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (canEdit ? '<button class="btn btn-ink btn-sm" data-match>Match from statement</button>' : '') + '<button class="btn btn-line btn-sm" data-export>' + icon.down + 'Export CSV</button></div>') +
      '<div class="kpis">' + kpi('Collected', Fmt.taka(sum(st('verified'))), st('verified').length + ' payments matched') + kpi('Awaiting check', Fmt.taka(sum(st('submitted'))), st('submitted').length + ' TrxIDs to match') +
        kpi('Cash due at desk', Fmt.taka(sum(st('due'))), st('due').length + ' people') + kpi('Rejected', st('rejected').length, 'Waiting for a new TrxID') + kpi('Reused TrxIDs', Object.values(trxCount).filter((n) => n > 1).length, 'Flagged in the table') + '</div>' +
      '<div class="panel" style="margin-bottom:20px"><div class="panel-head"><h3>Collected by method</h3><span>' + (Store.payMethods().map((m) => m.type + ' ' + m.number).join(', ') || 'No methods set up') + '</span></div>' +
        '<div class="seg">' + Object.entries(byMethod).map(([m, n]) => '<i style="--c:' + (PAY_COLORS[m] || 'var(--accent)') + ';--v:' + (n / methodsTot) * 100 + '%"></i>').join('') + '</div><div class="donut-legend" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">' +
        Object.entries(byMethod).map(([m, n]) => '<div style="--c:' + (PAY_COLORS[m] || 'var(--accent)') + '"><i></i>' + esc(m) + '<b>' + Fmt.taka(n) + '</b></div>').join('') + '</div></div>' +
      '<div class="filters"><div class="chips" role="group">' + tabs.map(([k, l, n]) => '<button class="chip" data-ptab="' + k + '" aria-pressed="' + (ui.payTab === k) + '">' + l + '<span class="n">' + n + '</span></button>').join('') + '</div><span class="spacer"></span>' +
        '<label class="searchbar" style="height:40px;max-width:280px;flex:1 1 220px">' + icon.search + '<span class="sr">Search payments</span><input id="pay-q" type="search" placeholder="TrxID, number or name" value="' + esc(ui.payQ) + '"></label>' +
        '<select class="select" id="pay-m" aria-label="Method"><option value="">All methods</option>' + methods.map((m) => '<option' + (ui.payMethod === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('') + '</select></div>' +
      '<div class="tbl-wrap"><table class="tbl stack"><thead><tr><th class="chk">' + (canEdit ? '<label class="check"><input type="checkbox" data-pall aria-label="Select all"></label>' : '') + '</th><th>Participant</th><th>Event</th><th>Amount</th><th>Paid from</th><th>TrxID</th><th>Status</th></tr></thead><tbody>' +
      (list.length ? list.slice(0, 150).map((r) => {
        const e = Store.event(r.eventId) || {}, p = r.payment, dup = p.trxId && trxCount[p.trxId] > 1;
        return '<tr data-id="' + r.id + '"' + (ui.paySel.has(r.id) ? ' class="sel"' : '') + '><td class="chk">' + (canEdit && p.status !== 'verified' ? '<label class="check"><input type="checkbox" data-psel="' + r.id + '"' + (ui.paySel.has(r.id) ? ' checked' : '') + '></label>' : '') + '</td>' +
          '<td class="who c-who"><b>' + esc(r.teamName || r.name) + '</b><span>' + esc(r.id) + ', ' + Fmt.ago(p.at || r.createdAt) + '</span></td>' +
          '<td class="c-ev">' + esc(e.title) + '</td>' +
          '<td class="c-team"><span style="display:inline-flex;align-items:center;gap:7px"><i style="width:9px;height:9px;border-radius:50%;background:' + (PAY_COLORS[p.method] || 'var(--accent)') + '"></i><b>' + Fmt.taka(p.amount) + '</b> ' + esc(p.method) + '</span></td>' +
          '<td class="c-inst num">' + esc(p.sender || '') + '</td>' +
          '<td class="c-date"><span class="code">' + esc(p.trxId || 'Cash') + '</span>' + (dup ? '<span class="pill p-rejected" style="margin-left:6px">Used ' + trxCount[p.trxId] + ' times</span>' : '') + '</td>' +
          '<td class="c-status" style="white-space:nowrap">' + (canEdit && p.status !== 'verified' ? '<button class="btn btn-ink btn-xs" data-ok="' + r.id + '">' + (p.method === 'Cash' ? 'Mark paid' : 'Verify') + '</button> ' + (p.method !== 'Cash' && p.status !== 'rejected' ? '<button class="btn btn-danger btn-xs" data-no="' + r.id + '">Reject</button>' : '') : pill(p.status, PAY[p.status])) + '</td></tr>';
      }).join('') : '<tr><td colspan="7"><div class="empty" style="margin:10px 0"><p>No payments in this list.</p></div></td></tr>') + '</tbody></table></div><div data-pbulk></div>';

    return {
      title: 'Payments', html, live: false,
      mount(root) {
        const bulk = () => { $('[data-pbulk]', root).innerHTML = ui.paySel.size ? '<div class="bulk"><b>' + ui.paySel.size + ' selected</b><button class="btn btn-xs" data-bverify>Verify all</button><button class="btn btn-xs" data-bclear>Clear</button></div>' : ''; };
        bulk();
        const q = $('#pay-q', root);
        let t; q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { ui.payQ = q.value; Router.render(); setTimeout(() => { const n = $('#pay-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 30); }, 250); });
        $('#pay-m', root).addEventListener('change', (e) => { ui.payMethod = e.target.value; Router.render(); });
        root.addEventListener('change', (e) => {
          const c = e.target.closest('[data-psel]'); if (c) { c.checked ? ui.paySel.add(c.dataset.psel) : ui.paySel.delete(c.dataset.psel); c.closest('tr').classList.toggle('sel', c.checked); bulk(); }
          if (e.target.matches('[data-pall]')) { $$('[data-psel]', root).forEach((x) => { x.checked = e.target.checked; e.target.checked ? ui.paySel.add(x.dataset.psel) : ui.paySel.delete(x.dataset.psel); }); bulk(); }
        });
        root.addEventListener('click', async (e) => {
          const tb = e.target.closest('[data-ptab]'); if (tb) { ui.payTab = tb.dataset.ptab; ui.paySel.clear(); Router.render(); }
          const ok = e.target.closest('[data-ok]'); if (ok) { const r = Store.reg(ok.dataset.ok); await Store.verifyPayments([r.id], true); UI.toast(Fmt.taka(r.payment.amount) + ' from ' + (r.teamName || r.name) + ' marked paid'); Router.render(); }
          const no = e.target.closest('[data-no]');
          if (no) {
            const r = Store.reg(no.dataset.no);
            UI.drawer({ title: 'Reject payment', body: '<p class="muted">' + esc(r.name) + ' sees this message on their ticket and can submit a new TrxID.</p><form id="rej">' + field({ name: 'note', label: 'Reason', type: 'textarea', value: 'This TrxID is not in our ' + r.payment.method + ' statement. Please check the SMS and submit it again.' }) + '</form>',
              foot: '<button class="btn btn-line" data-close>Cancel</button><button class="btn btn-danger" data-rej>Reject payment</button>',
              onMount(d, close) { $('[data-rej]', d).addEventListener('click', async () => { await Store.verifyPayments([r.id], false, $('[name=note]', d).value.trim()); close(); UI.toast('Payment rejected'); Router.render(); }); } });
          }
          if (e.target.closest('[data-bverify]')) { const n = ui.paySel.size; await Store.verifyPayments([...ui.paySel], true); ui.paySel.clear(); UI.toast(Fmt.plural(n, 'payment') + ' verified'); Router.render(); }
          if (e.target.closest('[data-bclear]')) { ui.paySel.clear(); Router.render(); }
          if (e.target.closest('[data-export]')) exportCsv(list, 'payments');
          if (e.target.closest('[data-match]')) matchStatement();
        });
      }
    };
  }

  function matchStatement() {
    UI.drawer({
      title: 'Match from your statement',
      body: '<p class="muted" style="margin-top:0">Open your bKash, Nagad or Rocket statement (app or merchant panel), copy the transaction list, and paste it here. Every awaiting TrxID found in the text is marked paid. Nothing else changes.</p>' +
        '<form id="mt">' + field({ name: 'text', label: 'Statement text', type: 'textarea', attrs: 'style="min-height:220px;font-variant-numeric:tabular-nums"', placeholder: 'Paste rows, IDs, or a whole SMS thread' }) + '</form><div data-res></div>',
      foot: '<button class="btn btn-line" data-close>Close</button><button class="btn btn-ink" data-run>Find and verify</button>',
      onMount(d) {
        $('[data-run]', d).addEventListener('click', async () => {
          const txt = $('[name=text]', d).value.toUpperCase();
          const ids = new Set(txt.match(/[A-Z0-9]{8,12}/g) || []);
          const waiting = Store.regs.filter((r) => r.payment && r.payment.status === 'submitted' && r.status !== 'cancelled');
          const hit = waiting.filter((r) => ids.has(r.payment.trxId));
          if (hit.length) await Store.verifyPayments(hit.map((r) => r.id), true);
          const miss = waiting.length - hit.length;
          $('[data-res]', d).innerHTML = '<div class="pay-status"><div><b>' + Fmt.plural(hit.length, 'payment') + ' verified</b>' + (hit.length ? ', ' + Fmt.taka(hit.reduce((s, r) => s + r.payment.amount, 0)) + ' in total' : '') + '.<br><span class="muted small">' + miss + ' still waiting; their TrxIDs were not in the pasted text.</span>' +
            (hit.length ? '<div class="feed" style="margin-top:10px">' + hit.slice(0, 12).map((r) => '<div><b>' + esc(r.teamName || r.name) + '</b><span>' + Fmt.taka(r.payment.amount) + '</span><span class="code">' + esc(r.payment.trxId) + '</span></div>').join('') + '</div>' : '') + '</div></div>';
          if (hit.length) UI.toast(Fmt.plural(hit.length, 'payment') + ' verified');
        });
      }
    });
  }

  /* ======================= ACCOUNTS ======================= */
  function accounts() {
    const now = Date.now();
    const regCount = {}; Store.regs.forEach((r) => { if (r.accountId) regCount[r.accountId] = (regCount[r.accountId] || 0) + 1; });
    const q = ui.acQ.trim().toLowerCase();
    let list = [...Store.accounts].sort((a, b) => b.createdAt - a.createdAt);
    const counts = { all: list.length, reg: list.filter((a) => regCount[a.id]).length, none: list.filter((a) => !regCount[a.id]).length, blocked: list.filter((a) => a.blocked).length };
    list = list.filter((a) => (ui.acTab === 'all' || (ui.acTab === 'reg' ? regCount[a.id] : ui.acTab === 'none' ? !regCount[a.id] : a.blocked)) && (!q || [a.name, a.email, a.phone, a.institution].join(' ').toLowerCase().includes(q)));
    const html = head('Accounts', 'Everyone who opened an account, when they last came back, and what they registered for.', '<button class="btn btn-line btn-sm" data-export>' + icon.down + 'Export CSV</button>') +
      '<div class="kpis">' + kpi('Accounts', Store.accounts.length, 'In total') + kpi('New this week', Store.accounts.filter((a) => now - a.createdAt < 7 * DAY).length, Store.accounts.filter((a) => now - a.createdAt < DAY).length + ' today') +
        kpi('Active today', Store.accounts.filter((a) => now - (a.lastSeen || 0) < DAY).length, 'Signed in or browsing') + kpi('Never registered', counts.none, 'Worth a nudge') + kpi('Blocked', counts.blocked, 'Cannot register') + '</div>' +
      '<div class="filters"><div class="chips">' + [['all', 'All'], ['reg', 'Registered for something'], ['none', 'No registrations'], ['blocked', 'Blocked']].map(([k, l]) => '<button class="chip" data-atab="' + k + '" aria-pressed="' + (ui.acTab === k) + '">' + l + '<span class="n">' + counts[k] + '</span></button>').join('') + '</div><span class="spacer"></span>' +
        '<label class="searchbar" style="height:40px;max-width:300px;flex:1 1 220px">' + icon.search + '<span class="sr">Search accounts</span><input id="ac-q" type="search" placeholder="Name, email, phone, school" value="' + esc(ui.acQ) + '"></label></div>' +
      '<div class="tbl-wrap"><table class="tbl stack"><thead><tr><th class="chk"></th><th>Person</th><th>School</th><th>Joined</th><th>Last seen</th><th>Tickets</th><th>Status</th></tr></thead><tbody>' +
      (list.length ? list.slice(0, ui.acLimit).map((a) => '<tr class="row-link" data-acct="' + a.id + '"><td class="chk"><span class="avatar sm">' + esc(Fmt.initials(a.name)) + '</span></td><td class="who c-who"><b>' + esc(a.name) + '</b><span>' + esc(a.email) + '</span></td><td class="c-inst">' + esc(a.institution || '') + '</td><td class="c-date small muted">' + Fmt.ago(a.createdAt) + '</td><td class="c-team small muted">' + (a.lastSeen ? Fmt.ago(a.lastSeen) : '') + '</td><td class="c-ev">' + (regCount[a.id] ? Fmt.plural(regCount[a.id], 'ticket') : '<span class="faint">None yet</span>') + '</td><td class="c-status">' + (a.blocked ? pill('blocked', 'Blocked') : pill('confirmed', 'Active')) + '</td></tr>').join('') : '<tr><td colspan="7"><div class="empty" style="margin:10px 0"><p>No accounts match.</p></div></td></tr>') +
      '</tbody></table>' + (list.length > ui.acLimit ? '<div class="more-row"><button class="btn btn-line btn-sm" data-more>Show more</button></div>' : '') + '</div>';
    return {
      title: 'Accounts', html, live: false,
      mount(root) {
        const q = $('#ac-q', root); let t;
        q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { ui.acQ = q.value; Router.render(); setTimeout(() => { const n = $('#ac-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 30); }, 250); });
        root.addEventListener('click', (e) => {
          const tb = e.target.closest('[data-atab]'); if (tb) { ui.acTab = tb.dataset.atab; Router.render(); }
          if (e.target.closest('[data-more]')) { ui.acLimit += 40; Router.render(); }
          if (e.target.closest('[data-export]')) UI.download('accounts-' + new Date().toISOString().slice(0, 10) + '.csv', UI.csv([['Name', 'Email', 'Phone', 'Institution', 'Level', 'Joined', 'Last seen', 'Tickets', 'Blocked'], ...list.map((a) => [a.name, a.email, a.phone, a.institution, a.level, new Date(a.createdAt).toISOString(), a.lastSeen ? new Date(a.lastSeen).toISOString() : '', regCount[a.id] || 0, a.blocked ? 'yes' : ''])]), 'text/csv');
          const row = e.target.closest('[data-acct]'); if (row) acctDrawer(Store.account(row.dataset.acct));
        });
      }
    };
  }
  function acctDrawer(a) {
    const regs = Store.regs.filter((r) => r.accountId === a.id).sort((x, y) => y.createdAt - x.createdAt);
    const acts = Store.activity.filter((x) => x.uid === a.id).slice(-12).reverse();
    UI.drawer({
      title: esc(a.name),
      body: '<div class="drawer-sec">Profile</div><dl class="kv"><dt>Email</dt><dd><a href="mailto:' + esc(a.email) + '">' + esc(a.email) + '</a></dd><dt>Phone</dt><dd>' + esc(a.phone || '') + '</dd><dt>Studies at</dt><dd>' + esc((a.institution || '') + (a.level ? ', ' + a.level : '')) + '</dd><dt>Joined</dt><dd>' + esc(Fmt.when(a.createdAt)) + '</dd><dt>Last seen</dt><dd>' + (a.lastSeen ? esc(Fmt.when(a.lastSeen)) : '') + '</dd><dt>Status</dt><dd>' + (a.blocked ? pill('blocked', 'Blocked') : pill('confirmed', 'Active')) + '</dd></dl>' +
        '<div class="drawer-sec">Registrations</div>' + (regs.length ? '<div class="feed">' + regs.map((r) => '<div><a href="#/organizer/participants?event=' + r.eventId + '&status=" data-close><b>' + esc((Store.event(r.eventId) || {}).title || '') + '</b></a>' + pill(r.status) + '<span>' + esc(r.id) + ', ' + Fmt.ago(r.createdAt) + '</span></div>').join('') + '</div>' : '<p class="muted">No registrations yet.</p>') +
        '<div class="drawer-sec">Recent activity</div>' + (acts.length ? acts.map((x) => actRow(x)).join('') : '<p class="muted">No tracked activity.</p>'),
      foot: Store.can('manage') ? '<button class="btn btn-danger btn-sm" data-del>Delete account</button><button class="btn btn-line btn-sm" data-block>' + (a.blocked ? 'Unblock' : 'Block') + '</button>' : '',
      onMount(d, close) {

            banner: { on: ck('banner_on'), text: g('banner_text'), textBn: g('banner_textBn'), link: g('banner_link') },
            sections: { countdown: ck('sec_countdown'), leaderboard: ck('sec_leaderboard'), sponsors: ck('sec_sponsors'), faq: ck('sec_faq'), visits: ck('sec_visits') },
            policy: { requireAccount: ck('pol_requireAccount'), saveDrafts: ck('pol_saveDrafts'), tracking: ck('pol_tracking') },
            payments: pms, faq, sponsors: pairs('sp_n', 'sp_t', 'name', 'role'),

            contactEmail: g('contactEmail'), contactPhone: g('contactPhone'), address: g('address'),
            socials: { facebook: g('so_facebook'), instagram: g('so_instagram'), youtube: g('so_youtube'), linkedin: g('so_linkedin') }

  function qrCanvas(text, px) {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(), m = 4, s = Math.floor(px / (n + m * 2)), c = document.createElement('canvas');
    c.width = c.height = s * (n + m * 2); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#111';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (q.isDark(r, k)) x.fillRect((k + m) * s, (r + m) * s, s, s);
    return c;
  }

  function badges(regs, label) {

    const w = window.open('', '_blank'); if (!w) { UI.toast('Allow pop-ups to print badges', 'bad'); return; }

    const cards = [];

      const qr = UI.qrSvg(location.origin + location.pathname + '#/tickets/' + r.id, '#111');

      const art = ev.art && ev.art.src ? '<span class="bg" style="--d:' + ((ev.art.dim == null ? 55 : ev.art.dim) / 100) + '"><img src="' + esc(ev.art.src) + '" alt=""></span>' : '';

  /* ======================= DAILY BRIEFING (plain code, no AI) ======================= */
  function briefing(evs, regs) {
    const now = Date.now(), d0 = new Date().setHours(0, 0, 0, 0);
    const active = regs.filter((r) => !['cancelled', 'rejected'].includes(r.status) && r.source !== 'desk');
    const today = active.filter((r) => r.createdAt >= d0).length, yday = active.filter((r) => r.createdAt >= d0 - DAY && r.createdAt < d0).length;
    const week = active.filter((r) => now - r.createdAt < 7 * DAY);
    const lines = [];
    const trend = yday ? Math.round(((today - yday) / yday) * 100) : null;
    lines.push('<b>' + Fmt.plural(today, 'registration') + ' today</b>' + (trend == null ? '' : trend >= 0 ? ', up ' + trend + '% on yesterday (' + yday + ')' : ', down ' + Math.abs(trend) + '% on yesterday (' + yday + ')') + '. ' + week.length + ' in the last 7 days.');
    const byEv = {}; week.forEach((r) => { byEv[r.eventId] = (byEv[r.eventId] || 0) + 1; });
    const top = Object.entries(byEv).sort((a, b) => b[1] - a[1])[0];
    if (top && Store.event(top[0])) lines.push('Most popular this week: <b>' + esc(Store.event(top[0]).title) + '</b> with ' + top[1] + ' sign-ups.');
    const closing = evs.filter((e) => Store.state(e).key === 'closing');
    if (closing.length) lines.push('Closing within 48 hours: ' + closing.map((e) => '<b>' + esc(e.title) + '</b> (' + Store.state(e).left + ' places left, ' + Fmt.rel(e.deadline) + ')').join(', ') + '. Worth a reminder post.');
    const full = evs.filter((e) => ['full', 'waitlist'].includes(Store.state(e).key));
    if (full.length) lines.push(full.map((e) => '<b>' + esc(e.title) + '</b>').join(', ') + (full.length === 1 ? ' is' : ' are') + ' full, with ' + full.reduce((s, e) => s + Store.state(e).wl, 0) + ' people waiting. Raising capacity lets them in automatically.');
    const slow = evs.filter((e) => Store.state(e).canRegister && e.startsAt - now < 21 * DAY && Store.state(e).pct < 25);
    if (slow.length) lines.push('Filling slowly: ' + slow.map((e) => '<b>' + esc(e.title) + '</b> (' + Store.state(e).pct + '% full)').join(', ') + '.');
    const wait = regs.filter((r) => r.payment && r.payment.status === 'submitted' && r.status !== 'cancelled');
    if (wait.length) lines.push('<b>' + Fmt.taka(wait.reduce((s, r) => s + r.payment.amount, 0)) + '</b> in ' + Fmt.plural(wait.length, 'payment') + ' waiting to be matched, oldest ' + Fmt.ago(Math.min(...wait.map((r) => r.payment.at || r.createdAt))) + '.');
    const pend = regs.filter((r) => r.status === 'pending' && !(r.payment && r.payment.status === 'submitted')).length;
    if (pend) lines.push(Fmt.plural(pend, 'registration') + ' waiting for your review.');
    const drafts = Store.drafts.filter((x) => now - x.updatedAt < 3 * DAY).length;
    if (drafts) lines.push(Fmt.plural(drafts, 'person', 'people') + ' started a form and did not finish. Their contacts are on the Live monitor.');
    const live = evs.filter((e) => e.startsAt < now + 12 * 36e5 && e.endsAt > now);
    live.forEach((e) => { const pool = Store.regsOf(e.id).filter((r) => SEAT.includes(r.status)); const inn = pool.filter((r) => r.status === 'checked_in').length; lines.push('<b>' + esc(e.title) + '</b> is on today: ' + inn + ' of ' + pool.length + ' checked in.'); });
    return '<div class="panel brief"><div class="panel-head"><h3>Today\'s briefing</h3><span>Written by code from your live data, no AI</span></div><ul>' + lines.map((l) => '<li>' + l + '</li>').join('') + '</ul></div>';
  }

  Object.assign(window.AdminX, { notices, promos, emails, badges, briefing });
})();

    [/^\/tickets\/([^/]+)$/, (id, q) => Views.ticket(id, q)],
    [/^\/certificate\/([^/]+)$/, (id) => Views.certificate(id)],
    [/^\/account$/, (q) => Views.account(q)],
    [/^\/join\/([^/]+)$/, (k) => Views.join(k)],
    [/^\/organizer\/login$/, () => Admin.login()],
    [/^\/organizer(?:\/([a-z]+))?$/, (tab, q) => Admin.page(tab, q)]
  ];
  const parse = () => {
    const h = location.hash.replace(/^#/, '') || '/';
    const [path, qs] = h.split('?');
    return { path: path || '/', q: new URLSearchParams(qs || '') };
  };

  let pending = false;
  const Router = {
    current: null, lastPath: null, _raf: 0,
    render() { if (this._raf) return; this._raf = requestAnimationFrame(() => { this._raf = 0; this._render(); }); },
    _render() {
      const { path, q } = parse();
      let view;
      for (const [re, fn] of routes) {
        const m = path.match(re);
        if (m) { const args = m.slice(1).map((x) => (x == null ? x : decodeURIComponent(x))); view = fn(...args, q); break; }
      }
      if (!view) view = Views.notFound('There is no page at this address.');
      if (this.current && this.current.unmount) this.current.unmount();
      const changed = path !== this.lastPath;
      const main = $('#main');
      main.innerHTML = '<div class="view' + (changed ? ' page' : '') + '">' + view.html + '</div>';
      const S = Store.settings || {};
      document.title = view.title + ' | ' + (S.siteName || 'Stub') + ', ' + (S.clubName || '');
      const org = path.startsWith('/organizer') && path !== '/organizer/login';
      document.body.classList.toggle('is-org', org);
      if (view.mount) view.mount(main.firstElementChild);
      this.current = view;
      if (changed) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
      this.lastPath = path;
      pending = false;
      shell(path);
    }
  };
  window.Router = Router;

  /* ---------- header, banner, footer ---------- */
  function shell(path) {
    const S = Store.settings || {};
    const key = path.startsWith('/tickets') || path.startsWith('/certificate') ? 'tickets' : path.startsWith('/organizer') ? 'organizer' : path.startsWith('/account') ? 'account' : 'events';
    $$('.nav a').forEach((a) => { if (a.dataset.nav === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const n = Store.myTickets().filter((r) => { const e = Store.event(r.eventId); return e && e.endsAt > Date.now() && !['cancelled', 'rejected'].includes(r.status); }).length;
    const badge = $('.tickets-count'); badge.textContent = n; badge.hidden = !n;
    $('[data-nav="organizer"]').textContent = Store.admin ? 'Dashboard' : 'Organizer';
    const acct = $('[data-acct]');
    acct.innerHTML = Store.user ? '<span class="avatar sm" style="width:32px;height:32px">' + esc(Fmt.initials(Store.user.name)) + '</span>' : icon.user;
    acct.setAttribute('aria-label', Store.user ? 'Your account, ' + Store.user.name : 'Sign in');
    acct.classList.toggle('icon-btn', !Store.user);
    // brand
    $('.brand-name').textContent = S.siteName || 'Stub';
    $('.brand-club').innerHTML = esc(S.clubName || '').replace(' ', '<br>');
    const mark = $('.brand-mark'), logo = $('.brand-logo');
    if (S.logo) { logo.src = S.logo; logo.hidden = false; mark.style.display = 'none'; } else { logo.hidden = true; mark.style.display = ''; }
    // banner
    const b = $('#banner'), off = sessionStorage.getItem('stub.banner.off') === (S.banner && S.banner.text);
    if (S.banner && S.banner.on && S.banner.text && !path.startsWith('/organizer') && !off) {
      b.hidden = false;
      const bt = Store.loc(S.banner.text, S.banner.textBn);
      b.innerHTML = '<div class="wrap">' + (S.banner.link ? '<a href="' + esc(S.banner.link) + '">' + esc(bt) + '</a>' : '<span>' + esc(bt) + '</span>') + '<button aria-label="Hide announcement" data-banner-x>' + icon.x + '</button></div>';
    } else b.hidden = true;
    // footer
    const so = S.socials || {};
    const links = [['Facebook', so.facebook], ['Instagram', so.instagram], ['YouTube', so.youtube], ['LinkedIn', so.linkedin]].filter((x) => x[1]);
    $('#foot-info').innerHTML = '<b style="color:var(--bone)">' + esc(S.clubName || '') + '</b><br>' + [S.address, S.contactPhone, S.contactEmail ? '<a href="mailto:' + esc(S.contactEmail) + '">' + esc(S.contactEmail) + '</a>' : ''].filter(Boolean).map((x) => (x.startsWith('<a') ? x : esc(x))).join('<br>') +
      (links.length ? '<br>' + links.map(([l, u]) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + l + '</a>').join(', ') : '');
    $('#mode-note').textContent = Store.mode === 'firebase' ? 'Live data.' : 'Demo mode: data is saved in this browser.';
    document.body.classList.remove('menu-open');
    $('.menu-btn').setAttribute('aria-expanded', 'false');
    themeIcon();
    const lb = $('[data-lang-btn]'); lb.textContent = I18N.lang === 'bn' ? 'EN' : 'বাং'; lb.setAttribute('aria-label', I18N.lang === 'bn' ? 'Switch to English' : 'বাংলায় দেখুন'); lb.setAttribute('data-no-i18n', '');
    if (window.Assistant) Assistant.draw();
    document.body.classList.toggle('has-cta', !!$('.m-cta'));
  }
  function themeIcon() { const t = document.documentElement.dataset.theme; const b = $('[data-theme-btn]'); b.innerHTML = t === 'light' ? icon.moon : icon.sun; b.setAttribute('aria-label', t === 'light' ? 'Switch to dark mode' : 'Switch to light mode'); }

  /* ---------- live updates ---------- */
  const typing = () => { const a = document.activeElement; return a && $('#main').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };
  Store.on(() => {
    if (!Store.ready) return;
    const v = Router.current;
    if (!v || v.live === false || v.dirty) { shell(parse().path); return; }
    if (UI.layersOpen || typing()) { pending = true; return; }
    Router.render();
  });
  window.addEventListener('stub:layerclosed', () => { if (pending && !UI.layersOpen) Router.render(); });
  document.addEventListener('focusout', () => { setTimeout(() => { if (pending && !typing() && !UI.layersOpen && Router.current && !Router.current.dirty && Router.current.live !== false) Router.render(); }, 50); });
  window.addEventListener('hashchange', () => Router.render());
  setInterval(() => { if (!typing() && !UI.layersOpen && Router.current && Router.current.live !== false && !Router.current.dirty) Router.render(); }, 60000);

  document.addEventListener('click', (e) => {
    if (e.target.closest('.menu-btn')) { const open = document.body.classList.toggle('menu-open'); $('.menu-btn').setAttribute('aria-expanded', String(open)); }
    if (e.target.closest('[data-lang-btn]')) { I18N.set(I18N.lang === 'bn' ? 'en' : 'bn'); if (Router.current && Router.current.dirty) Router.current.dirty = false; Router.render(); }
    if (e.target.closest('[data-theme-btn]')) { setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true); themeIcon(); }
    if (e.target.closest('[data-banner-x]')) { sessionStorage.setItem('stub.banner.off', (Store.settings.banner || {}).text || ''); $('#banner').hidden = true; }
  });
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', (e) => { if (!localStorage.getItem('stub.theme') && (Store.settings.defaultTheme || 'system') === 'system') { setTheme(e.matches ? 'light' : 'dark', false); themeIcon(); } });

  I18N.start();
  Store.init().then(() => {
    const boot = $('#boot'); if (boot) boot.remove();
    Store.visit();
    Router.render();
  });
})();

  </script>
</body>
</html>
