  const rand = (n) => { const A = 'abcdefghijkmnpqrstuvwxyz23456789'; const b = new Uint32Array(n); crypto.getRandomValues(b); return [...b].map((x) => A[x % A.length]).join(''); };
  const randCode = (prefix) => { const A = window.StubSeed.ALPHA; const b = new Uint32Array(6); crypto.getRandomValues(b); return prefix + '-' + [...b].map((x) => A[x % A.length]).join(''); };
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn('storage full or blocked', e); return false; } };
  async function hash(pw) {
    const txt = 'stub:' + pw;
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 5381; for (let i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0; return 'd' + (h >>> 0).toString(16);
  }

  /* ---------------- visitor context ---------------- */
  const visitorId = () => { let v = lsGet(VID, null); if (!v) { v = 'v' + rand(10); lsSet(VID, v); } return v; };
  const sessionId = () => { let s = sessionStorage.getItem('stub.sid'); if (!s) { s = 's' + rand(10); sessionStorage.setItem('stub.sid', s); } return s; };
  const device = () => {
    const ua = navigator.userAgent, w = Math.min(screen.width, screen.height), W = Math.max(screen.width, screen.height);
    if (/iPad|Tablet/i.test(ua) || (/Android/i.test(ua) && !/Mobi/i.test(ua)) || (navigator.maxTouchPoints > 1 && w >= 600 && W <= 1400 && !/Mobi/i.test(ua))) return 'tablet';
    if (/Mobi|Android|iPhone/i.test(ua)) return 'mobile';
    return 'desktop';
  };
  const source = () => {
    let s = sessionStorage.getItem('stub.src'); if (s) return s;
    const u = new URLSearchParams(location.search).get('utm_source') || new URLSearchParams(location.hash.split('?')[1] || '').get('src');
    const r = document.referrer;
    if (u) s = u.charAt(0).toUpperCase() + u.slice(1);
    else if (!r || r.includes(location.host)) s = 'Direct';
    else if (/messenger|m\.me/.test(r)) s = 'Messenger';
    else if (/facebook|fb\.com/.test(r)) s = 'Facebook';
    else if (/google\./.test(r)) s = 'Google';
    else if (/whatsapp|wa\.me/.test(r)) s = 'WhatsApp';
    else if (/instagram/.test(r)) s = 'Instagram';
    else { try { s = new URL(r).hostname.replace(/^www\./, ''); } catch (e) { s = 'Other'; } }
    sessionStorage.setItem('stub.src', s); return s;
  };

  /* ---------------- store ---------------- */
  const Store = {
    mode: CFG.firebase && CFG.firebase.apiKey ? 'firebase' : 'local',
    ready: false, admin: null, user: null,
    fests: [], events: [], regs: [], notes: [], accounts: [], activity: [], drafts: [], promos: [], invites: [], outbox: [], settings: {},
    seededAt: 0,
    _subs: new Set(), _actSubs: new Set(),
    _m: { fest: new Map(), event: new Map(), reg: new Map(), byEvent: new Map(), acct: new Map() },

    on(fn) { this._subs.add(fn); return () => this._subs.delete(fn); },
    onActivity(fn) { this._actSubs.add(fn); return () => this._actSubs.delete(fn); },
    emit() { this._index(); this._subs.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); },
    emitActivity(a) { this._actSubs.forEach((f) => { try { f(a); } catch (e) { console.error(e); } }); },
    _index() {
      const m = this._m;
      m.fest = new Map(this.fests.map((f) => [f.id, f]));
      m.event = new Map(this.events.map((e) => [e.id, e]));
      m.reg = new Map(this.regs.map((r) => [r.id, r]));
      m.acct = new Map(this.accounts.map((a) => [a.id, a]));
      m.byEvent = new Map();
      this.regs.forEach((r) => { if (!m.byEvent.has(r.eventId)) m.byEvent.set(r.eventId, []); m.byEvent.get(r.eventId).push(r); });
    },

    fest(id) { return this._m.fest.get(id); },
    event(id) { return this._m.event.get(id); },
    reg(id) { return this._m.reg.get(id); },
    account(id) { return this._m.acct.get(id); },
    festsSorted() {
      const rank = (f) => ({ live: 0, upcoming: 1, past: 2 })[this.festState(f).key];
      return [...this.fests].filter((f) => f.published !== false || this.admin)
        .sort((a, b) => rank(a) - rank(b) || (rank(a) === 2 ? b.startsAt - a.startsAt : a.startsAt - b.startsAt));
    },
    eventsOf(festId) { return this.events.filter((e) => e.festId === festId).sort((a, b) => a.startsAt - b.startsAt); },
    regsOf(eventId) { return this._m.byEvent.get(eventId) || []; },
    taken(eventId) { return this.regsOf(eventId).filter((r) => SEAT.includes(r.status)).length; },
    waiting(eventId) { return this.regsOf(eventId).filter((r) => r.status === 'waitlisted').sort((a, b) => a.createdAt - b.createdAt); },
    waitPos(reg) { return this.waiting(reg.eventId).findIndex((r) => r.id === reg.id) + 1; },
    inkOf(festId) { const f = this.fest(festId); return 'var(--' + ((f && f.ink) || 'orange') + ')'; },
    payMethods() { return (this.settings.payments || []).filter((p) => p.on); },
    can(perm) { if (!this.admin) return false; const r = ROLES[this.admin.role] || ROLES.volunteer; return r.can.includes('*') || r.can.includes(perm); },

    festState(f) {
      const now = Date.now();
      if (now > f.endsAt) return { key: 'past', label: T('Finished', 'শেষ হয়েছে') };
      if (now >= f.startsAt) return { key: 'live', label: T('Happening now', 'এখন চলছে') };
      const open = this.eventsOf(f.id).some((e) => this.state(e).canRegister);
      return { key: 'upcoming', label: open ? T('Registration open', 'নিবন্ধন চলছে') : T('Coming up', 'আসছে'), open };
    },

    state(ev) {
      const now = Date.now();
      const taken = this.taken(ev.id), cap = Math.max(1, ev.capacity | 0), left = Math.max(0, cap - taken);
      const wl = this.waiting(ev.id).length;
      const base = { taken, cap, left, wl, pct: Math.min(100, Math.round((taken / cap) * 100)), canRegister: false };
      if (now > ev.endsAt) return { ...base, key: 'ended', label: T('Finished', 'শেষ হয়েছে'), reason: T('This event has already taken place.', 'এই ইভেন্টটি ইতিমধ্যে শেষ হয়েছে।') };
      if (ev.opensAt && now < ev.opensAt) return { ...base, key: 'soon', label: T('Opens ' + Fmt.date(ev.opensAt), Fmt.date(ev.opensAt) + ' থেকে শুরু'), reason: T('Registration opens on ' + Fmt.long(ev.opensAt) + ' at ' + Fmt.timeFull(ev.opensAt) + '.', 'নিবন্ধন শুরু হবে ' + Fmt.long(ev.opensAt) + ', ' + Fmt.timeFull(ev.opensAt) + '।') };
      if (ev.regOpen === false) return { ...base, key: 'paused', label: T('Registration paused', 'নিবন্ধন সাময়িক বন্ধ'), reason: T('The organizers have paused registration for now. Check back soon.', 'আয়োজকরা আপাতত নিবন্ধন বন্ধ রেখেছেন। কিছুক্ষণ পর আবার দেখুন।') };
      if (now > ev.deadline) return { ...base, key: 'closed', label: T('Registration closed', 'নিবন্ধন বন্ধ'), reason: T('Registration closed on ' + Fmt.when(ev.deadline) + '.', 'নিবন্ধন বন্ধ হয়েছে ' + Fmt.when(ev.deadline) + '।') };
      if (left <= 0) {
        if (wl < (ev.waitlist | 0)) return { ...base, key: 'waitlist', label: T('Full, waitlist open', 'পূর্ণ, অপেক্ষমাণ তালিকা খোলা'), canRegister: true, reason: '' };
        return { ...base, key: 'full', label: T('Full', 'পূর্ণ'), reason: T('Every seat and waitlist spot is taken.', 'সব আসন ও অপেক্ষমাণ তালিকা পূর্ণ।') };
      }
      if (ev.deadline - now < 48 * HOUR) return { ...base, key: 'closing', label: T('Closes ' + Fmt.relShort(ev.deadline), Fmt.relShort(ev.deadline) + ' বন্ধ হবে'), canRegister: true };
      return { ...base, key: 'open', label: left <= 10 ? T(Fmt.plural(left, 'seat') + ' left', left + 'টি আসন বাকি') : T('Open', 'খোলা'), canRegister: true };
    },

    clashes(ev) {
      return this.myTickets().filter((r) => {
        if (r.eventId === ev.id || ['cancelled', 'rejected'].includes(r.status)) return false;
        const o = this.event(r.eventId);
        return o && o.startsAt < ev.endsAt && ev.startsAt < o.endsAt;
      });
    },

    /* ---- wallet + my tickets ---- */
    wallet: {
      ids: () => lsGet(WALLET, []),
      add(id) { const w = lsGet(WALLET, []); if (!w.includes(id)) { w.unshift(id); lsSet(WALLET, w); } },
      remove(id) { lsSet(WALLET, lsGet(WALLET, []).filter((x) => x !== id)); }
    },
    myTickets() {
      const ids = new Set(this.wallet.ids());
      return this.regs.filter((r) => r.email && (ids.has(r.id) || (this.user && r.accountId === this.user.id)));
    },
    walletTickets() { return this.myTickets(); },

    /* ---- activity tracking ---- */
    track(type, extra, force) {
      if (this.admin && !force) return;
      if (this.settings.policy && this.settings.policy.tracking === false && !force) return;
      const a = clean({ t: Date.now(), type, sid: sessionId(), vid: visitorId(), uid: this.user ? this.user.id : null, dev: device(), src: source(), ...(extra || {}) });
      try { this.adapter.logActivity(a); } catch (e) { console.warn(e); }
      this.emitActivity(a);
    },
    visit() {
      if (sessionStorage.getItem('stub.visited')) return;
      sessionStorage.setItem('stub.visited', '1');
      this.track('visit', { path: location.hash.replace('#', '') || '/' });
    },
    visitCount() { return (this.settings.visitBase || 0) + (this.mode === 'firebase' ? (this._visits || 0) : this.activity.filter((a) => a.type === 'visit').length); },

    /* ---- unfinished registrations ---- */
    formDraft: {
      get: (eventId) => lsGet('stub.form.' + eventId, null),
      set: (eventId, data) => lsSet('stub.form.' + eventId, data),
      clear: (eventId) => { try { localStorage.removeItem('stub.form.' + eventId); } catch (e) { /* ignore */ } }
    },
    async saveDraft(eventId, d) {
      if (this.admin || (this.settings.policy && this.settings.policy.saveDrafts === false)) return;
      const id = visitorId() + '_' + eventId;
      const existing = this.drafts.find((x) => x.id === id);
      const draft = clean({ id, vid: visitorId(), eventId, step: d.step, stepName: d.stepName, name: d.name || '', email: d.email || '', phone: d.phone || '', institution: d.institution || '', teamName: d.teamName || '', uid: this.user ? this.user.id : null, startedAt: existing ? existing.startedAt : Date.now(), updatedAt: Date.now(), dev: device() });
      await this.adapter.put('drafts', draft);
    },
    async clearDraft(eventId) { const id = visitorId() + '_' + eventId; if (this.drafts.some((d) => d.id === id) || this.mode === 'firebase') await this.adapter.del('drafts', id).catch(() => {}); },

    /* ---- registration ---- */
    /* ---- promo codes ---- */
    async checkPromo(ev, raw) {
      const code = String(raw || '').trim().toUpperCase();
      if (!code) return null;
      const p = this.promos.find((x) => x.id === code) || await this.adapter.fetchPromo(code);
      const bad = (m) => ({ ok: false, code, msg: m });
      if (!p || p.active === false) return bad(T('That code is not valid.', 'এই কোডটি সঠিক নয়।'));
      if (p.expiresAt && Date.now() > p.expiresAt) return bad(T('That code has expired.', 'এই কোডের মেয়াদ শেষ।'));
      if (p.events && p.events.length && !p.events.includes(ev.id)) return bad(T('That code does not work for this event.', 'এই ইভেন্টে কোডটি প্রযোজ্য নয়।'));
      if (p.maxUses && (p.uses || 0) >= p.maxUses) return bad(T('That code has been used up.', 'কোডটির ব্যবহারসীমা শেষ।'));
      const off = p.type === 'percent' ? Math.round((ev.fee * Math.min(100, p.value)) / 100) : Math.min(ev.fee, p.value);
      return { ok: true, code, discount: off, amount: Math.max(0, ev.fee - off), label: p.type === 'percent' ? p.value + '%' : Fmt.taka(p.value), msg: T('Code applied: ' + Fmt.taka(off) + ' off.', 'কোড প্রয়োগ হয়েছে: ' + Fmt.taka(off) + ' ছাড়।') };
    },
    publicPromos(ev) { return this.promos.filter((p) => p.public && p.active !== false && (!p.expiresAt || p.expiresAt > Date.now()) && (!p.events || !p.events.length || p.events.includes(ev.id)) && (!p.maxUses || (p.uses || 0) < p.maxUses)); },
    async savePromo(p) { p.id = p.code = String(p.code).trim().toUpperCase(); p.createdAt = p.createdAt || Date.now(); await this.adapter.put('promos', clean(p)); this.emit(); },
    async deletePromo(id) { await this.adapter.del('promos', id); this.emit(); },

    /* ---- team invites ---- */
    inviteFor(reg) { return reg && reg.inviteKey ? this.invites.find((i) => i.id === reg.inviteKey) : null; },
    async fetchInvite(key) { return this.invites.find((i) => i.id === key) || await this.adapter.fetchInvite(key); },
    async joinTeam(key, d) {
      const inv = await this.fetchInvite(key);
      if (!inv) throw new Error(T('This invite link is not valid.', 'এই আমন্ত্রণ লিংকটি সঠিক নয়।'));
      const members = inv.members || [];
      if (members.length >= inv.slots) throw new Error(T('This team is already full.', 'দলটি ইতিমধ্যে পূর্ণ।'));
      const email = d.email.trim().toLowerCase();
      if (members.some((m) => m.email === email)) throw new Error(T('You have already joined this team.', 'আপনি ইতিমধ্যে এই দলে যোগ দিয়েছেন।'));
      const m = clean({ name: d.name.trim(), email, phone: d.phone.trim(), institution: d.institution.trim(), level: d.level || '', joinedAt: Date.now() });
      await this.adapter.joinInvite(key, m, members.length);
      this.track('team_join', { ev: inv.eventId, ref: inv.ticketId });
      this.emit();
      return { ...inv, members: [...members, m] };
    },
    teamOf(r) {
      const inv = this.inviteFor(r);
      const joined = inv ? inv.members || [] : [];
      return { typed: r.members || [], joined, size: 1 + (r.members || []).length + joined.length, inv };
    },

    /* ---- emails (Firebase Trigger Email extension, or the demo outbox) ---- */
    async sendMail(r, kind) {
      const E = this.settings.email || {};
      if (!E.on || !r || !r.email) return;
      if ((kind === 'confirmed' && E.onConfirm === false) || (kind === 'received' && !E.onReceive) || (kind === 'payment_rejected' && E.onPayReject === false) || (kind === 'promoted' && E.onPromote === false)) return;
      const ev = this.event(r.eventId) || {}, f = this.fest(r.festId) || {}, S = this.settings;
      const url = location.origin + location.pathname + '#/tickets/' + r.id;
      const subj = { confirmed: 'Confirmed: ' + ev.title, received: 'Registration received: ' + ev.title, payment_rejected: 'Action needed: payment for ' + ev.title, promoted: 'Good news: a seat opened for ' + ev.title }[kind];
      const lead = { confirmed: 'Your registration is confirmed by the organizers.', received: 'We received your registration. We will email you again when it is confirmed.', payment_rejected: 'We could not match your payment. ' + ((r.payment && r.payment.note) || '') + ' Open your ticket to submit the correct transaction ID.', promoted: 'A seat opened up and you have moved off the waitlist.' }[kind];
      const rows = [['Ticket', r.id], ['Event', ev.title], ['Fest', f.title], ['When', ev.startsAt ? Fmt.long(ev.startsAt) + ', ' + Fmt.time(ev.startsAt) : ''], ['Venue', ev.venue], r.teamName ? ['Team', r.teamName] : null].filter(Boolean);
      const html = '<div style="font-family:Arial,sans-serif;max-width:560px;margin:auto;color:#22160f"><div style="background:' + (S.accent || '#ff5a2c') + ';color:#1b110b;padding:14px 20px;font-weight:bold;border-radius:10px 10px 0 0">' + (S.clubName || '') + '</div><div style="border:1px solid #e3d7c6;border-top:0;padding:20px;border-radius:0 0 10px 10px"><p>Hi ' + (r.name || '').split(' ')[0] + ',</p><p>' + lead + '</p><table style="border-collapse:collapse;width:100%;margin:12px 0">' + rows.map(([k, v]) => '<tr><td style="padding:6px 0;color:#7a6455;width:90px">' + k + '</td><td style="padding:6px 0;font-weight:bold">' + String(v || '').replace(/</g, '&lt;') + '</td></tr>').join('') + '</table><p><a href="' + url + '" style="display:inline-block;background:#22160f;color:#fff;padding:10px 16px;border-radius:999px;text-decoration:none">Open your ticket</a></p><p style="color:#7a6455;font-size:13px">Bring your student ID on the day. This is an automatic message, please do not reply.</p></div></div>';
      const text = 'Hi ' + (r.name || '').split(' ')[0] + ',\n\n' + lead + '\n\n' + rows.map(([k, v]) => k + ': ' + v).join('\n') + '\n\nYour ticket: ' + url;
      const mail = clean({ id: 'm' + Date.now().toString(36) + rand(4), to: r.email, ticket: r.id, kind, createdAt: Date.now(), message: { subject: subj, html, text }, replyTo: E.replyTo || undefined, fromName: E.senderName || S.clubName });
      try { await this.adapter.queueMail(mail); } catch (e) { console.warn('mail', e); }
    },

    validatePayment(ev, p) {
      if (!ev.fee) return null;
      if (!p || !p.method) throw new Error('Choose how you paid the entry fee.');
      if (p.method === 'Cash') { if (!ev.allowCash) throw new Error('This event does not take payment at the desk.'); return { method: 'Cash', amount: p.promo && p.promo.ok ? p.promo.amount : ev.fee, status: 'due', at: Date.now() }; }
      if (p.method === 'Promo') { if (!p.promo || p.promo.amount !== 0) throw new Error('Apply a valid promo code first.'); return { method: 'Promo', amount: 0, status: 'verified', at: Date.now(), promo: p.promo.code }; }
      const amount = p.promo && p.promo.ok ? p.promo.amount : ev.fee;
      const m = this.payMethods().find((x) => x.type === p.method);
      if (!m) throw new Error(p.method + ' is not accepted for this event.');
      const trx = String(p.trxId || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!/^[A-Z0-9]{8,12}$/.test(trx)) throw new Error('Transaction IDs are 8 to 12 letters and numbers, like 9F7A2B3C4D.');
      const used = this.regs.find((r) => r.payment && r.payment.trxId === trx && r.status !== 'cancelled');
      if (used) { const e = new Error('This transaction ID was already used for another registration. Check the SMS from ' + p.method + ' and try again.'); e.code = 'trx'; throw e; }
      return { method: m.type, to: m.number, sender: String(p.sender || '').replace(/[\s-]/g, ''), trxId: trx, amount, status: 'submitted', at: Date.now() };
    },

    async register(eventId, data, opts) {
      opts = opts || {};
      const ev = this.event(eventId);
      if (!ev) throw new Error('This event no longer exists.');
      const st = this.state(ev);
      if (!opts.admin && !st.canRegister) throw new Error(st.reason || 'Registration is not open.');
      if (!opts.admin && this.settings.policy && this.settings.policy.requireAccount && !this.user) throw new Error('Sign in or create an account to register.');
      if (!opts.admin && this.user && this.user.blocked) throw new Error('This account cannot register. Contact the organizers.');
      const email = String(data.email || '').trim().toLowerCase();
      const dup = this.regs.find((r) => r.eventId === eventId && r.email === email && !['cancelled', 'rejected'].includes(r.status));
      if (dup) { const e = new Error('This email already has a ticket for this event.'); e.code = 'dup'; e.ticket = dup.id; throw e; }
      let promo = null;
      if (!opts.admin && data.promo) { promo = await this.checkPromo(ev, data.promo); if (!promo || !promo.ok) throw new Error((promo && promo.msg) || 'That promo code is not valid.'); }
      const payment = opts.admin ? (data.payment || null) : this.validatePayment(ev, promo && promo.amount === 0 ? { method: 'Promo', promo } : data.payment ? { ...data.payment, promo } : data.payment);
      const fest = this.fest(ev.festId);
      let id; do { id = randCode(fest.code || 'STB'); } while (this.reg(id));
      const now = Date.now();
      let status = st.key === 'waitlist' || (st.left <= 0 && !opts.admin) ? 'waitlisted' : (ev.autoConfirm ? 'confirmed' : 'pending');
      if (payment && payment.status === 'submitted' && status === 'confirmed') status = 'pending';
      if (opts.admin && data.status) status = data.status;
      const r = clean({
        id, eventId, festId: ev.festId, status,
        name: data.name.trim(), email, phone: (data.phone || '').trim(), institution: (data.institution || '').trim(), level: data.level || '',
        teamName: (data.teamName || '').trim(), members: (data.members || []).map((m) => m.trim()).filter(Boolean),
        answers: data.answers || {}, note: '', createdAt: now, updatedAt: now,
        accountId: !opts.admin && this.user ? this.user.id : (data.accountId || null),
        payment: payment || undefined, source: opts.admin ? 'desk' : 'web', addedBy: opts.admin ? this.admin.email : undefined,
        promo: promo ? { code: promo.code, discount: promo.discount, original: ev.fee } : undefined
      });
      const slots = ev.teamMax > 1 ? ev.teamMax - 1 - r.members.length : 0;
      let invite = null;
      if (slots > 0) { r.inviteKey = rand(10); invite = { id: r.inviteKey, ticketId: id, eventId, festId: ev.festId, teamName: r.teamName, leadName: r.name, slots, members: [], createdAt: now }; }
      if (r.status === 'checked_in') r.checkedInAt = now;
      await this.adapter.putReg(r, { invite, promo: promo && promo.code });
      this.sendMail(r, r.status === 'confirmed' ? 'confirmed' : 'received');
      if (!opts.admin) {
        this.wallet.add(id);
        this.formDraft.clear(eventId);
        await this.clearDraft(eventId);
        this.track('register', { ev: eventId, ref: id });
        if (payment && payment.trxId) this.track('payment', { ev: eventId, ref: id });
      }
      this.emit();
      return r;
    },

    async editTicket(id, patch) {
      const allowed = ['name', 'phone', 'institution', 'level', 'teamName', 'members', 'answers'];
      const p = {}; allowed.forEach((k) => { if (k in patch) p[k] = patch[k]; });
      p.updatedAt = Date.now();
      await this.adapter.updateReg(id, clean(p));
      this.emit();
    },
    async resubmitPayment(id, p) {
      const r = this.reg(id), ev = this.event(r.eventId);
      const pay = this.validatePayment(ev, p);
      await this.adapter.updateReg(id, { payment: pay, updatedAt: Date.now() });
      this.track('payment', { ev: r.eventId, ref: id });
      this.emit();
    },
    async cancelTicket(id) {
      const r = this.reg(id); if (!r) return;
      await this.adapter.updateReg(id, { status: 'cancelled', updatedAt: Date.now() });
      this.track('cancel', { ev: r.eventId, ref: id });
      await this.reconcile(r.eventId);
      this.emit();
    },

    async setStatus(ids, status) {
      const touched = new Set(), now = Date.now();
      for (const id of ids) {
        const r = this.reg(id); if (!r || r.status === status) continue;
        const p = { status, updatedAt: now };
        if (status === 'checked_in') { p.checkedInAt = now; this.track('checkin', { ev: r.eventId, ref: r.id, by: this.admin && this.admin.email }, true); }
        await this.adapter.updateReg(id, p);
        if (status === 'confirmed') this.sendMail(this.reg(id), 'confirmed');
        touched.add(r.eventId);
      }
      for (const e of touched) await this.reconcile(e);
      this.emit();
    },
    async verifyPayments(ids, ok, note) {
      const now = Date.now();
      for (const id of ids) {
        const r = this.reg(id); if (!r || !r.payment) continue;
        const ev = this.event(r.eventId);
        const pay = { ...r.payment, status: ok ? 'verified' : 'rejected', verifiedAt: now, by: this.admin.email, note: ok ? '' : (note || 'We could not match this transaction. Check the ID and submit again.') };
        const p = { payment: pay, updatedAt: now };
        if (ok && r.status === 'pending' && ev && ev.autoConfirm) p.status = 'confirmed';
        await this.adapter.updateReg(id, p);
        if (p.status === 'confirmed') this.sendMail(this.reg(id), 'confirmed');
        if (!ok) this.sendMail(this.reg(id), 'payment_rejected');
      }
      this.emit();
    },
    async saveNote(id, text) { await this.adapter.updateReg(id, { note: text, updatedAt: Date.now() }); this.emit(); },
    async deleteReg(id) { const r = this.reg(id); await this.adapter.delRegs([id]); if (r) await this.reconcile(r.eventId); this.emit(); },

    async reconcile(eventId) {
      if (this.mode === 'firebase' && !this.admin) return;
      const ev = this.event(eventId); if (!ev || Date.now() > ev.endsAt) return;
      let free = ev.capacity - this.taken(eventId);
      const queue = this.waiting(eventId), now = Date.now();
      while (free > 0 && queue.length) {
        const r = queue.shift();
        const unpaid = r.payment && r.payment.status === 'submitted';
        await this.adapter.updateReg(r.id, { status: ev.autoConfirm && !unpaid ? 'confirmed' : 'pending', promotedAt: now, updatedAt: now });
        this.sendMail(this.reg(r.id), 'promoted');
        free--;
      }
    },
    async reconcileAll() { for (const e of this.events) await this.reconcile(e.id); },

    async checkIn(id, force) {
      const r = this.reg(id);
      if (!r) return { ok: false, tone: 'bad', title: 'No ticket with this code', text: 'Check the code for typos, or ask the participant to open their ticket page.' };
      const ev = this.event(r.eventId);
      if (r.status === 'checked_in') return { ok: false, tone: 'warn', reg: r, title: 'Already checked in', text: r.name + ' came in at ' + Fmt.timeFull(r.checkedInAt) + (sameDay(r.checkedInAt, Date.now()) ? '' : ' on ' + Fmt.date(r.checkedInAt)) + '.' };
      if (['cancelled', 'rejected', 'waitlisted'].includes(r.status)) return { ok: false, tone: 'bad', reg: r, title: 'Ticket is ' + STATUS[r.status].toLowerCase(), text: 'This ticket does not give entry to ' + (ev ? ev.title : 'the event') + '.' };
      if (!force && r.payment && r.payment.status !== 'verified') {
        const due = r.payment.method === 'Cash';
        return { ok: false, tone: 'warn', reg: r, needsForce: true, payDue: due, title: due ? 'Collect ' + Fmt.taka(r.payment.amount) + ' first' : 'Payment not verified yet', text: due ? 'They chose to pay at the desk. Take the fee, then check them in. It will be marked paid.' : r.payment.method + ' TrxID ' + r.payment.trxId + ' from ' + r.payment.sender + ' has not been matched yet. Check the SMS on their phone before letting them in.' };
      }
      if (force && r.payment && r.payment.status !== 'verified') await this.verifyPayments([id], true);
      await this.setStatus([id], 'checked_in');
      const fresh = this.reg(id);
      return { ok: true, tone: r.status === 'pending' ? 'warn' : 'good', reg: fresh, title: 'Checked in', text: r.status === 'pending' ? 'This entry was still pending review. Confirm them later if that was a mistake.' : 'Welcome them in.' };
    },

    async findTicket(code, email) {
      const id = String(code || '').trim().toUpperCase();
      const r = await this.adapter.fetchTicket(id);
      if (!r || r.email !== String(email || '').trim().toLowerCase()) return null;
      this.wallet.add(id); this.emit();
      return r;
    },

    /* ---- participant accounts ---- */
    async signUp(d) {
      const email = d.email.trim().toLowerCase();
      if (this.isAdminEmail(email)) throw new Error('This email belongs to an organizer. Use Organizer sign in.');
      const acct = clean({ name: d.name.trim(), email, phone: d.phone.trim(), institution: d.institution.trim(), level: d.level || '', createdAt: Date.now(), lastSeen: Date.now(), blocked: false });
      this.user = await this.adapter.signUp(acct, d.password);
      this.track('signup');
      this.emit(); return this.user;
    },
    async signIn(email, pw) {
      this.user = await this.adapter.signIn(email.trim().toLowerCase(), pw);
      this.track('login');
      this.emit(); return this.user;
    },
    async signOut() { await this.adapter.signOutUser(); this.user = null; this.emit(); },
    async updateProfile(p) {
      const allowed = {}; ['name', 'phone', 'institution', 'level'].forEach((k) => { if (k in p) allowed[k] = p[k]; });
      await this.adapter.put('accounts', { id: this.user.id, ...allowed });
      Object.assign(this.user, allowed); this.emit();
    },
    async setBlocked(id, blocked) { await this.adapter.put('accounts', { id, blocked }); const a = this.account(id); if (a) a.blocked = blocked; this.emit(); },
    async deleteAccount(id) { await this.adapter.del('accounts', id); this.emit(); },

    /* ---- organizer content ---- */
    async saveFest(f) {
      if (!f.id) { let base = slug(f.title), id = base, i = 2; while (this.fest(id)) id = base + '-' + i++; f.id = id; f.createdAt = Date.now(); }
      if (!f.code) f.code = (f.title.match(/\b[A-Za-z]/g) || ['S']).join('').toUpperCase().slice(0, 3) + String(new Date(f.startsAt).getFullYear()).slice(2);
      await this.adapter.put('fests', clean(f));
      this.emit(); return f;
    },
    async deleteFest(id) {
      for (const e of this.eventsOf(id)) await this.deleteEvent(e.id, true);
      for (const n of this.notes.filter((n) => n.festId === id)) await this.adapter.del('notes', n.id);
      await this.adapter.del('fests', id);
      this.emit();
    },
    async saveEvent(e) {
      if (!e.id) { let base = slug(e.title), id = base, i = 2; while (this.event(id)) id = base + '-' + i++; e.id = id; e.createdAt = Date.now(); }
      await this.adapter.put('events', clean(e));
      this._index();
      await this.reconcile(e.id);
      this.emit(); return e;
    },
    /* Ticket artwork. Kept as its own call so a volunteer can change the picture on a
       ticket without the rest of the event record ever being part of the write. */
    async saveEventArt(eventId, art) {
      const e = this.event(eventId); if (!e) return null;
      // Both adapters merge on write, so removing the picture has to be written as an
      // explicit null rather than an omitted key, or the old one survives the save.
      const out = { ...e, art: art && art.src ? { src: art.src, pos: art.pos || 'center', dim: Math.max(0, Math.min(90, Number(art.dim) || 0)), stub: !!art.stub } : null };
      await this.adapter.put('events', clean(out));
      this._index(); this.emit(); return out;
    },
    async deleteEvent(id, quiet) {
      await this.adapter.delRegs(this.regsOf(id).map((r) => r.id));
      for (const n of this.notes.filter((n) => n.eventId === id)) await this.adapter.del('notes', n.id);
      await this.adapter.del('events', id);
      if (!quiet) this.emit();
    },
    async recreateFest(festId, title, shiftDays) {
      const src = this.fest(festId), shift = shiftDays * DAY;
      const f = await this.saveFest({ ...clean(src), id: null, code: null, title, createdAt: null, startsAt: src.startsAt + shift, endsAt: src.endsAt + shift, published: false });
      for (const e of this.eventsOf(festId)) {
        await this.saveEvent({ ...clean(e), id: null, festId: f.id, startsAt: e.startsAt + shift, endsAt: e.endsAt + shift, deadline: e.deadline + shift, opensAt: e.opensAt ? e.opensAt + shift : null, regOpen: true });
      }
      return f;
    },
    async postNote(n) { n.id = n.id || 'n' + Date.now().toString(36); n.createdAt = n.createdAt || Date.now(); n.by = this.admin && this.admin.email; await this.adapter.put('notes', clean(n)); this.emit(); },
    async deleteNote(id) { await this.adapter.del('notes', id); this.emit(); },
    notesFor(eventId) {
      const ev = this.event(eventId); if (!ev) return [];
      return this.notes.filter((n) => n.kind !== 'news' && (n.eventId === eventId || (!n.eventId && n.festId === ev.festId))).sort((a, b) => b.createdAt - a.createdAt);
    },
    news() { return this.notes.filter((n) => n.kind === 'news' && (!n.hideAt || n.hideAt > Date.now())).sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.createdAt - a.createdAt); },
    loc(en, bn) { return BN && bn ? bn : en; },

    /* ---- site settings ---- */
    async saveSettings(patch) {
      this.settings = { ...this.settings, ...clean(patch), id: 'site' };
      const adm = this.settings.admins || [];
      this.settings.adminEmails = adm.map((x) => x.email);
      this.settings.ownerEmails = adm.filter((x) => x.role === 'owner').map((x) => x.email);
      await this.adapter.put('settings', clean(this.settings));
      this.applyLook();
      this.emit();
    },

    /* ---- organizer team ---- */
    isAdminEmail(email) { return (this.settings.admins || []).some((a) => a.email === email) || (CFG.adminEmails || []).includes(email); },
    async addAdmin(a) {
      const email = a.email.trim().toLowerCase();
      if ((this.settings.admins || []).some((x) => x.email === email)) throw new Error('That email is already on the team.');
      if (this.accounts.some((x) => x.email === email)) throw new Error('That email already has a participant account. Use a different email for organizer access.');
      const row = { email, name: a.name.trim(), role: a.role, addedAt: Date.now(), addedBy: this.admin.email };
      if (this.mode === 'local') row.hash = await hash(a.password);
      await this.saveSettings({ admins: [...(this.settings.admins || []), row] });
    },
    async updateAdmin(email, p) {
      const list = (this.settings.admins || []).map((x) => (x.email === email ? { ...x, ...p } : x));
      if (!list.some((x) => x.role === 'owner')) throw new Error('Keep at least one owner on the team.');
      await this.saveSettings({ admins: list });
      if (this.admin && this.admin.email === email && p.role) { this.admin.role = p.role; if (this.mode === 'local') lsSet(SESSION, this.admin); }
    },
    async removeAdmin(email) {
      if (email === this.admin.email) throw new Error('You cannot remove yourself.');
      const list = (this.settings.admins || []).filter((x) => x.email !== email);
      if (!list.some((x) => x.role === 'owner')) throw new Error('Keep at least one owner on the team.');
      await this.saveSettings({ admins: list });
    },
    async changePassword(pw) {
      if (this.mode === 'local') await this.updateAdmin(this.admin.email, { hash: await hash(pw) });
      else await this.adapter.changePassword(pw);
    },

    /* ---- auth ---- */
    async login(email, pw) {
      this.admin = await this.adapter.login(email.trim().toLowerCase(), pw);
      this.emit(); return this.admin;
    },
    async logout() { await this.adapter.logout(); this.admin = null; this.emit(); },

    /* ---- backup, restore, rebuild ---- */
    exportData() {
      return { app: 'stub', version: 2, exportedAt: Date.now(), mode: this.mode, settings: clean(this.settings), fests: clean(this.fests), events: clean(this.events), regs: clean(this.regs), notes: clean(this.notes), accounts: clean(this.accounts), drafts: clean(this.drafts), activity: clean(this.activity), promos: clean(this.promos), invites: clean(this.invites), outbox: clean(this.outbox) };
    },
    async importData(d) {
      if (!d || d.app !== 'stub' || !Array.isArray(d.fests) || !Array.isArray(d.events) || !Array.isArray(d.regs)) throw new Error('This file is not a Stub backup.');
      const keep = this.settings.admins;
      const db = { fests: d.fests, events: d.events, regs: d.regs, notes: d.notes || [], accounts: d.accounts || [], drafts: d.drafts || [], activity: d.activity || [], promos: d.promos || [], invites: d.invites || [], outbox: d.outbox || [], settings: { ...(d.settings || {}), admins: (d.settings && d.settings.admins && d.settings.admins.length) ? d.settings.admins : keep } };
      await this.adapter.replaceAll(db); this.applyLook(); this.emit();
    },
    async wipe() { await this.adapter.replaceAll(window.StubSeed.blank({ admins: this.settings.admins })); this.emit(); },
    async loadDemo() {
      const d = window.StubSeed.build(); await this._hashSeed(d);
      if (this.settings.admins && this.settings.admins.length) {
        const cur = this.settings.admins;
        const curEmails = new Set(cur.map((a) => a.email));
        const extras = d.settings.admins.filter((a) => !curEmails.has(a.email));
        d.settings.admins = [...cur.map((c) => { const s = d.settings.admins.find((x) => x.email === c.email); return s && s.hash ? { ...c, hash: s.hash } : c; }), ...extras];
      }
      await this.adapter.replaceAll(d); this.applyLook(); this.emit();
    },
    async _hashSeed(d) {
      for (const a of (d.settings && d.settings.admins) || []) if (a.password) { a.hash = await hash(a.password); delete a.password; }
      for (const a of d.accounts || []) if (a.password) { a.hash = await hash(a.password); delete a.password; }
    },

    applyLook() {
      const s = this.settings || {}, root = document.documentElement;
      root.style.setProperty('--accent', s.accent || '#ff5a2c');
      if (!localStorage.getItem('stub.theme')) setTheme(s.defaultTheme && s.defaultTheme !== 'system' ? s.defaultTheme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), false);
    },

    async init() {
      this.adapter = this.mode === 'firebase' ? FirebaseAdapter : LocalAdapter;
      try { await this.adapter.init(); }
      catch (err) {
        console.error('Firebase failed to start, falling back to local demo data.', err);
        this.mode = 'local'; this.adapter = LocalAdapter; await this.adapter.init();
      }
      this._index();
      this.ready = true;
      if (this.mode === 'local') await this.reconcileAll();
      this.applyLook();
      this.emit();
    }
  };

  function setTheme(t, persist) {
    const root = document.documentElement;
    root.classList.add('theme-anim');
    root.dataset.theme = t;
    if (persist) localStorage.setItem('stub.theme', t);
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = t === 'light' ? '#f6f0e6' : '#17100c';
    setTimeout(() => root.classList.remove('theme-anim'), 400);
  }

  /* ---------------- local adapter ---------------- */
  const LocalAdapter = {
    _t: 0,
    _save(now) {
      clearTimeout(this._t);
      const run = () => {
        const ok = lsSet(KEY, { fests: Store.fests, events: Store.events, regs: Store.regs, notes: Store.notes, accounts: Store.accounts, activity: Store.activity, drafts: Store.drafts, promos: Store.promos, invites: Store.invites, outbox: Store.outbox, settings: Store.settings, seededAt: Store.seededAt });
        if (!ok && Store.activity.length > 1000) { Store.activity = Store.activity.slice(-1000); run(); }
      };
      if (now) run(); else this._t = setTimeout(run, 120);
    },
    _load(db) {
      Store.fests = db.fests || []; Store.events = db.events || []; Store.regs = db.regs || []; Store.notes = db.notes || [];
      Store.accounts = db.accounts || []; Store.activity = db.activity || []; Store.drafts = db.drafts || []; Store.settings = db.settings || {}; Store.seededAt = db.seededAt || 0;
      Store.promos = db.promos || []; Store.invites = db.invites || []; Store.outbox = db.outbox || [];
    },
    async fetchPromo(code) { return Store.promos.find((p) => p.id === code) || null; },
    async fetchInvite(key) { return Store.invites.find((i) => i.id === key) || null; },
    async joinInvite(key, m) { const inv = Store.invites.find((i) => i.id === key); inv.members = [...(inv.members || []), m]; this._save(); },
    async queueMail(m) { Store.outbox.unshift({ ...m, status: 'demo' }); if (Store.outbox.length > 300) Store.outbox.length = 300; this._save(); },
    async init() {
      let db = lsGet(KEY, null);
      if (!db || !Array.isArray(db.fests)) { db = window.StubSeed.build(); await Store._hashSeed(db); this._load(db); this._save(true); }
      else this._load(db);
      Store.admin = lsGet(SESSION, null);
      if (Store.admin) { const a = (Store.settings.admins || []).find((x) => x.email === Store.admin.email); if (!a) Store.admin = null; else Store.admin.role = a.role; }
      const u = lsGet(USER, null);
      Store.user = u ? Store.accounts.find((a) => a.id === u) || null : null;
      if (Store.user) { Store.user.lastSeen = Date.now(); this._save(); }
      window.addEventListener('beforeunload', () => this._save(true));
      window.addEventListener('storage', (e) => {
        if (e.key === KEY && e.newValue) {
          const prev = Store.activity.length;
          this._load(JSON.parse(e.newValue));
          if (Store.user) Store.user = Store.accounts.find((a) => a.id === Store.user.id) || null;
          Store.emit();
          Store.activity.slice(prev).forEach((a) => Store.emitActivity(a));
        }
        if (e.key === SESSION) { Store.admin = lsGet(SESSION, null); Store.emit(); }
        if (e.key === USER) { const id = lsGet(USER, null); Store.user = id ? Store.accounts.find((a) => a.id === id) || null : null; Store.emit(); }
      });
    },
    async put(col, obj) {
      if (col === 'settings') { Store.settings = obj; this._save(); return; }
      const a = Store[col], i = a.findIndex((x) => x.id === obj.id);
      if (i >= 0) a[i] = { ...a[i], ...obj }; else a.push(obj);
      if (col === 'accounts' && Store.user && Store.user.id === obj.id) Store.user = a[i >= 0 ? i : a.length - 1];
      this._save();
    },
    async del(col, id) { Store[col] = Store[col].filter((x) => x.id !== id); this._save(); },
    async putReg(r, extra) {
      Store.regs.push(r);
      if (extra && extra.invite) Store.invites.push(extra.invite);
      if (extra && extra.promo) { const p = Store.promos.find((x) => x.id === extra.promo); if (p) p.uses = (p.uses || 0) + 1; }
      Store._index(); this._save();
    },
    async updateReg(id, p) { const r = Store.regs.find((x) => x.id === id); if (r) Object.assign(r, p); this._save(); },
    async delRegs(ids) { const s = new Set(ids); Store.regs = Store.regs.filter((r) => !s.has(r.id)); Store.invites = Store.invites.filter((i) => !s.has(i.ticketId)); Store._index(); this._save(); },
    async fetchTicket(id) { return Store.regs.find((r) => r.id === id) || null; },
    logActivity(a) { Store.activity.push(a); if (Store.activity.length > ACT_CAP) Store.activity.splice(0, Store.activity.length - ACT_CAP); this._save(); },
    async login(email, pw) {
      const a = (Store.settings.admins || []).find((x) => x.email === email);
      if (!a || a.hash !== await hash(pw)) throw new Error('That email and password do not match an organizer account.');
      const s = { email: a.email, name: a.name, role: a.role };
      lsSet(SESSION, s); return s;
    },
    async logout() { localStorage.removeItem(SESSION); },
    async changePassword() { /* local passwords are stored on the team list */ },
    async signUp(acct, pw) {
      if (Store.accounts.some((a) => a.email === acct.email)) throw new Error('An account with this email already exists. Sign in instead.');
      const a = { ...acct, id: 'u_' + rand(8), hash: await hash(pw) };
      Store.accounts.push(a); Store._index();
      Store.regs.forEach((r) => { if (!r.accountId && r.email === a.email && Store.wallet.ids().includes(r.id)) r.accountId = a.id; });
      lsSet(USER, a.id); this._save(); return a;
    },
    async signIn(email, pw) {
      const a = Store.accounts.find((x) => x.email === email);
      if (!a || a.hash !== await hash(pw)) throw new Error('That email and password do not match. Check for typos or create an account.');
      if (a.blocked) throw new Error('This account has been blocked by the organizers.');
      a.lastSeen = Date.now(); lsSet(USER, a.id); this._save(); return a;
    },
    async signOutUser() { localStorage.removeItem(USER); },
    async replaceAll(db) { await Store._hashSeed(db); this._load(db); Store._index(); this._save(true); }
  };

  /* ---------------- firebase adapter ---------------- */
  // settings/site, stats/site, fests, events, notes (public) | regs (public seat counts) | tickets (full, doc id = code)
  // trx (one doc per used transaction ID) | accounts (doc id = auth uid) | activity | drafts. See firestore.rules.
  const FirebaseAdapter = {
    _pub: new Map(), _full: new Map(), _unsubs: [],
    _compose() {
      const ids = new Set([...this._pub.keys(), ...this._full.keys()]);
      Store.regs = [...ids].map((id) => ({ ...(this._full.get(id) || {}), ...(this._pub.get(id) || {}), id }));
    },
    async init() {
      const v = CFG.firebaseVersion || '10.12.5', base = 'https://www.gstatic.com/firebasejs/' + v + '/';
      const [appMod, fs, au] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js'), import(base + 'firebase-auth.js')]);
      this.fs = fs; this.au = au;
      const app = appMod.initializeApp(CFG.firebase);
      this.db = fs.getFirestore(app); this.auth = au.getAuth(app);
      const col = (n) => fs.collection(this.db, n);
      const docs = (snap) => snap.docs.map((d) => ({ ...d.data(), id: d.id }));

      await new Promise((resolve, reject) => {
        let pending = 6;
        const settle = () => { if (--pending === 0) resolve(); };
        const watch = (name, apply, ref) => {
          let first = true;
          fs.onSnapshot(ref || col(name), (snap) => {
            apply(snap);
            if (first) { first = false; settle(); } else Store.emit();
          }, (err) => { console.error(name, err); if (first) { first = false; name === 'fests' ? reject(err) : settle(); } });
        };
        watch('fests', (s) => { Store.fests = docs(s); });
        watch('events', (s) => { Store.events = docs(s); });
        watch('notes', (s) => { Store.notes = docs(s); });
        watch('regs', (s) => { this._pub = new Map(docs(s).map((d) => [d.id, d])); this._compose(); });
        watch('settings', (s) => {
          Store.settings = s.exists() ? { ...s.data(), id: 'site' } : window.StubSeed.blank({ admins: (CFG.adminEmails || []).map((e) => ({ email: e, name: e.split('@')[0], role: 'owner' })) }).settings;
          if (Store.ready) Store.applyLook();
        }, fs.doc(this.db, 'settings', 'site'));
        watch('stats', (s) => { Store._visits = s.exists() ? (s.data().visits || 0) : 0; }, fs.doc(this.db, 'stats', 'site'));
      });

      await Promise.all(Store.wallet.ids().map((id) => this.fetchTicket(id).catch(() => null)));
      this._compose();
      await Promise.all([...this._full.values()].filter((r) => r.inviteKey).map((r) => this.fetchInvite(r.inviteKey)));

      await new Promise((resolve) => {
        let first = true;
        au.onAuthStateChanged(this.auth, async (user) => {
          const wasPrivileged = this._unsubs.length > 0 || Store.admin || Store.user;
          this._unsubs.forEach((u) => u()); this._unsubs = [];
          if (wasPrivileged) {
            // drop data the previous session could see; keep only this browser's own tickets
            const mine = new Set(Store.wallet.ids());
            this._full = new Map([...this._full].filter(([id]) => mine.has(id)));
            Store.accounts = []; Store.drafts = []; Store.activity = []; Store.promos = []; Store.outbox = [];
            Store.invites = Store.invites.filter((i) => mine.has(i.ticketId));
            this._compose(); Store._index();
          }
          Store.admin = null; Store.user = null;
          if (user) {
            const email = (user.email || '').toLowerCase();
            const row = (Store.settings.admins || []).find((a) => a.email === email);
            if (row || (CFG.adminEmails || []).map((e) => e.toLowerCase()).includes(email)) {
              Store.admin = { email, name: (row && row.name) || user.displayName || email.split('@')[0], role: (row && row.role) || 'owner' };
              this._watchAdmin();
            } else {
              const snap = await fs.getDoc(fs.doc(this.db, 'accounts', user.uid)).catch(() => null);
              Store.user = snap && snap.exists() ? { ...snap.data(), id: user.uid } : { id: user.uid, email, name: email.split('@')[0] };
              fs.setDoc(fs.doc(this.db, 'accounts', user.uid), { lastSeen: Date.now() }, { merge: true }).catch(() => {});
              this._unsubs.push(fs.onSnapshot(fs.query(col('tickets'), fs.where('accountId', '==', user.uid)), (s) => {
                s.docs.forEach((d) => this._full.set(d.id, { ...d.data(), id: d.id }));
                this._compose(); Store.emit();
              }, (e) => console.warn('my tickets', e)));
            }
          }
          if (first) { first = false; resolve(); } else Store.emit();
        });
      });

      if (!sessionStorage.getItem('stub.counted')) {
        sessionStorage.setItem('stub.counted', '1');
        fs.setDoc(fs.doc(this.db, 'stats', 'site'), { visits: fs.increment(1) }, { merge: true }).catch(() => {});
      }
    },
    _watchAdmin() {
      const fs = this.fs, col = (n) => fs.collection(this.db, n);
      const docs = (snap) => snap.docs.map((d) => ({ ...d.data(), id: d.id }));
      this._unsubs.push(fs.onSnapshot(col('tickets'), (snap) => {
        this._full = new Map(docs(snap).map((d) => [d.id, d]));
        this._compose(); Store._index(); Store.reconcileAll().then(() => Store.emit());
      }, (e) => console.error('tickets', e)));
      this._unsubs.push(fs.onSnapshot(col('accounts'), (s) => { Store.accounts = docs(s); Store.emit(); }, (e) => console.error('accounts', e)));
      this._unsubs.push(fs.onSnapshot(col('drafts'), (s) => { Store.drafts = docs(s); Store.emit(); }, (e) => console.error('drafts', e)));
      this._unsubs.push(fs.onSnapshot(col('promos'), (s) => { Store.promos = docs(s); Store.emit(); }, (e) => console.error('promos', e)));
      this._unsubs.push(fs.onSnapshot(col('invites'), (s) => { Store.invites = docs(s); Store.emit(); }, (e) => console.error('invites', e)));
      this._unsubs.push(fs.onSnapshot(col('mail'), (s) => { Store.outbox = docs(s).map((m) => ({ ...m, status: (m.delivery && m.delivery.state) || 'queued' })).sort((a, b) => b.createdAt - a.createdAt); Store.emit(); }, (e) => console.error('mail', e)));
      let first = true;
      this._unsubs.push(fs.onSnapshot(fs.query(col('activity'), fs.where('t', '>=', Date.now() - 15 * DAY)), (s) => {
        const before = new Set(Store.activity.map((a) => a.id));
        Store.activity = docs(s).sort((a, b) => a.t - b.t);
        if (!first) Store.activity.filter((a) => !before.has(a.id)).forEach((a) => Store.emitActivity(a));
        first = false; Store.emit();
      }, (e) => console.error('activity', e)));
    },
    async put(colName, obj) {
      const { id, ...rest } = obj;
      if (colName === 'settings') (rest.admins || []).forEach((a) => { delete a.hash; delete a.password; });
      await this.fs.setDoc(this.fs.doc(this.db, colName, id), rest, { merge: colName !== 'settings' });
      if (colName === 'settings') Store.settings = obj;
    },
    async del(colName, id) { await this.fs.deleteDoc(this.fs.doc(this.db, colName, id)); },
    _pubOf(r) { return { eventId: r.eventId, festId: r.festId, status: r.status, createdAt: r.createdAt, updatedAt: r.updatedAt }; },
    async fetchPromo(code) { const s = await this.fs.getDoc(this.fs.doc(this.db, 'promos', code)).catch(() => null); return s && s.exists() ? { ...s.data(), id: code } : null; },
    async fetchInvite(key) { const s = await this.fs.getDoc(this.fs.doc(this.db, 'invites', key)).catch(() => null); if (!s || !s.exists()) return null; const inv = { ...s.data(), id: key }; if (!Store.invites.some((i) => i.id === key)) Store.invites.push(inv); return inv; },
    async joinInvite(key, m, count) {
      const ref = this.fs.doc(this.db, 'invites', key);
      const snap = await this.fs.getDoc(ref); const cur = snap.data().members || [];
      if (cur.length !== count) throw new Error('Someone joined at the same time. Try again.');
      await this.fs.updateDoc(ref, { members: [...cur, m], updatedAt: Date.now() });
      const inv = Store.invites.find((i) => i.id === key); if (inv) inv.members = [...cur, m];
    },
    async queueMail(m) { const { id, ...rest } = m; await this.fs.setDoc(this.fs.doc(this.db, 'mail', id), rest); },
    async putReg(r, extra) {
      const b = this.fs.writeBatch(this.db);
      const { id, ...rest } = r;
      b.set(this.fs.doc(this.db, 'regs', id), this._pubOf(r));
      b.set(this.fs.doc(this.db, 'tickets', id), rest);
      if (extra && extra.invite) { const { id: k, ...inv } = extra.invite; b.set(this.fs.doc(this.db, 'invites', k), inv); if (!Store.invites.some((i) => i.id === k)) Store.invites.push(extra.invite); }
      if (extra && extra.promo) b.update(this.fs.doc(this.db, 'promos', extra.promo), { uses: this.fs.increment(1) });
      if (r.payment && r.payment.trxId) b.set(this.fs.doc(this.db, 'trx', r.payment.trxId), { ref: id, at: Date.now() });
      try { await b.commit(); }
      catch (e) {
        if (r.payment && r.payment.trxId && /permission/i.test(String(e.message || e.code || ''))) { const err = new Error('This transaction ID was already used for another registration.'); err.code = 'trx'; throw err; }
        throw e;
      }
      this._full.set(id, r); this._pub.set(id, { ...this._pubOf(r), id }); this._compose(); Store._index();
    },
    async updateReg(id, p) {
      const b = this.fs.writeBatch(this.db);
      b.update(this.fs.doc(this.db, 'tickets', id), p);
      if ('status' in p) b.update(this.fs.doc(this.db, 'regs', id), { status: p.status, updatedAt: p.updatedAt });
      if (p.payment && p.payment.trxId && p.payment.status === 'submitted') b.set(this.fs.doc(this.db, 'trx', p.payment.trxId), { ref: id, at: Date.now() });
      await b.commit();
      if (this._full.has(id)) this._full.set(id, { ...this._full.get(id), ...p });
      if ('status' in p && this._pub.has(id)) this._pub.set(id, { ...this._pub.get(id), status: p.status, updatedAt: p.updatedAt });
      this._compose(); Store._index();
    },
    async delRegs(ids) {
      for (let i = 0; i < ids.length; i += 200) {
        const b = this.fs.writeBatch(this.db);
        ids.slice(i, i + 200).forEach((id) => { b.delete(this.fs.doc(this.db, 'regs', id)); b.delete(this.fs.doc(this.db, 'tickets', id)); });
        await b.commit();
      }
      ids.forEach((id) => { this._full.delete(id); this._pub.delete(id); }); this._compose(); Store._index();
    },
    async fetchTicket(id) {
      if (!id) return null;
      const snap = await this.fs.getDoc(this.fs.doc(this.db, 'tickets', id));
      if (!snap.exists()) return null;
      const r = { ...snap.data(), id };
      this._full.set(id, r); this._compose(); Store._index();
      return r;
    },
    logActivity(a) { this.fs.addDoc(this.fs.collection(this.db, 'activity'), a).catch((e) => console.warn('activity', e)); },
    async login(email, pw) {
      if (!Store.isAdminEmail(email)) throw new Error('This email is not on the organizer team.');
      const row = (Store.settings.admins || []).find((a) => a.email === email);
      if (row && row.hash) {
        if (row.hash !== await hash(pw)) throw new Error('That email and password do not match an organizer account.');
        return { email, name: row.name || email.split('@')[0], role: row.role || 'owner' };
      }
      try {
        const cred = await this.au.signInWithEmailAndPassword(this.auth, email, pw);
        return { email, name: (row && row.name) || cred.user.displayName || email.split('@')[0], role: (row && row.role) || 'owner' };
      } catch (e) { throw new Error('That email and password do not match an organizer account.'); }
    },
    async logout() { await this.au.signOut(this.auth); },
    async changePassword(pw) { await this.au.updatePassword(this.auth.currentUser, pw); },
    async signUp(acct, pw) {
      let cred;
      try { cred = await this.au.createUserWithEmailAndPassword(this.auth, acct.email, pw); }
      catch (e) { throw new Error(/email-already/.test(e.code || '') ? 'An account with this email already exists. Sign in instead.' : 'Could not create the account. ' + (e.message || '')); }
      const a = { ...acct, id: cred.user.uid };
      const { id, ...rest } = a;
      await this.fs.setDoc(this.fs.doc(this.db, 'accounts', id), rest);
      return a;
    },
    async signIn(email, pw) {
      let cred;
      try { cred = await this.au.signInWithEmailAndPassword(this.auth, email, pw); }
      catch (e) { throw new Error('That email and password do not match. Check for typos or create an account.'); }
      const snap = await this.fs.getDoc(this.fs.doc(this.db, 'accounts', cred.user.uid));
      const a = snap.exists() ? { ...snap.data(), id: cred.user.uid } : { id: cred.user.uid, email };
      if (a.blocked) { await this.au.signOut(this.auth); throw new Error('This account has been blocked by the organizers.'); }
      return a;
    },
    async signOutUser() { await this.au.signOut(this.auth); },
    async replaceAll(db) {
      const ops = [];
      Store.regs.forEach((r) => { ops.push(['del', 'regs', r.id]); ops.push(['del', 'tickets', r.id]); if (r.payment && r.payment.trxId) ops.push(['del', 'trx', r.payment.trxId]); });
      ['events', 'fests', 'notes', 'accounts', 'drafts', 'activity', 'promos', 'invites'].forEach((c) => Store[c].forEach((x) => ops.push(['del', c, x.id])));
      (db.promos || []).forEach((p) => ops.push(['set', 'promos', p]));
      (db.invites || []).forEach((i) => ops.push(['set', 'invites', i]));
      db.fests.forEach((f) => ops.push(['set', 'fests', f]));
      db.events.forEach((e) => ops.push(['set', 'events', e]));
      (db.notes || []).forEach((n) => ops.push(['set', 'notes', n]));
      (db.drafts || []).forEach((d) => ops.push(['set', 'drafts', d]));
      (db.activity || []).forEach((a, i) => ops.push(['set', 'activity', { ...a, id: a.id || 'a' + a.t.toString(36) + i }]));
      (db.accounts || []).forEach((a) => { const { hash: _h, password: _p, ...rest } = a; ops.push(['set', 'accounts', rest]); });
      db.regs.forEach((r) => {
        ops.push(['set', 'regs', { ...this._pubOf(r), id: r.id }]); ops.push(['set', 'tickets', r]);
        if (r.payment && r.payment.trxId) ops.push(['set', 'trx', { id: r.payment.trxId, ref: r.id, at: r.createdAt }]);
      });
      const s = clean(db.settings); (s.admins || []).forEach((a) => { delete a.password; });
      s.adminEmails = (s.admins || []).map((a) => a.email); s.ownerEmails = (s.admins || []).filter((a) => a.role === 'owner').map((a) => a.email);
      s.id = 'site';
      ops.push(['set', 'settings', s]);
      for (let i = 0; i < ops.length; i += 400) {
        const b = this.fs.writeBatch(this.db);
        ops.slice(i, i + 400).forEach(([op, c, x]) => {
          if (op === 'del') b.delete(this.fs.doc(this.db, c, x));
          else { const { id, ...rest } = clean(x); b.set(this.fs.doc(this.db, c, id), rest); }
        });
        await b.commit();
      }
    }
  };

  window.Store = Store;
  window.Fmt = Fmt;
  window.STATUS = STATUS; window.PAY = PAY; window.PAY_COLORS = PAY_COLORS; window.ROLES = ROLES;
  window.SEAT = SEAT;
  window.setTheme = setTheme;
})();

  /* ======================= HOME / DIRECTORY ======================= */
  const filt = { q: '', cat: 'All', fest: '', avail: 'upcoming', sort: 'date' };

  function filteredEvents() {
    const q = filt.q.trim().toLowerCase();
    let list = Store.events.filter((e) => { const f = Store.fest(e.festId); return f && f.published !== false; });
    if (filt.cat !== 'All') list = list.filter((e) => e.category === filt.cat);
    if (filt.fest) list = list.filter((e) => e.festId === filt.fest);
    if (q) list = list.filter((e) => {
      const f = Store.fest(e.festId);
      return [e.title, e.category, e.summary, e.venue, f.title].join(' ').toLowerCase().includes(q);
    });
    list = list.filter((e) => {
      const k = Store.state(e).key;
      switch (filt.avail) {
        case 'upcoming': return k !== 'ended';
        case 'open': return ['open', 'closing', 'waitlist'].includes(k);
        case 'closing': return k === 'closing';
        case 'full': return k === 'full' || k === 'waitlist';
        case 'closed': return ['closed', 'paused', 'soon', 'ended'].includes(k);
        default: return true;
      }
    });
    const by = {
      date: (a, b) => a.startsAt - b.startsAt,
      deadline: (a, b) => (Store.state(b).canRegister - Store.state(a).canRegister) || a.deadline - b.deadline,
      seats: (a, b) => Store.state(b).left - Store.state(a).left
    }[filt.sort];
    return list.sort((a, b) => (Store.state(a).key === 'ended') - (Store.state(b).key === 'ended') || by(a, b));
  }

  function resultsHtml() {
    const all = Store.events.length, list = filteredEvents();
    if (!list.length) {
      return '<div class="empty"><h3 class="h3">Nothing matches that.</h3><p>Try a shorter search, or include closed and past events.</p><button class="btn btn-line btn-sm" data-clear>Clear search and filters</button></div>';
    }
    return '<p class="result-line">' + T('Showing ' + list.length + ' of ' + all + ' events', all + 'টি ইভেন্টের মধ্যে ' + list.length + 'টি দেখানো হচ্ছে') + '</p><div class="grid-tix">' + list.map(ticketCard).join('') + '</div>';
  }

  function home() {
    const fests = Store.festsSorted();
    const openEvents = Store.events.filter((e) => Store.state(e).canRegister);
    const soonest = [...openEvents].sort((a, b) => a.deadline - b.deadline).slice(0, 3);
    const people = Store.regs.filter((r) => !['cancelled', 'rejected'].includes(r.status)).length;
    const upcomingFests = fests.filter((f) => Store.festState(f).key !== 'past').length;
    const cats = ['All', ...new Set(Store.events.map((e) => e.category))];
    const catCount = (c) => Store.events.filter((e) => (c === 'All' || e.category === c) && Store.state(e).key !== 'ended').length;

    const festRow = (f) => {
      const st = Store.festState(f), evs = Store.eventsOf(f.id);
      return '<a class="fest-row' + (st.key === 'past' ? ' past' : '') + '" href="#/fests/' + f.id + '" style="--ink:var(--' + f.ink + ')">' +
        '<div><h3 class="fest-name">' + esc(f.title) + '</h3><p class="fest-tag">' + esc(f.tagline) + '</p>' +
        '<span class="state ' + (st.key === 'live' ? 'st-open' : st.key === 'past' ? 'st-ended' : st.open ? 'st-open' : 'st-soon') + '">' + esc(st.label) + '</span></div>' +
        '<div class="fest-when"><b>' + esc(Fmt.range(f.startsAt, f.endsAt)) + '</b>' + esc(f.venue.split(',')[0]) + '</div>' +
        '<div class="fest-count"><b>' + evs.length + '</b><span>' + T(evs.length === 1 ? 'event' : 'events', 'ইভেন্ট') + '</span></div></a>';
    };

    const S = Store.settings || {}, sec = S.sections || {};
    const html =
      '<section class="hero"><div class="wrap hero-grid">' +
        '<div>' + nextFestChip() + '<h1 class="h1">' + esc(Store.loc(S.heroTitle || 'Pick an event, get a ticket, show it at the gate.', S.heroTitleBn)) + '</h1>' +
        '<p class="lede">' + esc(Store.loc(S.heroText || '', S.heroTextBn)) + '</p>' +
        '<label class="searchbar">' + icon.search + '<span class="sr">Search events</span><input id="hero-q" type="search" placeholder="Search for robotics, quiz, hackathon…" value="' + esc(filt.q) + '" autocomplete="off"></label>' +
        '<div class="hero-meta"><span><b>' + upcomingFests + '</b> fests coming up</span><span><b>' + openEvents.length + '</b> events taking registrations</span>' +
        '<span><b>' + people.toLocaleString('en-IN') + '</b> registrations so far</span>' + (sec.visits !== false ? '<span><b>' + Store.visitCount().toLocaleString('en-IN') + '</b> visits</span>' : '') + '</div></div>' +
        '<div class="fan" aria-label="Events closing soonest">' + soonest.map(ticketCard).join('') + (soonest.length ? '<span class="fan-cap">Closing soonest</span>' : '') + '</div>' +
      '</div></section>' +

      newsSection() +
      '<section class="sec" id="fests"><div class="wrap">' +
        '<div class="sec-head"><div><h2 class="h2">Fests</h2><p class="muted">Open a fest to see its programme, day by day.</p></div></div>' +
        '<div class="fests">' + fests.map(festRow).join('') + '</div>' +
      '</div></section>' +

      '<section class="sec" id="events"><div class="wrap">' +
        '<div class="sec-head"><div><h2 class="h2">All events</h2><p class="muted">Every event across every fest. Filter by what you are into.</p></div></div>' +
        '<div class="filters">' +
          '<div class="chips" role="group" aria-label="Category">' + cats.map((c) => '<button class="chip" data-cat="' + esc(c) + '" aria-pressed="' + (filt.cat === c) + '">' + esc(c) + '<span class="n">' + catCount(c) + '</span></button>').join('') + '</div>' +
          '<span class="spacer"></span>' +
          '<label class="sr" for="f-fest">Fest</label><select class="select" id="f-fest"><option value="">All fests</option>' + fests.map((f) => '<option value="' + f.id + '"' + (filt.fest === f.id ? ' selected' : '') + '>' + esc(f.title) + '</option>').join('') + '</select>' +
          '<label class="sr" for="f-avail">Availability</label><select class="select" id="f-avail">' +
            [['upcoming', 'Upcoming events'], ['open', 'Taking registrations'], ['closing', 'Closing in 48 hours'], ['full', 'Full or waitlist'], ['closed', 'Not taking registrations'], ['all', 'Everything, including past']]
              .map(([v, l]) => '<option value="' + v + '"' + (filt.avail === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
          '<label class="sr" for="f-sort">Sort</label><select class="select" id="f-sort">' +
            [['date', 'By event date'], ['deadline', 'By deadline'], ['seats', 'Most seats left']].map(([v, l]) => '<option value="' + v + '"' + (filt.sort === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>' +
        '</div>' +
        '<div id="results">' + resultsHtml() + '</div>' +
      '</div></section>' + extras(S, sec);

    return {
      title: 'Events',
      html,
      mount(root) {
        startClocks(root);
        const results = $('#results', root);
        const update = () => { results.innerHTML = resultsHtml(); };
        const q = $('#hero-q', root);
        q.addEventListener('input', () => { filt.q = q.value; update(); });
        q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#events').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } });
        root.addEventListener('click', (e) => {
          const chip = e.target.closest('[data-cat]');
          if (chip) { filt.cat = chip.dataset.cat; $$('[data-cat]', root).forEach((c) => c.setAttribute('aria-pressed', c === chip)); update(); }
          if (e.target.closest('[data-clear]')) {
            Object.assign(filt, { q: '', cat: 'All', fest: '', avail: 'all' });
            q.value = ''; $('#f-fest', root).value = ''; $('#f-avail', root).value = 'all';
            $$('[data-cat]', root).forEach((c) => c.setAttribute('aria-pressed', c.dataset.cat === 'All')); update();
          }
        });
        $('#f-fest', root).addEventListener('change', (e) => { filt.fest = e.target.value; update(); });
        $('#f-avail', root).addEventListener('change', (e) => { filt.avail = e.target.value; update(); });
        $('#f-sort', root).addEventListener('change', (e) => { filt.sort = e.target.value; update(); });
      }
    };
  }

  function nextFestChip() {
    const S = Store.settings || {};
    if ((S.sections || {}).countdown === false) return '';
    const f = Store.fests.filter((x) => x.published !== false && x.startsAt > Date.now()).sort((a, b) => a.startsAt - b.startsAt)[0];
    if (!f) return '';
    return '<a class="next-fest" href="#/fests/' + f.id + '" style="--ink:var(--' + f.ink + ')"><span><b>' + esc(f.title) + '</b> starts in</span><span class="clock" data-clock="' + f.startsAt + '"><span>0d</span><span>0h</span><span>0m</span></span></a>';
  }
  function startClocks(root) {
    const els = $$('[data-clock]', root); if (!els.length) return;
    const tick = () => els.forEach((el) => {
      if (!el.isConnected) return;
      const d = Math.max(0, Number(el.dataset.clock) - Date.now());
      const s = el.querySelectorAll('span');
      s[0].textContent = Math.floor(d / 864e5) + T('d', ' দিন'); s[1].textContent = (Math.floor(d / 36e5) % 24) + T('h', ' ঘণ্টা'); s[2].textContent = (Math.floor(d / 6e4) % 60) + T('m', ' মি.');
    });
    tick(); const iv = setInterval(() => { if (!els[0].isConnected) clearInterval(iv); else tick(); }, 15000);
  }
  function newsSection() {
    const list = Store.news().slice(0, 4);
    if (!list.length) return '';
    return '<section class="sec" id="news"><div class="wrap"><div class="sec-head"><div><h2 class="h2">' + T('Latest news', 'সর্বশেষ খবর') + '</h2><p class="muted">' + T('Updates from the organizers.', 'আয়োজকদের পক্ষ থেকে হালনাগাদ।') + '</p></div></div><div class="news-grid">' +
      list.map((n, i) => '<article class="news-card' + (i === 0 && n.pinned ? ' lead' : '') + '"><div class="news-meta">' + (n.pinned ? '<span class="pill p-pending">' + T('Pinned', 'পিন করা') + '</span>' : '') + '<time>' + Fmt.ago(n.createdAt) + '</time></div>' +
        '<h3 class="h3">' + esc(Store.loc(n.title, n.titleBn)) + '</h3><p>' + esc(Store.loc(n.text, n.textBn)) + '</p>' + (n.link ? '<a class="small" href="' + esc(n.link) + '">' + T('Read more', 'আরও দেখুন') + '</a>' : '') + '</article>').join('') + '</div></div></section>';
  }
  function extras(S, sec) {
    let out = '';
    if (sec.leaderboard !== false) {
      const active = Store.regs.filter((r) => !['cancelled', 'rejected'].includes(r.status) && r.institution);
      const live = Store.events.filter((e) => e.endsAt > Date.now()).map((e) => e.id);
      const cur = active.filter((r) => live.includes(r.eventId));
      const inst = {}; cur.forEach((r) => { inst[r.institution] = (inst[r.institution] || 0) + 1; });
      const top = Object.entries(inst).sort((a, b) => b[1] - a[1]).slice(0, 6), max = top.length ? top[0][1] : 1;
      const evs = Store.events.filter((e) => live.includes(e.id) && Store.state(e).canRegister).map((e) => [e, Store.regsOf(e.id).filter((r) => Date.now() - r.createdAt < 3 * 864e5).length]).sort((a, b) => b[1] - a[1]).slice(0, 6);
      const emax = evs.length ? Math.max(1, evs[0][1]) : 1;
      if (top.length) out += '<section class="sec"><div class="wrap"><div class="sec-head"><div><h2 class="h2">Who is coming</h2><p class="muted">Schools sending the most people, and what everyone is signing up for this week.</p></div></div>' +
        '<div class="board"><div class="panel"><div class="panel-head"><h3>Schools with the most registrations</h3><span>Current fests</span></div><div class="rank">' +
        top.map(([n, c], i) => '<div class="rank-row"><span class="pos">' + (i + 1) + '</span><span class="nm">' + esc(n) + '</span><span class="ct">' + c + '</span><span class="bar"><i style="--v:' + (c / max) * 100 + '%"></i></span></div>').join('') + '</div></div>' +
        '<div class="panel"><div class="panel-head"><h3>Trending events</h3><span>Sign-ups in the last 3 days</span></div><div class="rank">' +
        evs.map(([e, c], i) => '<a class="rank-row" href="#/events/' + e.id + '" style="text-decoration:none;--accent:' + Store.inkOf(e.festId) + '"><span class="pos">' + (i + 1) + '</span><span class="nm">' + esc(e.title) + '</span><span class="ct">' + c + '</span><span class="bar"><i style="--v:' + (c / emax) * 100 + '%"></i></span></a>').join('') + '</div></div></div></div></section>';
    }
    if (sec.sponsors !== false && (S.sponsors || []).length) out += '<section class="sec"><div class="wrap"><div class="sec-head"><div><h2 class="h2">Our partners</h2><p class="muted">The people who make the prizes possible.</p></div></div><div class="sponsors">' +
      S.sponsors.map((s) => '<div class="sponsor"><b>' + esc(s.name || s[0]) + '</b><span>' + esc(s.role || s[1]) + '</span></div>').join('') + '</div></div></section>';
    if (sec.faq !== false && (S.faq || []).length) out += '<section class="sec" id="faq"><div class="wrap"><div style="max-width:820px"><div class="sec-head"><div><h2 class="h2">Questions people ask</h2></div></div><div class="faq">' +
      S.faq.map((f) => '<details><summary>' + esc(Store.loc(f.q || f[0], f.qb || f[2])) + '</summary><p>' + esc(Store.loc(f.a || f[1], f.ab || f[3])) + '</p></details>').join('') + '</div></div></div></section>';
    return out;
  }

  /* ======================= FEST ======================= */
  function fest(id) {
    const f = Store.fest(id);
    if (!f) return notFound('That fest does not exist, or it was removed by the organizers.');
    const st = Store.festState(f), evs = Store.eventsOf(f.id);
    const days = new Map();
    evs.forEach((e) => { const k = new Date(e.startsAt).toDateString(); if (!days.has(k)) days.set(k, []); days.get(k).push(e); });
    const open = evs.filter((e) => Store.state(e).canRegister).length;
    const regCount = evs.reduce((n, e) => n + Store.taken(e.id), 0);
    const fNotes = Store.notes.filter((n) => n.festId === f.id && !n.eventId).sort((a, b) => b.createdAt - a.createdAt);

    const html =
      '<section class="fest-hero" style="--ink:var(--' + f.ink + ')"><div class="wrap">' +
        '<nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Events</a><span aria-hidden="true">/</span><span>' + esc(f.title) + '</span></nav>' +
        '<div class="fest-hero-grid"><div><span class="ink-bar" aria-hidden="true"></span><h1 class="h1">' + esc(f.title) + '</h1>' +
          '<p class="lede" style="margin-top:18px">' + esc(f.tagline) + '</p></div>' +
          '<dl class="facts">' +
            '<div><dt>When</dt><dd>' + esc(Fmt.range(f.startsAt, f.endsAt)) + '</dd></div>' +
            '<div><dt>Where</dt><dd>' + esc(f.venue) + '</dd></div>' +
            '<div><dt>Events</dt><dd>' + T(evs.length + ' events, ' + (open ? open + ' taking registrations' : 'none taking registrations right now'), evs.length + 'টি ইভেন্ট, ' + (open ? open + 'টিতে নিবন্ধন চলছে' : 'এখন কোনোটিতে নিবন্ধন চলছে না')) + '</dd></div>' +
            '<div><dt>Registered</dt><dd class="num">' + T(regCount + ' seats taken', regCount + 'টি আসন পূর্ণ') + '</dd></div>' +
            '<div><dt>Questions</dt><dd><a href="mailto:' + esc(f.contact) + '">' + esc(f.contact) + '</a></dd></div>' +
          '</dl></div>' +
      '</div></section>' +
      '<section class="wrap"><div class="programme">' +
        '<div class="prose" style="padding:30px 0 6px">' + paras(f.description) + '</div>' +
        fNotes.map((n) => '<div class="notice" style="--ink:var(--' + f.ink + ')"><p>' + esc(n.text) + '</p><time>' + T('Posted ', 'প্রকাশ: ') + Fmt.ago(n.createdAt) + '</time></div>').join('') +
        (st.key === 'past' ? '<p class="muted" style="margin-top:16px">This fest is over. Its events stay listed here for the record.</p>' : '') +
        [...days.entries()].map(([k, list]) =>
          '<div class="day-block"><div class="day-label"><h2 class="h3">' + esc(Fmt.long(list[0].startsAt).split(' ')[0].replace(',', '')) + '</h2><p class="muted">' + esc(Fmt.date(list[0].startsAt)) + '</p></div>' +
          '<div class="day-list">' + list.map(ticketCard).join('') + '</div></div>').join('') +
        (!evs.length ? '<div class="empty" style="margin-top:30px"><h3 class="h3">No events yet.</h3><p>The programme for this fest has not been published.</p></div>' : '') +
      '</div></section>';
    return { title: f.title, html };
  }

  /* ======================= EVENT ======================= */
  function event(id) {
    const ev = Store.event(id);
    if (!ev) return notFound('That event does not exist, or it was removed by the organizers.');
    const f = Store.fest(ev.festId), st = Store.state(ev), notes = Store.notesFor(ev.id);
    const unit = ev.teamMax > 1 ? 'teams' : 'seats';
    const ink = 'var(--' + f.ink + ')';

    const facts = [
      ['When', Fmt.long(ev.startsAt) + ', ' + Fmt.time(ev.startsAt) + T(' to ', ' থেকে ') + Fmt.time(ev.endsAt)],
      ['Where', ev.venue],
      ['Register by', Fmt.when(ev.deadline)],
      ['Entry fee', Fmt.money(ev.fee) + (ev.fee ? (ev.teamMax > 1 ? T(' per team', ' (প্রতি দল)') : '') + T(', by ', ', ') + [...Store.payMethods().map((m) => m.type), ...(ev.allowCash ? [T('cash at the desk', 'ডেস্কে নগদ')] : [])].join(', ').replace(/, ([^,]*)$/, T(' or $1', ' অথবা $1')) + T('', ' এর মাধ্যমে') : '')],
      ['Team size', Fmt.team(ev)],
      ['Capacity', T(ev.capacity + ' ' + unit + (ev.waitlist ? ', plus ' + ev.waitlist + ' on the waitlist' : ''), ev.capacity + (ev.teamMax > 1 ? 'টি দল' : 'টি আসন') + (ev.waitlist ? ', সাথে অপেক্ষমাণ তালিকায় ' + ev.waitlist : ''))]
    ];

    const left = '<div class="ev-head">' +
      '<nav class="crumbs" aria-label="Breadcrumb"><a href="#/">Events</a><span aria-hidden="true">/</span><a href="#/fests/' + f.id + '">' + esc(f.title) + '</a><span aria-hidden="true">/</span><span>' + esc(ev.title) + '</span></nav>' +
      '<span class="ev-cat">' + esc(ev.category) + '</span><h1 class="h1">' + esc(ev.title) + '</h1>' +
      '<p class="ev-summary">' + esc(ev.summary) + '</p>' + whoComing(ev) + '</div>' +
      '<dl class="ev-facts">' + facts.map(([k, v]) => '<div><dt>' + k + '</dt><dd>' + esc(v) + '</dd></div>').join('') + '</dl>' +
      (notes.length ? '<div class="ev-section"><h2 class="h3">From the organizers</h2>' + notes.map((n) => '<div class="notice"><p>' + esc(n.text) + '</p><time>' + T('Posted ', 'প্রকাশ: ') + Fmt.ago(n.createdAt) + '</time></div>').join('') + '</div>' : '') +
      '<div class="ev-section prose"><h2 class="h3">About</h2>' + paras(ev.description) + '</div>' +
      (ev.rules && ev.rules.length ? '<div class="ev-section prose"><h2 class="h3">Rules</h2><ul>' + ev.rules.map((r) => '<li>' + esc(r) + '</li>').join('') + '</ul></div>' : '') +
      (ev.prizes && ev.prizes.length ? '<div class="ev-section"><h2 class="h3">Prizes</h2><div class="prizes">' + ev.prizes.map((p) => '<div class="prize"><b>' + esc(p.amount || p[0]) + '</b><span>' + esc(p.label || p[1]) + '</span></div>').join('') + '</div></div>' : '');

    const html = '<div class="wrap page-event" style="--ink:' + ink + '"><div class="ev-wrap"><div>' + left + '</div>' +
      '<aside class="booth" id="booth" aria-label="Registration">' + boothTop(ev, st) + '<div class="booth-body">' + boothBody(ev, st) + '</div></aside></div>' +
      (st.canRegister && !Store.walletTickets().some((r) => r.eventId === ev.id && !['cancelled', 'rejected'].includes(r.status)) ? '<button class="m-cta btn btn-ink" type="button" data-to-booth>' + (st.key === 'waitlist' ? 'Join the waitlist' : 'Register') + ', ' + (st.left ? st.left + ' ' + unit + ' left' : st.wl + ' waiting') + '</button>' : '') + '</div>';

    let timer, io;
    return {
      title: ev.title,
      html,
      dirty: false,
      mount(root) {
        const view = this;
        if (Router.lastPath !== '/events/' + ev.id) Store.track('event_view', { ev: ev.id });
        const cd = $('[data-countdown]', root);
        if (cd) {
          const tick = () => {
            const d = Math.max(0, ev.deadline - Date.now());
            const parts = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60, Math.floor(d / 1e3) % 60];
            $$('b', cd).forEach((b, i) => { b.textContent = String(parts[i]).padStart(2, '0'); });
          };
          tick(); timer = setInterval(tick, 1000);
        }
        const form = $('#reg-form', root);
        if (form) wireForm(form, ev, () => { view.dirty = true; });
        const cta = $('[data-to-booth]', root), booth = $('#booth', root);
        if (cta && 'IntersectionObserver' in window) {
          io = new IntersectionObserver(([en]) => cta.classList.toggle('away', en.isIntersecting), { threshold: 0.05 });
          io.observe(booth);
          cta.addEventListener('click', () => { booth.scrollIntoView({ behavior: 'smooth', block: 'start' }); setTimeout(() => { const f = $('#reg-form input', root); f && f.focus({ preventScroll: true }); }, 500); });
        }
      },
      unmount() { clearInterval(timer); if (io) io.disconnect(); }
    };
  }

  function promoStrip(ev) {
    if (!ev.fee) return '';
    const p = Store.publicPromos(ev)[0]; if (!p) return '';

  function boothBody(ev, st) {
