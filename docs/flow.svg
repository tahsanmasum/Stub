<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="How Stub works: browse, register, pay, verify, check in">
<title>How Stub works — browse, register, pay by bKash, organizer verifies, QR check-in</title>
<style>
  .bg{fill:#FBF7F1}
  .ink{fill:#1B1210}.mut{fill:#6A5848}.acc{fill:#FF5A2C}
  .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .serif{font-family:Georgia,'Times New Roman',serif}
  .node{fill:#fff;stroke:#E8DED1;stroke-width:2}
  .ic{fill:none;stroke:#6A5848;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  .track{stroke:#EBE1D4;stroke-width:3;stroke-linecap:round}

  .fillbar{stroke:#FF5A2C;stroke-width:3;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 8s linear infinite}
  @keyframes draw{
    0%,4%{stroke-dashoffset:1000}24%,28%{stroke-dashoffset:750}44%,48%{stroke-dashoffset:500}
    64%,68%{stroke-dashoffset:250}84%,100%{stroke-dashoffset:0}
  }
  .dot{animation:run 8s linear infinite}
  @keyframes run{
    0%,4%{transform:translateX(0)}24%,28%{transform:translateX(250px)}44%,48%{transform:translateX(500px)}
    64%,68%{transform:translateX(750px)}84%,100%{transform:translateX(1000px)}
  }
  .halo{opacity:.85;animation:ping 8s linear infinite}
  @keyframes ping{
    0%,3%{r:11;opacity:.5}6%{r:26;opacity:0}6.01%,23%{r:11;opacity:.5}
    26%{r:26;opacity:0}26.01%,43%{r:11;opacity:.5}46%{r:26;opacity:0}
    46.01%,63%{r:11;opacity:.5}66%{r:26;opacity:0}66.01%,83%{r:11;opacity:.5}86%{r:26;opacity:0}86.01%,100%{r:11;opacity:0}
  }
  .ring{fill:none;stroke:#FF5A2C;stroke-width:2.5;opacity:0}
  .lift{transform-box:fill-box;transform-origin:center}
  .r1{animation:lit 8s linear infinite -7.9s}
  .r2{animation:lit 8s linear infinite -6.3s}
  .r3{animation:lit 8s linear infinite -4.7s}
  .r4{animation:lit 8s linear infinite -3.1s}
  .r5{animation:lit 8s linear infinite -1.5s}
  @keyframes lit{0%{opacity:0;transform:scale(.9)}2%{opacity:1;transform:scale(1)}16%{opacity:1;transform:scale(1)}22%{opacity:0;transform:scale(1.05)}100%{opacity:0}}
  .t1{animation:tint 8s linear infinite -7.9s}
  .t2{animation:tint 8s linear infinite -6.3s}
  .t3{animation:tint 8s linear infinite -4.7s}
  .t4{animation:tint 8s linear infinite -3.1s}
  .t5{animation:tint 8s linear infinite -1.5s}
  @keyframes tint{0%{fill:#6A5848}2%,16%{fill:#FF5A2C}24%,100%{fill:#6A5848}}
  .s1{animation:stroketint 8s linear infinite -7.9s}
  .s2{animation:stroketint 8s linear infinite -6.3s}
  .s3{animation:stroketint 8s linear infinite -4.7s}
  .s4{animation:stroketint 8s linear infinite -3.1s}
  .s5{animation:stroketint 8s linear infinite -1.5s}
  @keyframes stroketint{0%{stroke:#6A5848}2%,16%{stroke:#FF5A2C}24%,100%{stroke:#6A5848}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}.fillbar{stroke-dashoffset:0}}
</style>

<rect class="bg" width="1280" height="280"/>
<text x="150" y="46" class="serif ink" font-size="24" font-weight="700">How a registration travels</text>
<text x="150" y="70" class="sans mut" font-size="14.5">One pass from a phone on the bus to a scanned ticket at the gate.</text>

<path class="track" d="M150 150 H1150"/>
<path class="fillbar" d="M150 150 H1150"/>

<!-- 1 browse -->
<g class="r1"><circle class="ring" cx="150" cy="150" r="40"/></g>
<circle class="node" cx="150" cy="150" r="32"/>
<g class="ic s1"><circle cx="146" cy="146" r="8.5"/><path d="M152.5 152.5 L158 158"/></g>
<text x="150" y="212" class="sans t1" font-size="15" font-weight="700" text-anchor="middle">Browse</text>
<text x="150" y="232" class="sans mut" font-size="12.5" text-anchor="middle">Filter 11 events</text>

<!-- 2 register -->
<g class="r2"><circle class="ring" cx="400" cy="150" r="40"/></g>
<circle class="node" cx="400" cy="150" r="32"/>
<g class="ic s2"><rect x="390" y="139" width="20" height="23" rx="2.5"/><path d="M394.5 146h11M394.5 151h11M394.5 156h6"/></g>
<text x="400" y="212" class="sans t2" font-size="15" font-weight="700" text-anchor="middle">Register</text>
<text x="400" y="232" class="sans mut" font-size="12.5" text-anchor="middle">Team + invite link</text>

<!-- 3 pay -->
<g class="r3"><circle class="ring" cx="650" cy="150" r="40"/></g>
<circle class="node" cx="650" cy="150" r="32"/>
<text x="650" y="159" class="sans s3" font-size="25" font-weight="700" text-anchor="middle" fill="#6A5848" style="animation:tint 8s linear infinite -4.7s">৳</text>
<text x="650" y="212" class="sans t3" font-size="15" font-weight="700" text-anchor="middle">Pay</text>
<text x="650" y="232" class="sans mut" font-size="12.5" text-anchor="middle">bKash TrxID</text>

<!-- 4 verify -->
<g class="r4"><circle class="ring" cx="900" cy="150" r="40"/></g>
<circle class="node" cx="900" cy="150" r="32"/>
<g class="ic s4"><path d="M891 150.5 l6 6 l12 -13"/></g>
<text x="900" y="212" class="sans t4" font-size="15" font-weight="700" text-anchor="middle">Verify</text>
<text x="900" y="232" class="sans mut" font-size="12.5" text-anchor="middle">Match statement</text>

<!-- 5 check-in -->
<g class="r5"><circle class="ring" cx="1150" cy="150" r="40"/></g>
<circle class="node" cx="1150" cy="150" r="32"/>
<g class="ic s5"><rect x="1139" y="139" width="9" height="9" rx="1.5"/><rect x="1152" y="139" width="9" height="9" rx="1.5"/><rect x="1139" y="152" width="9" height="9" rx="1.5"/><path d="M1152 152h4M1156 156h5M1152 160h9"/></g>
<text x="1150" y="212" class="sans t5" font-size="15" font-weight="700" text-anchor="middle">Check in</text>
<text x="1150" y="232" class="sans mut" font-size="12.5" text-anchor="middle">Scan at the gate</text>

<!-- travelling dot -->
<g class="dot">
  <circle class="halo acc" cx="150" cy="150" r="11"/>
  <circle class="acc" cx="150" cy="150" r="7.5"/>
  <circle cx="150" cy="150" r="3" fill="#fff"/>
</g>
</svg>
