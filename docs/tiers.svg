<g class="itm i11"><circle cx="404" cy="312" r="3.2" fill="#e2136e"/><text x="418" y="316" class="sans ink" font-size="13.5">Promo codes</text></g>
<g class="itm i12"><circle cx="404" cy="342" r="3.2" fill="#e2136e"/><text x="418" y="346" class="sans ink" font-size="13.5">Team invite links</text></g>
<g class="itm i13"><circle cx="404" cy="372" r="3.2" fill="#e2136e"/><text x="418" y="376" class="sans ink" font-size="13.5">Automatic waitlist</text></g>
<g class="itm i14"><circle cx="404" cy="402" r="3.2" fill="#e2136e"/><text x="418" y="406" class="sans ink" font-size="13.5">Printable ID badges</text></g>
<text x="418" y="436" class="sans mut itm m1" font-size="13">+4 more</text>
</g>
<g class="card c2">
<rect x="680" y="126" width="272" height="330" rx="16" fill="#fff" stroke="#EDE3D6" stroke-width="1.5"/>
<rect x="680" y="126" width="272" height="5" rx="2.5" fill="#8b5cf6"/>
<text x="702" y="180" class="serif" font-size="30" font-weight="700" fill="#8b5cf6" opacity=".3">03</text>
<text x="702" y="218" class="serif ink" font-size="22" font-weight="700">Extra</text>
<rect x="702" y="230" width="86" height="24" rx="12" fill="#8b5cf6" opacity=".12"/>
<text x="745" y="246" class="sans" font-size="12.5" font-weight="700" fill="#8b5cf6" text-anchor="middle">9 features</text>
<g class="itm i20"><circle cx="708" cy="282" r="3.2" fill="#8b5cf6"/><text x="722" y="286" class="sans ink" font-size="13.5">Participant accounts</text></g>
<g class="itm i21"><circle cx="708" cy="312" r="3.2" fill="#8b5cf6"/><text x="722" y="316" class="sans ink" font-size="13.5">Certificates</text></g>
<g class="itm i22"><circle cx="708" cy="342" r="3.2" fill="#8b5cf6"/><text x="722" y="346" class="sans ink" font-size="13.5">Confirmation emails</text></g>
<g class="itm i23"><circle cx="708" cy="372" r="3.2" fill="#8b5cf6"/><text x="722" y="376" class="sans ink" font-size="13.5">Homepage news</text></g>
<g class="itm i24"><circle cx="708" cy="402" r="3.2" fill="#8b5cf6"/><text x="722" y="406" class="sans ink" font-size="13.5">Walk-in registration</text></g>
<text x="722" y="436" class="sans mut itm m2" font-size="13">+4 more</text>
</g>
<g class="card c3">
<rect x="984" y="126" width="272" height="330" rx="16" fill="#fff" stroke="#EDE3D6" stroke-width="1.5"/>
<rect x="984" y="126" width="272" height="5" rx="2.5" fill="#2f7a3a"/>
<text x="1006" y="180" class="serif" font-size="30" font-weight="700" fill="#2f7a3a" opacity=".3">04</text>
<text x="1006" y="218" class="serif ink" font-size="22" font-weight="700">Polish</text>
<rect x="1006" y="230" width="86" height="24" rx="12" fill="#2f7a3a" opacity=".12"/>
<text x="1049" y="246" class="sans" font-size="12.5" font-weight="700" fill="#2f7a3a" text-anchor="middle">8 features</text>
<g class="itm i30"><circle cx="1012" cy="282" r="3.2" fill="#2f7a3a"/><text x="1026" y="286" class="sans ink" font-size="13.5">Add to calendar</text></g>
<g class="itm i31"><circle cx="1012" cy="312" r="3.2" fill="#2f7a3a"/><text x="1026" y="316" class="sans ink" font-size="13.5">CSV exports</text></g>
<g class="itm i32"><circle cx="1012" cy="342" r="3.2" fill="#2f7a3a"/><text x="1026" y="346" class="sans ink" font-size="13.5">Visit heatmap</text></g>
<g class="itm i33"><circle cx="1012" cy="372" r="3.2" fill="#2f7a3a"/><text x="1026" y="376" class="sans ink" font-size="13.5">School leaderboard</text></g>
<g class="itm i34"><circle cx="1012" cy="402" r="3.2" fill="#2f7a3a"/><text x="1026" y="406" class="sans ink" font-size="13.5">Announcement bar</text></g>
<text x="1026" y="436" class="sans mut itm m3" font-size="13">+3 more</text>
