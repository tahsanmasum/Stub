  @keyframes slide{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:translateX(0)}}
  .head{opacity:0;animation:slide .7s ease-out .05s forwards}
  .foot{opacity:0;animation:slide .6s ease-out 2.4s forwards}
    .i00{animation-delay:0.53s}
  .i01{animation-delay:0.60s}
  .i02{animation-delay:0.67s}
  .i03{animation-delay:0.74s}
  .i04{animation-delay:0.81s}
  .c0{animation-delay:0.35s}
  .i10{animation-delay:0.81s}
  .i11{animation-delay:0.88s}
  .i12{animation-delay:0.95s}
  .i13{animation-delay:1.02s}
  .i14{animation-delay:1.09s}
  .m1{animation-delay:1.16s}
  .c1{animation-delay:0.63s}
  .i20{animation-delay:1.09s}
  .i21{animation-delay:1.16s}
  .i22{animation-delay:1.23s}
  .i23{animation-delay:1.30s}
  .i24{animation-delay:1.37s}
  .m2{animation-delay:1.44s}
  .c2{animation-delay:0.91s}
  .i30{animation-delay:1.37s}
  .i31{animation-delay:1.44s}
  .i32{animation-delay:1.51s}
  .i33{animation-delay:1.58s}
  .i34{animation-delay:1.65s}
  .m3{animation-delay:1.72s}
  .c3{animation-delay:1.19s}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect class="bg" width="1280" height="520"/>
<g class="head">
  <text x="72" y="60" class="serif ink" font-size="27" font-weight="700">Bonus work, ranked</text>
  <text x="72" y="88" class="sans mut" font-size="14">The rulebook gives 30 points for creative work. Here are 31 of them, ordered by how much each changes the day.</text>
</g>
<g class="card c0">
<rect x="72" y="126" width="272" height="330" rx="16" fill="#fff" stroke="#EDE3D6" stroke-width="1.5"/>
<rect x="72" y="126" width="272" height="5" rx="2.5" fill="#FF5A2C"/>
<text x="94" y="180" class="serif" font-size="30" font-weight="700" fill="#FF5A2C" opacity=".3">01</text>
<text x="94" y="218" class="serif ink" font-size="22" font-weight="700">Signature</text>
<rect x="94" y="230" width="86" height="24" rx="12" fill="#FF5A2C" opacity=".12"/>
<text x="137" y="246" class="sans" font-size="12.5" font-weight="700" fill="#FF5A2C" text-anchor="middle">5 features</text>
<g class="itm i00"><circle cx="100" cy="282" r="3.2" fill="#FF5A2C"/><text x="114" y="286" class="sans ink" font-size="13.5">bKash payment desk</text></g>
<g class="itm i01"><circle cx="100" cy="312" r="3.2" fill="#FF5A2C"/><text x="114" y="316" class="sans ink" font-size="13.5">QR camera check-in</text></g>
<g class="itm i02"><circle cx="100" cy="342" r="3.2" fill="#FF5A2C"/><text x="114" y="346" class="sans ink" font-size="13.5">Live drop-off monitor</text></g>
<g class="itm i03"><circle cx="100" cy="372" r="3.2" fill="#FF5A2C"/><text x="114" y="376" class="sans ink" font-size="13.5">বাংলা + English</text></g>
<g class="itm i04"><circle cx="100" cy="402" r="3.2" fill="#FF5A2C"/><text x="114" y="406" class="sans ink" font-size="13.5">AI help desk (Groq)</text></g>
</g>
<g class="card c1">
<rect x="376" y="126" width="272" height="330" rx="16" fill="#fff" stroke="#EDE3D6" stroke-width="1.5"/>
<rect x="376" y="126" width="272" height="5" rx="2.5" fill="#e2136e"/>
<text x="398" y="180" class="serif" font-size="30" font-weight="700" fill="#e2136e" opacity=".3">02</text>
<text x="398" y="218" class="serif ink" font-size="22" font-weight="700">Major</text>
<rect x="398" y="230" width="86" height="24" rx="12" fill="#e2136e" opacity=".12"/>
<text x="441" y="246" class="sans" font-size="12.5" font-weight="700" fill="#e2136e" text-anchor="middle">9 features</text>
