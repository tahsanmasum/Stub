<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="30 bonus features ranked into four tiers">
<title>Bonus work, ranked — 30 extra features in four tiers</title>
<style>
  .bg{fill:#FBF7F1} .ink{fill:#1B1210} .mut{fill:#6A5848}
  .serif{font-family:Georgia,'Times New Roman',serif}
  .sans{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  .card{opacity:0;animation:rise .8s cubic-bezier(.22,1,.36,1) forwards}
